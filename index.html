  body.mode-practice.mobile-show-right .mobile-overlay{display:block}

  /* —— 学习笔记：标签搜索框 + 抽查卡片 80% + 两行操作 —— */
  .toolbar{flex-wrap:wrap}
  .note-tag-search{flex:1 1 100%;max-width:none;order:3;height:36px;font-size:14px;margin-top:2px}
  /* 抽查卡片：屏幕比例 80%（高） */
  .quiz-shell{max-width:none}
  .quiz-mask{padding:16px;overflow-y:auto;-webkit-overflow-scrolling:touch}
  .quiz-shell{min-height:min-content;padding-bottom:8px}
  .quiz-inner{height:80vh;max-height:80vh}
  .quiz-face{padding:22px 20px}
  .qf-title{font-size:18px;line-height:1.55}
  .qb-body{font-size:15px;line-height:1.9;margin:12px 0}
  /* 抽查操作区两行 */
  .quiz-ctrl-grid{flex-direction:column;gap:10px}
  .quiz-ctrl-grid .qc-row1,.quiz-ctrl-grid .qc-row2{display:flex;align-items:center;gap:10px;width:100%}

  /* —— 顶部黑底栏：手机窄屏修复内容叠加（crumb 收缩 + 搜索框缩窄靠右） —— */
  .crumb{flex:1;min-width:0;max-width:calc(100% - 190px)}
  .tb-search{position:static;transform:none;width:110px;flex:0 0 auto;margin-right:52px !important;margin-left:6px;font-size:12px}
  .topbar-brand{right:10px}
}

  /* 强制隐藏侧边栏我的错题数量角标 */
  .sb-item[data-view="wrong"]::after,
  .sb-item[data-view="wrong"]::before,
  .sb-item[data-view="wrong"] .sb-badge,
  .sb-item[data-view="wrong"] span:not(.sb-txt),
  .sb-item[data-view="wrong"] b,
  .sb-item[data-view="wrong"] em {
    display: none !important;
  }



  /* 答题卡左栏卡片圆角处边框显示修复 */
  .col-left.sticky .card {
    overflow: hidden;
  }

/* 答题卡内容居中：进度条和题号格组保持满宽 */
body.mode-practice .card-b .legend{width:200px !important;max-width:200px !important}
body.mode-practice .card-b .pb-row1,body.mode-practice .card-b .pb-row2{width:200px !important;max-width:200px !important}

/* 答题卡卡片隐藏滚动条（保留滚动功能） */
.col-left.sticky .card-b{scrollbar-width:none}
.col-left.sticky .card-b::-webkit-scrollbar{width:0;height:0;display:none}

/* 题号格：32x32，数字5px，列间距6px，容器宽度自动 */
body.mode-practice .card-b .sheet{grid-template-columns:repeat(5,32px)!important;gap:6px!important;justify-content:center!important;width:fit-content!important;margin:0 auto!important}
body.mode-practice .card-b .sheet .cell{width:32px!important;height:32px!important;font-size:10px!important;font-weight:400!important;min-width:32px!important;min-height:32px!important}
body.mode-practice .card-b .sheet-group{width:fit-content!important;max-width:210px!important}
body.mode-practice .card-b .sheet-group-h{text-align:center!important;justify-content:center!important}

/* 题号格内部文字：继承字号，取消加粗，禁止换行 */
body.mode-practice .card-b .sheet .cell .cell-no{font-size:inherit!important;font-weight:inherit!important;white-space:nowrap!important;display:inline!important;width:auto!important;line-height:1!important}

/* 交卷行内部按钮宽度自动 */
body.mode-practice .card-b .pb-row1>*{flex:1 1 auto!important;width:auto!important;min-width:0!important}

/* 答题卡页面：隐藏难度星级和试卷名称 */
body.mode-practice .q-head .diff,body.mode-practice .q-head #pr-meta{display:none !important}
/* 题干增加上下滚动 */
body.mode-practice .stem{max-height:200px !important;overflow-y:auto !important;scrollbar-width:thin}
body.mode-practice .stem::-webkit-scrollbar{width:6px}
body.mode-practice .stem::-webkit-scrollbar-thumb{background:rgba(192,59,43,.25);border-radius:3px}
</style>

<script>
  function toggleCh(id){
    var el = document.getElementById(id);
    el.classList.toggle('open');
  }
  /* 分段筛选的真实过滤由 renderer.js 的 renderChapters 处理（基于章节/关卡的练习状态） */


  /* 筛选下拉：点击展开 / 点击外部收起 */
  function toggleMenu(btn){
    var menu = btn.parentNode.querySelector('.menu');
    var isOpen = menu && menu.classList.contains('open');
    closeAll();
    if(menu && !isOpen){ menu.classList.add('open'); btn.classList.add('act'); }
  }
  function closeAll(){
    document.querySelectorAll('.menu.open').forEach(function(m){m.classList.remove('open')});
    document.querySelectorAll('.sel.act').forEach(function(s){s.classList.remove('act')});
  }
  document.addEventListener('click', function(e){
    if(!e.target.closest('.dd')) closeAll();
  });
  /* 下拉选项：回写按钮文案 */
  document.querySelectorAll('.menu button').forEach(function(op){
    op.addEventListener('click', function(){
      var menu = op.parentNode, dd = menu.parentNode, sel = dd.querySelector('.sel');
      menu.querySelectorAll('button').forEach(function(x){x.classList.remove('on')});
      op.classList.add('on');
      var label = sel.textContent.split('：')[0].trim();
      var val = op.textContent.replace(/\s*\d+\s*$/,'').trim();
      sel.innerHTML = label + '：' + val + '<svg viewBox="0 0 24 24" fill="none" stroke="#475569" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9.5l6 6 6-6"/></svg>';
      closeAll();
    });
  });
  /* 分段筛选态 */
  document.querySelectorAll('.seg button').forEach(function(b){
    b.addEventListener('click', function(){
      b.parentNode.querySelectorAll('button').forEach(function(x){x.classList.remove('on')});
      b.classList.add('on');
    });
  });
</script>

<script>
/* 小小红书版A：把「小小红书 + 累计收录」并入今日语录黑底卡片 */
(function(){
  function rbCoverInit(){
    var cover=document.querySelector('.rb-cover');
    if(!cover) return;
    if(cover.querySelector('.rb-cover-top')) return;
    var top=document.createElement('div'); top.className='rb-cover-top';
    var title=document.createElement('span'); title.className='rb-cover-title'; title.textContent='今日语录';
    var meta=document.createElement('span'); meta.className='rb-cover-meta'; meta.id='rb-cover-meta'; meta.innerHTML='累计收录 <b>0</b> 条';
    top.appendChild(title); top.appendChild(meta);
    cover.insertBefore(top, cover.firstChild);
    var stats=document.getElementById('rb-stats');
    function sync(){
      var m=document.getElementById('rb-cover-meta');
      if(m && stats && stats.children.length){ m.innerHTML = stats.children[0].innerHTML; }
    }
    sync();
    if(stats && typeof MutationObserver!=='undefined'){
      new MutationObserver(sync).observe(stats,{childList:true,subtree:true,characterData:true});
    }
  }
  document.addEventListener('DOMContentLoaded', rbCoverInit);
  if(document.readyState!=='loading') rbCoverInit();
  window.addEventListener('hashchange', function(){ setTimeout(rbCoverInit,50); });
  if(window.MutationObserver){
    new MutationObserver(function(){ setTimeout(rbCoverInit,30); }).observe(document.body,{childList:true,subtree:true});
  }
})();
/* 学习中心上栏：左「学习中心」+ 右当日日期 */
(function(){
  function heroTopInit(){
    var hero=document.querySelector('.hero');
    if(!hero || hero.querySelector('.hero-top')) return;
    var top=document.createElement('div'); top.className='hero-top';
    var title=document.createElement('span'); title.className='hero-title'; title.textContent='小小红书';
    title.title='跳转小小红书';
    title.addEventListener('click', function(){ try{location.hash='#redbook';}catch(e){} });
    var d=new Date();
    function p(n){return (n<10?'0':'')+n;}
    var ds=d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate())+' '+p(d.getHours())+':'+p(d.getMinutes());
    var date=document.createElement('span'); date.className='hero-date'; date.textContent=ds;
    top.appendChild(title); top.appendChild(date);
    hero.insertBefore(top, hero.firstChild);
  }
  document.addEventListener('DOMContentLoaded', heroTopInit);
  if(document.readyState!=='loading') heroTopInit();
  window.addEventListener('hashchange', function(){ setTimeout(heroTopInit,50); });
  if(window.MutationObserver){
    new MutationObserver(function(){ setTimeout(heroTopInit,30); }).observe(document.body,{childList:true,subtree:true});
  }
})();
</script>

    '<div class="dp-h"><span class="d"></span><span id="dm-panel-name">模块</span></div>'+
    '<div class="dp-row"><div class="lbl"><span>圆角</span><b id="dm-v-radius">10</b></div><input type="range" id="dm-r-radius" min="0" max="24" value="10"></div>'+
    '<div class="dp-row"><div class="lbl"><span>内边距</span><b id="dm-v-pad">10</b></div><input type="range" id="dm-r-pad" min="0" max="32" value="10"></div>'+
    '<div class="dp-row"><div class="lbl"><span>字号</span><b id="dm-v-fs">13</b></div><input type="range" id="dm-r-fs" min="11" max="20" value="13"></div>'+
    '<div class="dp-row"><div class="lbl"><span>背景色</span></div><div class="dp-swatches" id="dm-swatches-bg"></div></div>'+
    '<div class="dp-row"><div class="lbl"><span>边框色</span></div><div class="dp-swatches" id="dm-swatches-bd"></div></div>'+
    '<div class="dp-actions" style="display:flex;gap:8px;margin-top:12px;padding-top:10px;border-top:1px dashed #ECE6DE">'+
      '<button id="dm-hide" style="flex:1;padding:6px 0;border-radius:7px;border:1px solid #E4E0DA;background:#fff;font-size:11.5px;cursor:pointer;color:#3A3735">隐藏模块</button>'+
      '<button id="dm-remove" style="flex:1;padding:6px 0;border-radius:7px;border:1px solid rgba(192,59,43,.3);background:#FFF5F3;font-size:11.5px;cursor:pointer;color:#C03B2B">移除模块</button>'+
    '</div>';
  document.body.appendChild(panel);

  var curMod=null, curSel='';
  function selId(el){ if(el.id) return '#'+el.id; var c=el.className; if(typeof c==='string'){ var cls=c.split(/\s+/).filter(Boolean)[0]; if(cls) return '.'+cls; } return '#'+(el.getAttribute('data-view')||'el-'+Math.random().toString(36).slice(2,7)); }
  function getProps(el){
    var cs=getComputedStyle(el);
    return { radius: Math.round(parseFloat(cs.borderTopLeftRadius)||0), pad: Math.round(parseFloat(cs.paddingTop)||0), fs: Math.round(parseFloat(cs.fontSize)||13), bg: rgbToHex(cs.backgroundColor), border: rgbToHex(cs.borderTopColor) };
  }
  function rgbToHex(rgb){ var m=(rgb||'').match(/\d+/g); if(!m||m.length<3) return '#FFFFFF'; return '#'+[m[0],m[1],m[2]].map(function(n){ var h=parseInt(n).toString(16); return h.length<2?'0'+h:h; }).join('').toUpperCase(); }
  function apply(el, key, val){
    if(key==='radius') el.style.borderRadius=val+'px';
    if(key==='pad') el.style.padding=val+'px '+(val>6?val+2:val)+'px';
    if(key==='fs'){ el.style.fontSize=val+'px'; }
    if(key==='bg') el.style.background=val;
    if(key==='border') el.style.borderColor=val;
  }
  function buildSwatches(container, colors, cur, cb){
    container.innerHTML='';
    colors.forEach(function(c){
      var s=document.createElement('div'); s.className='dp-swatch'+(c===cur?' sel':''); s.style.background=c;
      s.addEventListener('click', function(){ container.querySelectorAll('.dp-swatch').forEach(function(x){x.classList.remove('sel')}); s.classList.add('sel'); cb(c); });
      container.appendChild(s);
    });
  }
  function showPanel(el, sel){
    curMod=el; curSel=sel;
    var p=getProps(el);
    document.getElementById('dm-panel-name').textContent=sel;
    document.getElementById('dm-r-radius').value=p.radius; document.getElementById('dm-v-radius').textContent=p.radius;
    document.getElementById('dm-r-pad').value=p.pad; document.getElementById('dm-v-pad').textContent=p.pad;
    document.getElementById('dm-r-fs').value=p.fs; document.getElementById('dm-v-fs').textContent=p.fs;
    buildSwatches(document.getElementById('dm-swatches-bg'), RANGE_COLORS, p.bg, function(c){ apply(el,'bg',c); });
    buildSwatches(document.getElementById('dm-swatches-bd'), RANGE_BORDERS, p.border, function(c){ apply(el,'border',c); });
    panel.style.display='block';
  }
  document.getElementById('dm-r-radius').addEventListener('input', function(){ var v=+this.value; document.getElementById('dm-v-radius').textContent=v; if(curMod) apply(curMod,'radius',v); });
  document.getElementById('dm-r-pad').addEventListener('input', function(){ var v=+this.value; document.getElementById('dm-v-pad').textContent=v; if(curMod) apply(curMod,'pad',v); });
  document.getElementById('dm-r-fs').addEventListener('input', function(){ var v=+this.value; document.getElementById('dm-v-fs').textContent=v; if(curMod) apply(curMod,'fs',v); });
  document.getElementById('dm-panel-close').addEventListener('click', function(){ panel.style.display='none'; document.querySelectorAll('.design-mod.dm-sel').forEach(function(x){x.classList.remove('dm-sel')}); curMod=null; });
  document.getElementById('dm-hide').addEventListener('click', function(){ if(curMod){ curMod.style.display='none'; panel.style.display='none'; } });
  document.getElementById('dm-remove').addEventListener('click', function(){ if(curMod){ curMod.remove(); panel.style.display='none'; document.querySelectorAll('.design-mod.dm-sel').forEach(function(x){x.classList.remove('dm-sel')}); curMod=null; } });

  /* 标记可编辑模块（MutationObserver 持续补标，解决异步渲染的模块选不中） */
  function tagMod(el){
    if(el.classList.contains('design-mod')) return;
    el.classList.add('design-mod');
    if(!el.querySelector(':scope > .dm-tag')){
      var tag=document.createElement('span'); tag.className='dm-tag'; tag.textContent=selId(el).replace('#','');
      el.appendChild(tag);
    }
    el.addEventListener('click', function(e){
      e.stopPropagation();
      document.querySelectorAll('.design-mod.dm-sel').forEach(function(x){x.classList.remove('dm-sel')});
      el.classList.add('dm-sel');
      showPanel(el, selId(el));
    });
  }
  function initModules(){
    var sels='#practice-bar,.practice-bar,#sheet-card,#draft-section,#ans-section,#ans-card,.q-card,#q-card,.col-bar,.card,.hero,.stat-grid';
    document.querySelectorAll(sels).forEach(tagMod);
  }
  if(window.MutationObserver){
    new MutationObserver(function(){ initModules(); }).observe(document.body,{childList:true,subtree:true});
  }

  /* 三栏拖宽 */
  function initColResize(){
    function addResize(col, side, id){
      if(!col) return;
      var r=document.createElement('div'); r.className='design-colres'; r.id=id;
      r.style.cssText = side==='left' ? 'left:-5px' : 'right:-5px';
      col.appendChild(r);
      r.addEventListener('mousedown', function(e){
        e.preventDefault(); r.classList.add('dr-on');
        var cols=document.querySelector('.cols');
        var l=document.getElementById('col-left'), m=document.querySelector('.col-mid'), rr=document.getElementById('col-right');
        var startX=e.clientX, sl=l?l.getBoundingClientRect().width:260, sm=m?m.getBoundingClientRect().width:600, sr=rr?rr.getBoundingClientRect().width:320;
        function mv(ev){
          var dx=ev.clientX-startX;
          if(side==='left' && l){ var nw=Math.max(180,Math.min(480,sl+dx)); l.style.width=nw+'px'; l.style.flex='0 0 '+nw+'px'; }
          if(side==='right' && rr){ var nw2=Math.max(180,Math.min(480,sr-dx)); rr.style.width=nw2+'px'; rr.style.flex='0 0 '+nw2+'px'; }
          updateWidths();
        }
        function up(){ document.removeEventListener('mousemove',mv); document.removeEventListener('mouseup',up); r.classList.remove('dr-on'); }
        document.addEventListener('mousemove',mv); document.addEventListener('mouseup',up);
      });
    }
    addResize(document.getElementById('col-left'),'left','dm-r-left');
    addResize(document.getElementById('col-right'),'right','dm-r-right');
  }
  function updateWidths(){
    var l=document.getElementById('col-left'), m=document.querySelector('.col-mid'), r=document.getElementById('col-right');
    var set=function(id,v){ var el=document.getElementById(id); if(el) el.textContent=Math.round(v||0); };
    set('dm-w-l', l&&l.getBoundingClientRect().width);
    set('dm-w-m', m&&m.getBoundingClientRect().width);
    set('dm-w-r', r&&r.getBoundingClientRect().width);
  }

  /* 导出 */
  function exportDesign(){
    var l=document.getElementById('col-left'), m=document.querySelector('.col-mid'), r=document.getElementById('col-right');
    DESIGN.cols={ left:Math.round(l&&l.getBoundingClientRect().width||0), mid:Math.round(m&&m.getBoundingClientRect().width||0), right:Math.round(r&&r.getBoundingClientRect().width||0) };
    DESIGN.modules=[];
    document.querySelectorAll('.design-mod').forEach(function(el){
      var p=getProps(el);
      DESIGN.modules.push({ sel:selId(el), radius:p.radius, pad:p.pad, fs:p.fs, bg:p.bg, border:p.border });
    });
    var json=JSON.stringify(DESIGN,null,2);
    document.getElementById('dm-json').value=json;
    out.style.display='block';
  }
  document.getElementById('dm-export').addEventListener('click', exportDesign);
  document.getElementById('dm-copy').addEventListener('click', function(){
    var ta=document.getElementById('dm-json'); ta.focus(); ta.select();
    try{ document.execCommand('copy'); }catch(e){}
  });
  document.getElementById('dm-exit').addEventListener('click', function(){ location.href=location.pathname+location.hash; });

  /* 设计模式：拦截所有非设计模式的点击跳转，保持静态页面（只允许设计调整） */
  document.addEventListener('click', function(e){
    if(e.target.closest('.design-toolbar, .design-panel, .design-out, .design-colres, .design-tip, #dm-entry')) return;
    var mod = e.target.closest('.design-mod');
    if(mod){
      /* 可编辑模块内任何点击：阻止默认行为（不选答案/不跳转），手动选中该模块弹参数面板 */
      e.preventDefault(); e.stopPropagation(); e.stopImmediatePropagation();
      document.querySelectorAll('.design-mod.dm-sel').forEach(function(x){x.classList.remove('dm-sel')});
      mod.classList.add('dm-sel');
      showPanel(mod, selId(mod));
      return;
    }
    /* 非设计UI、非可编辑模块：完全拦截（不跳转、不切换页面） */
    e.preventDefault(); e.stopPropagation(); e.stopImmediatePropagation();
  }, true);

  /* 页面切换后重新初始化 */
  setTimeout(function(){ initModules(); initColResize(); updateWidths(); }, 400);
  setInterval(updateWidths, 800);
  window.addEventListener('hashchange', function(){ setTimeout(function(){ initModules(); initColResize(); }, 300); });
})();
</script>
<script>
/* 统一给所有黑底栏添加品牌标识（红点+题刷刷），搜索框自然在其左侧 */
(function(){
  function addBrand(){
    document.querySelectorAll('.topbar .tb-inner').forEach(function(inner){
      if(!inner.querySelector('.topbar-brand')){
        var brand = document.createElement('div');
        brand.className = 'topbar-brand';
        brand.innerHTML = '<span class="brand-dot"></span><span>题刷刷</span>';
        inner.appendChild(brand);
      }
    });
  }
  if(document.readyState === 'loading'){
    document.addEventListener('DOMContentLoaded', addBrand);
  } else {
    addBrand();
  }
  window.addEventListener('hashchange', function(){ setTimeout(addBrand, 150); });
})();
</script>
<div class="mobile-overlay" id="mobile-overlay"></div>
<!-- ========== 云端同步弹窗 ========== -->
<div class="sync-modal-mask" id="sync-modal-mask" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:99998;align-items:center;justify-content:center">
  <div class="sync-modal" id="sync-modal" style="background:#fff;border-radius:14px;padding:24px 26px;width:360px;box-shadow:0 10px 40px rgba(0,0,0,.25);font-family:system-ui,sans-serif">
    <div style="font-size:16px;font-weight:600;color:#1f2329;margin-bottom:4px">云端同步</div>
    <div style="font-size:13px;color:#7a7f87;margin-bottom:14px;line-height:1.6">输入在线访问口令，将本地数据与云端双向同步（含语录、错题、收藏等）</div>
    <input id="sync-pw" type="password" style="width:100%;box-sizing:border-box;padding:10px 12px;border:1px solid #d0d3d9;border-radius:8px;font-size:14px;outline:none" placeholder="访问口令"/>
    <div id="sync-err" style="color:#c0392b;font-size:12px;min-height:18px;margin:6px 0"></div>
    <div id="sync-result" style="margin-bottom:12px;display:none"></div>
    <div id="sync-loading" style="display:none;text-align:center;padding:16px 0">
      <div style="display:inline-block;width:28px;height:28px;border:3px solid #e5e7eb;border-top-color:#185FA5;border-radius:50%;animation:sync-spin 0.8s linear infinite"></div>
      <div style="font-size:13px;color:#6b7280;margin-top:8px">正在同步，请稍候...</div>
    </div>
    <style>@keyframes sync-spin{to{transform:rotate(360deg)}}</style>
    <div style="display:flex;gap:10px">
      <button id="sync-cancel" style="flex:1;padding:10px;border:1px solid #d0d3d9;border-radius:8px;background:#fff;color:#555;font-size:14px;cursor:pointer">取消</button>
      <button id="sync-ok" style="flex:1;padding:10px;border:0;border-radius:8px;background:#185FA5;color:#fff;font-size:14px;cursor:pointer">开始同步</button>
    </div>
  </div>
</div>
<script>
(function(){
  var mask = document.getElementById('sync-modal-mask');
  var pwInput = document.getElementById('sync-pw');
  var errEl = document.getElementById('sync-err');
  var resultEl = document.getElementById('sync-result');
  var loadingEl = document.getElementById('sync-loading');
  var okBtn = document.getElementById('sync-ok');
  var cancelBtn = document.getElementById('sync-cancel');

  function openSync(){
    mask.style.display = 'flex';
    pwInput.value = '';
    pwInput.style.display = '';
    errEl.textContent = '';
    resultEl.style.display = 'none';
    resultEl.innerHTML = '';
    loadingEl.style.display = 'none';
    okBtn.disabled = false;
    okBtn.textContent = '开始同步';
    okBtn.onclick = doSync;
    cancelBtn.style.display = '';
    cancelBtn.textContent = '取消';
    setTimeout(function(){ pwInput.focus(); }, 50);
  }
  function closeSync(){ mask.style.display = 'none'; }

  document.querySelectorAll('.sb-sync-btn').forEach(function(btn){
    btn.addEventListener('click', function(e){
      e.preventDefault();
      if(location.hostname !== 'localhost' && location.hostname !== '127.0.0.1'){
        alert('云端同步仅在本地版可用，请双击「双向同步.bat」或在本地版操作');
        return;
      }
      openSync();
    });
  });

  cancelBtn.addEventListener('click', closeSync);
  mask.addEventListener('click', function(e){ if(e.target === mask) closeSync(); });

  async function doSync(){
    var pw = pwInput.value.trim();
    if(!pw){ errEl.textContent = '请输入口令'; return; }
    errEl.textContent = '';
    pwInput.style.display = 'none';
    loadingEl.style.display = 'block';
    okBtn.disabled = true;
    okBtn.textContent = '同步中...';
    try{
      var startTime = Date.now();
      var res = await fetch('/api/sync', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ password: pw })
      });
      var data = await res.json();
      var elapsed = ((Date.now() - startTime) / 1000).toFixed(1);
      loadingEl.style.display = 'none';
      if(data.ok){
        resultEl.innerHTML = '<div style="background:#f0fdf4;border:1px solid #bbf7d0;border-radius:10px;padding:14px">' +
          '<div style="color:#15803d;font-weight:700;font-size:15px;margin-bottom:8px;display:flex;align-items:center;gap:6px">' +
          '<span style="display:inline-flex;width:20px;height:20px;background:#15803d;color:#fff;border-radius:50%;align-items:center;justify-content:center;font-size:12px">✓</span>' +
          '同步成功</div>' +
          '<div style="color:#166534;font-size:13px;line-height:2">' +
          '<div style="display:flex;justify-content:space-between"><span>上传到云端</span><span style="font-weight:600">' + data.up + ' 个文件</span></div>' +
          '<div style="display:flex;justify-content:space-between"><span>更新到本地</span><span style="font-weight:600">' + data.down + ' 个文件</span></div>' +
          '<div style="display:flex;justify-content:space-between"><span>同步耗时</span><span>' + elapsed + ' 秒</span></div>' +
          '</div></div>';
        resultEl.style.display = 'block';
        okBtn.textContent = '完成';
        okBtn.disabled = false;
        okBtn.onclick = closeSync;
        cancelBtn.style.display = 'none';
      } else {
        resultEl.innerHTML = '<div style="background:#fef2f2;border:1px solid #fecaca;border-radius:10px;padding:14px">' +
          '<div style="color:#b91c1c;font-weight:700;font-size:15px;margin-bottom:6px">✗ 同步失败</div>' +
          '<div style="color:#991b1b;font-size:13px">' + (data.error || '未知错误') + '</div></div>';
        resultEl.style.display = 'block';
        pwInput.style.display = '';
        okBtn.disabled = false;
        okBtn.textContent = '重试';
      }
    }catch(e){
      loadingEl.style.display = 'none';
      resultEl.innerHTML = '<div style="background:#fef2f2;border:1px solid #fecaca;border-radius:10px;padding:14px">' +
        '<div style="color:#b91c1c;font-weight:700;font-size:15px;margin-bottom:6px">✗ 网络错误</div>' +
        '<div style="color:#991b1b;font-size:13px">' + e.message + '</div></div>';
      resultEl.style.display = 'block';
      pwInput.style.display = '';
      okBtn.disabled = false;
      okBtn.textContent = '重试';
    }
  }
  okBtn.onclick = doSync;
  pwInput.addEventListener('keydown', function(e){ if(e.key === 'Enter') doSync(); });
})();
</script>
</body>
</html>

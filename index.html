<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>题刷刷</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%2322211F'/%3E%3Ccircle cx='16' cy='16' r='5' fill='%23C0392B'/%3E%3C/svg%3E">
<style>
/* ============================ 1. 设计令牌 ============================ */
:root{
  --color-primary-strong:#9E2F20;
  --color-secondary-strong:#8A2818;
  --color-surface:#FFFFFF;
  --color-surface-muted:#F0EEE8;
  --color-border:#E4E2DB;
  --color-text-primary:#2B2B28;
  --color-text-secondary:#6E6C66;
  --color-text-tertiary:#6E6C66;
  --color-success-text:#15803D;
  --color-success-soft:#DCFCE7;
  --color-danger:#EF4444;
  --color-danger-text:#B91C1C;
  --color-danger-soft:#FEE2E2;
  --gradient-brand-deep:linear-gradient(115deg,#8A2818 0%,#9E2F20 40%,#C03B2B 100%);
  --gradient-brand-soft:linear-gradient(135deg,#F7E6E2 0%,#FBEFE9 100%);
  --radius-card-sm:12px;
  --radius-btn:8px;
  --radius-pill:999px;
  --space-sm:8px;
  --space-md:16px;
  --space-lg:24px;
  --space-xl:32px;
  --shadow-raised:0 1px 3px rgba(43,40,38,.06);
  --shadow-floating:0 4px 16px rgba(43,40,38,.08);
  --font-body:"Inter","PingFang SC","HarmonyOS Sans SC","HarmonyOS Sans","Microsoft YaHei",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  --num:"Inter",-apple-system,"PingFang SC",sans-serif;
  --color-primary:#C03B2B;
  --color-secondary:#C03B2B;
  --color-secondary-deep:#6E1A10;
  --color-bg:#F4F3EF;
  --color-success:#22C55E;
  --gradient-brand:linear-gradient(135deg,#C03B2B 0%,#E2573D 100%);
  --gradient-blue:linear-gradient(112deg,#8A2818 0%,#C03B2B 55%,#E2573D 100%);
  --radius-card:16px;
  --color-primary-deep:#8A2818;
  --color-dot:#E4573D;
  --t-fast:80ms;
  --t-mid:150ms;
  --t-panel:200ms;
  --t-modal:180ms;
}

/* ============================ 2. 基础 ============================ */
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--color-bg); color:var(--color-text-primary);
  font-family:var(--font-body); font-size:16px; line-height:1.6;
  -webkit-font-smoothing:antialiased; -moz-osx-font-smoothing:grayscale;
}
h1,h2,h3,h4,p{margin:0}
a{color:var(--color-primary-strong);text-decoration:none}
button{font-family:inherit;cursor:pointer;border:0;background:none}
/* 焦点可见（WCAG 2.4.7） */
:where(a,button,input,summary,label,[tabindex]):focus-visible{
  outline:2px solid var(--color-secondary-strong);outline-offset:2px;border-radius:6px}
.num{font-family:var(--num);font-variant-numeric:tabular-nums;font-feature-settings:"tnum"}
.muted{color:var(--color-text-secondary)}

/* ============================ 3. 全局左侧边栏 ============================ */
.sidebar{
  position:fixed; left:0; top:0; width:240px; height:100vh; z-index:200;
  background:var(--color-surface); border-right:1px solid var(--color-border);
  display:flex; flex-direction:column;
}
.sb-brand{display:flex;align-items:center;gap:10px;padding:18px 20px 14px}
.sb-logo{width:34px;height:34px;flex:0 0 34px;border-radius:10px;background:var(--color-secondary);
  display:grid;place-items:center;box-shadow:0 2px 6px rgba(192,59,43,.30)}
.sb-name{font-size:15px;font-weight:700;letter-spacing:.2px;line-height:1.3}
.sb-sub{font-size:11px;font-weight:500;color:var(--color-text-secondary);line-height:1.4}
.sb-nav{flex:1;overflow-y:auto;padding:2px 12px 14px}
.sb-group{font-size:11px;font-weight:600;color:var(--color-text-secondary);letter-spacing:.10em;padding:14px 10px 6px;text-transform:uppercase}
.sb-item{position:relative;display:flex;align-items:center;gap:10px;height:40px;padding:0 10px;margin-bottom:2px;
  border-radius:var(--radius-btn);color:var(--color-text-secondary);font-size:14px;font-weight:500;transition:background .15s,color .15s}
.sb-item svg{width:18px;height:18px;flex:0 0 18px;stroke:currentColor;stroke-width:1.5;fill:none;stroke-linecap:round;stroke-linejoin:round}
.sb-item:hover{background:var(--color-surface-muted);color:var(--color-text-primary)}
.sb-item.is-active{background:rgba(192,59,43,.12);color:var(--color-primary-strong);font-weight:600}
.sb-item.is-active::before{content:"";position:absolute;left:-12px;top:8px;bottom:8px;width:3px;
  border-radius:0 3px 3px 0;background:var(--color-primary-accent)}
.sb-badge{margin-left:auto;font-size:11px;font-weight:600;padding:1px 7px;border-radius:var(--radius-pill);
  background:var(--color-danger-soft);color:var(--color-danger-text);font-family:var(--num)}
.sb-foot{border-top:1px solid var(--color-border);padding:12px 14px;display:flex;align-items:center;gap:10px}
.sb-ava{width:32px;height:32px;flex:0 0 32px;border-radius:var(--radius-pill);background:var(--gradient-brand-deep);
  color:#fff;font-size:13px;font-weight:600;display:grid;place-items:center}
.sb-foot .n{font-size:13px;font-weight:600;line-height:1.3}
.sb-foot .r{font-size:11px;color:var(--color-text-secondary);line-height:1.4}

/* 左侧菜单折叠 */
.sb-toggle{width:28px;height:28px;border-radius:6px;display:grid;place-items:center;background:transparent;color:var(--color-text-secondary);border:1px solid transparent;margin-right:2px;transition:background .15s}
.sb-toggle:hover{background:var(--color-surface-muted);color:var(--color-text-primary)}
.sb-toggle svg{width:16px;height:16px;stroke:currentColor;stroke-width:2;fill:none;stroke-linecap:round;stroke-linejoin:round}
.sidebar{transition:width .2s ease,opacity .2s ease}
.sidebar.collapsed{width:0;padding:0;border:none;overflow:hidden;opacity:0}
.sidebar.collapsed .sb-brand,.sidebar.collapsed .sb-nav,.sidebar.collapsed .sb-foot{opacity:0}
.main{transition:margin-left .2s ease}
.main.expanded{margin-left:0}
/* 侧边栏收起时，主内容自动铺满 */
.sidebar.collapsed ~ #view-root .main{margin-left:0 !important}
.sb-toggle-float{position:fixed;left:0;top:18px;z-index:9999;width:30px;height:44px;border-radius:0 12px 12px 0;background:#fff;border:1px solid var(--color-border);border-left:none;box-shadow:var(--shadow-raised);display:grid;place-items:center;color:var(--color-text-secondary);transition:color .15s,background .15s;cursor:pointer}
.sb-toggle-float:hover{color:var(--color-primary-strong);background:var(--color-surface-muted)}
.sb-toggle-float svg{width:16px;height:16px;stroke:currentColor;stroke-width:2;fill:none;stroke-linecap:round;stroke-linejoin:round}
/* sb-toggle-float 一直显示 */

/* ============================ 4. 主区骨架 ============================ */
.main{margin-left:240px;min-height:100vh}
.page{max-width:1040px;margin:0 auto;padding:28px 32px 56px}

/* 顶部青蓝导航条（深青→蓝渐变，保证白字 AA） */
.topnav{position:sticky;top:0;z-index:150;background:var(--color-surface);color:var(--color-text-primary);border-bottom:1px solid var(--color-border);overflow:hidden}
.topnav::after{content:"";position:absolute;right:-60px;top:-90px;width:280px;height:280px;border-radius:50%;
  background:radial-gradient(circle,rgba(59,130,232,.10) 0%,rgba(59,130,232,0) 70%);pointer-events:none}
.tn-inner{position:relative;max-width:1040px;margin:0 auto;padding:0 32px;height:64px;display:flex;align-items:center;gap:16px}
.tn-title{font-size:16px;font-weight:700;letter-spacing:.2px}
.tn-dot{width:4px;height:4px;border-radius:50%;background:var(--color-border)}
.tn-sub{font-size:13px;color:var(--color-text-secondary)}
.tn-right{margin-left:auto;display:flex;align-items:center;gap:12px}
.tn-countdown{cursor:pointer;transition:border-color .15s,box-shadow .15s}
.tn-countdown:hover{border-color:var(--color-primary);box-shadow:var(--shadow-raised)}
.countdown{display:flex;align-items:baseline;gap:6px;background:var(--color-surface-muted);border:1px solid var(--color-border);border-radius:var(--radius-pill);
  padding:7px 16px 7px 14px;box-shadow:none}
.cd-label{font-size:12px;font-weight:500;color:var(--color-text-secondary)}
.cd-num{font-family:var(--num);font-variant-numeric:tabular-nums;font-size:20px;font-weight:800;
  color:var(--color-primary-strong);line-height:1}
.cd-unit{font-size:12px;font-weight:600;color:var(--color-primary-strong)}
.tn-btn{width:36px;height:36px;border-radius:var(--radius-btn);display:grid;place-items:center;
  background:var(--color-surface-muted);transition:background .15s}
.tn-btn:hover{background:var(--color-border)}
.tn-btn svg{width:18px;height:18px;stroke:var(--color-text-secondary);stroke-width:1.6;fill:none;stroke-linecap:round;stroke-linejoin:round}

/* ============================ 5. 通用组件 ============================ */
.page-head{display:flex;align-items:flex-end;gap:16px;margin-bottom:var(--space-xl)}
.page-head h1{font-size:32px;font-weight:700;line-height:1.2;letter-spacing:-.4px}
.page-head p{font-size:14px;color:var(--color-text-secondary);margin-top:6px}
.page-head .spacer{margin-left:auto}

.sec{margin-bottom:var(--space-xl)}
.sec-head{display:flex;align-items:center;gap:10px;margin-bottom:var(--space-md)}
.sec-head h2{font-size:20px;font-weight:600;line-height:1.3;letter-spacing:-.2px}
.sec-head .hint{font-size:13px;color:var(--color-text-secondary)}
.sec-head .more{margin-left:auto;font-size:13px;font-weight:600;color:var(--color-primary-strong)}
.sec-head .more:hover{text-decoration:underline}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:40px;padding:0 20px;
  border-radius:var(--radius-btn);font-size:14px;font-weight:600;transition:background .15s,box-shadow .15s,transform .15s}
.btn-sm{height:32px;padding:0 14px;font-size:13px}
.btn-primary{background:var(--color-secondary-strong);color:#fff}          /* 深蓝 + 白字 AA */
.btn-primary:hover{background:var(--color-secondary-deep)}
.btn-teal{background:var(--color-primary);color:var(--color-text-primary)} /* 浅青绿 + 深字 AA */
.btn-teal:hover{background:#B43222}
.btn-secondary{background:#fff;color:var(--color-text-primary);border:1px solid var(--color-border)}
.btn-secondary:hover{background:var(--color-surface-muted)}
.btn-ghost{color:var(--color-primary-strong)}
.btn-ghost:hover{background:rgba(192,59,43,.12)}

.chip{display:inline-flex;align-items:center;gap:4px;height:22px;padding:0 8px;border-radius:6px;
  font-size:12px;font-weight:600;font-family:var(--num)}
.chip-up{background:var(--color-success-soft);color:var(--color-success-text)}
.chip-down{background:var(--color-danger-soft);color:var(--color-danger-text)}
.chip-neutral{background:var(--color-surface-muted);color:var(--color-text-secondary)}

/* ============================ 6. 学习阶段大卡（2.5D 插图） ============================ */
.stage-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:var(--space-lg)}
.stage-card{background:var(--color-surface);border:1px solid var(--color-border);border-radius:var(--radius-card);
  box-shadow:var(--shadow-raised);overflow:hidden;display:flex;flex-direction:column;
  transition:transform .18s ease,box-shadow .18s ease}
.stage-card:hover{transform:translateY(-3px);box-shadow:var(--shadow-floating)}
.sc-illus{position:relative;height:146px;background:var(--gradient-brand-soft);display:grid;place-items:center}
.sc-illus svg{width:198px;height:138px;display:block}
.sc-step{position:absolute;left:16px;top:14px;display:inline-flex;align-items:center;gap:5px;height:24px;padding:0 10px;
  border-radius:var(--radius-pill);background:rgba(255,255,255,.92);color:var(--color-primary-strong);
  font-size:12px;font-weight:700;letter-spacing:.04em;font-family:var(--num);box-shadow:0 1px 2px rgba(43,40,38,.07)}
.sc-lock{position:absolute;right:14px;top:14px;display:inline-flex;align-items:center;gap:5px;height:24px;padding:0 10px;
  border-radius:var(--radius-pill);background:rgba(255,255,255,.92);color:var(--color-text-secondary);font-size:11px;font-weight:600}
.sc-lock svg{width:12px !important;height:12px !important;stroke:currentColor;stroke-width:2;fill:none}
.sc-body{padding:20px 20px 22px;display:flex;flex-direction:column;flex:1}
.sc-title{font-size:20px;font-weight:600;line-height:1.35;letter-spacing:-.2px}
.sc-desc{font-size:13px;color:var(--color-text-secondary);line-height:1.65;margin-top:6px;min-height:44px}
.sc-meta{display:flex;align-items:baseline;justify-content:space-between;margin-top:16px;font-size:12px;color:var(--color-text-secondary)}
.sc-meta b{font-family:var(--num);font-size:15px;font-weight:700;color:var(--color-text-primary)}
.bar{height:6px;border-radius:var(--radius-pill);background:var(--color-surface-muted);overflow:hidden;margin-top:8px}
.bar i{display:block;height:100%;border-radius:var(--radius-pill);background:var(--gradient-brand)}
.sc-foot{margin-top:18px}
.sc-foot .btn{width:100%}

/* ============================ 7. 功能卡（机考 / PK） ============================ */
.feat-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:var(--space-lg)}
.feat-card{background:var(--color-surface);border:1px solid var(--color-border);border-radius:var(--radius-card);
  box-shadow:var(--shadow-raised);padding:20px;display:flex;gap:18px;transition:transform .18s,box-shadow .18s}
.feat-card:hover{transform:translateY(-2px);box-shadow:var(--shadow-floating)}
.fc-visual{position:relative;width:112px;height:112px;flex:0 0 112px;border-radius:var(--radius-card-sm);
  background:var(--gradient-brand-deep);display:grid;place-items:center;overflow:hidden}
.fc-visual::after{content:"";position:absolute;left:-30px;bottom:-40px;width:130px;height:130px;border-radius:50%;
  background:radial-gradient(circle,rgba(192,59,43,.40) 0%,rgba(192,59,43,0) 70%)}
.fc-visual svg{position:relative;width:58px;height:58px;stroke:#fff;stroke-width:1.6;fill:none;stroke-linecap:round;stroke-linejoin:round}
.fc-body{flex:1;min-width:0;display:flex;flex-direction:column}
.fc-title{font-size:18px;font-weight:600;line-height:1.35}
.fc-desc{font-size:13px;color:var(--color-text-secondary);line-height:1.6;margin-top:6px}
.fc-stats{display:flex;gap:14px;margin-top:12px;flex-wrap:wrap}
.fc-stats span{font-size:12px;color:var(--color-text-secondary)}
.fc-stats b{font-family:var(--num);font-size:13px;font-weight:700;color:var(--color-text-primary)}
.fc-act{margin-top:auto;padding-top:14px;display:flex;align-items:center;gap:8px}

/* ============================ 8. 我的记录 6 格面板 ============================ */
.rec-panel{background:var(--color-surface);border:1px solid var(--color-border);border-radius:var(--radius-card);
  box-shadow:var(--shadow-raised);overflow:hidden;display:grid;grid-template-columns:repeat(3,1fr)}
.rec{display:flex;align-items:center;gap:14px;padding:20px 22px;border-right:1px solid var(--color-border);
  border-bottom:1px solid var(--color-border);transition:background .15s}
.rec:hover{background:#FBFDFE}
.rec:nth-child(3n){border-right:0}
.rec:nth-child(n+4){border-bottom:0}
.rec-ico{width:40px;height:40px;flex:0 0 40px;border-radius:10px;background:rgba(192,59,43,.13);display:grid;place-items:center}
.rec-ico svg{width:20px;height:20px;stroke:var(--color-primary-strong);stroke-width:1.5;fill:none;stroke-linecap:round;stroke-linejoin:round}
.rec-l{font-size:13px;color:var(--color-text-secondary);line-height:1.4}
.rec-v{font-family:var(--num);font-size:20px;font-weight:700;line-height:1.3;letter-spacing:-.3px}
.rec-v small{font-family:var(--font-body);font-size:12px;font-weight:500;color:var(--color-text-secondary);margin-left:3px}
.rec-arrow{margin-left:auto;font-size:12px;font-weight:600;color:var(--color-primary-strong)}

/* ============================ 9. 底部学习评估条 ============================ */
.assess{position:relative;background:var(--color-surface);border:1px solid var(--color-border);
  border-radius:var(--radius-card);box-shadow:var(--shadow-raised);padding:24px 28px 26px;overflow:hidden}
.assess::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--gradient-brand)}
.assess::after{content:"";position:absolute;right:-70px;top:-110px;width:300px;height:300px;border-radius:50%;
  background:radial-gradient(circle,rgba(192,59,43,.10) 0%,rgba(192,59,43,0) 70%);pointer-events:none}
.as-head{position:relative;display:flex;align-items:flex-start;gap:16px;padding-bottom:20px;
  border-bottom:1px solid var(--color-border)}
.as-head h3{font-size:18px;font-weight:600;line-height:1.35}
.as-head p{font-size:12px;color:var(--color-text-secondary);margin-top:5px}
.as-head .btn{margin-left:auto}
.as-grid{position:relative;display:grid;grid-template-columns:repeat(3,1fr);margin-top:22px}
.stat{padding:0 26px;border-left:1px solid var(--color-border)}
.stat:first-child{padding-left:0;border-left:0}
.stat-l{display:flex;align-items:center;gap:6px;font-size:13px;font-weight:600;color:var(--color-text-secondary)}
.stat-l .d{width:7px;height:7px;border-radius:50%}
.stat-num{font-family:var(--num);font-variant-numeric:tabular-nums;font-size:48px;font-weight:800;
  line-height:1.05;letter-spacing:-2px;color:var(--color-text-primary);margin-top:6px}
.stat-num .u{font-size:16px;font-weight:600;letter-spacing:0;color:var(--color-text-secondary);margin-left:2px}
.stat-foot{display:flex;align-items:center;gap:8px;margin-top:10px;font-size:12px;color:var(--color-text-secondary)}
.mini-bar{height:5px;border-radius:var(--radius-pill);background:var(--color-surface-muted);overflow:hidden;margin-top:12px;max-width:200px}
.mini-bar i{display:block;height:100%;border-radius:var(--radius-pill)}
.as-tip{position:relative;display:flex;align-items:center;gap:10px;margin-top:22px;padding:14px 16px;
  border-radius:var(--radius-card-sm);background:var(--color-surface-muted)}
.as-tip svg{width:18px;height:18px;flex:0 0 18px;stroke:var(--color-primary-strong);stroke-width:1.6;fill:none;stroke-linecap:round;stroke-linejoin:round}
.as-tip p{font-size:13px;color:var(--color-text-secondary)}
.as-tip b{color:var(--color-text-primary);font-weight:600}
.as-tip .btn{margin-left:auto;flex:0 0 auto}

/* ============================ 10. 响应式（桌面优先） ============================ */
@media (max-width:1100px){
  .sidebar:not(.collapsed){width:64px}
  .sb-txt,.sb-brandtxt,.sb-group,.sb-badge,.sb-foot .t{display:none}
  .sb-item{justify-content:center;padding:0}
  .sb-brand,.sb-foot{justify-content:center;padding:16px 0}
  .main:not(.expanded){margin-left:64px}
  .stage-grid,.feat-grid{grid-template-columns:1fr}
  .rec-panel{grid-template-columns:repeat(2,1fr)}
  .rec:nth-child(3n){border-right:1px solid var(--color-border)}
  .rec:nth-child(2n){border-right:0}
  .as-grid{grid-template-columns:1fr;gap:20px}
  .stat{padding:0;border-left:0}
}
@media (max-width:767px){
  .sidebar{display:none}.main{margin-left:0}
  .stat-num{font-size:36px}
  .rec-panel{grid-template-columns:1fr}
}

.cols.right-collapsed .col-right{opacity:0;pointer-events:none;overflow:hidden}
.right-toggle{position:absolute;left:-14px;top:50%;transform:translateY(-50%);z-index:10;width:28px;height:44px;border-radius:8px 0 0 8px;background:#fff;border:1px solid var(--color-border);border-right:none;box-shadow:var(--shadow-raised);display:grid;place-items:center;color:var(--color-text-secondary);cursor:pointer}
.right-toggle:hover{background:var(--color-surface-muted);color:var(--color-text-primary)}
.right-toggle svg{width:14px;height:14px;stroke:currentColor;stroke-width:2.2;fill:none;stroke-linecap:round;stroke-linejoin:round}
/* 右栏被隐藏时的浮动展开按钮（固定在右上角，始终可点） */
.right-toggle-float{display:none !important}
.right-toggle-float:hover{background:var(--color-surface-muted);color:var(--color-text-primary)}
.right-toggle-float svg{width:18px;height:18px;stroke:currentColor;stroke-width:2;fill:none;stroke-linecap:round;stroke-linejoin:round}
.cols.right-collapsed .right-toggle{display:none}
.cols.right-collapsed .right-toggle-float{display:none !important}
.section-toggle{width:24px;height:24px;border-radius:5px;display:grid;place-items:center;background:transparent;border:1px solid transparent;color:var(--color-text-secondary);margin-left:auto;transition:background .15s,transform .2s}
.section-toggle:hover{background:var(--color-surface-muted);color:var(--color-text-primary)}
.section-toggle svg{width:13px;height:13px;stroke:currentColor;stroke-width:2.2;fill:none;stroke-linecap:round,stroke-linejoin:round}
.right-section.collapsed .section-toggle{transform:rotate(-90deg)}
.right-section.collapsed .section-body{display:none}
.right-section.collapsed .card-h{border-bottom:0;padding-bottom:14px}
.right-section .card-h{padding-bottom:8px}
.right-section + .right-section{margin-top:14px}
.card{background:var(--color-surface);border:1px solid var(--color-border);border-radius:var(--radius-card-sm);
  box-shadow:var(--shadow-raised)}
.card + .card{margin-top:16px}
.card-h{display:flex;align-items:center;gap:8px;padding:14px 16px 0}
.card-h h3{font-size:14px;font-weight:600;letter-spacing:.1px}
.card-h .sp{margin-left:auto;font-size:11px;color:var(--color-text-secondary)}
.card-b{padding:12px 16px 16px}
.sticky{position:sticky;top:76px}

/* ---- 左栏：训练信息 ---- */
.info-row{display:flex;align-items:baseline;justify-content:space-between;font-size:12px;
  color:var(--color-text-secondary);padding:6px 0}
.info-row + .info-row{border-top:1px solid var(--color-border)}
.info-row b{font-size:12px;font-weight:600;color:var(--color-text-primary);text-align:right;max-width:120px}
.mode-tag{display:inline-flex;align-items:center;gap:5px;height:22px;padding:0 9px;border-radius:var(--radius-pill);
  background:rgba(192,59,43,.14);color:var(--color-primary-strong);font-size:11px;font-weight:700}

/* ---- 左栏：答题卡 ---- */
.sheet{display:grid;grid-template-columns:repeat(5,1fr);gap:5px;max-width:460px;margin:0 auto}
.cell{position:relative;aspect-ratio:1/1;border-radius:var(--radius-btn);border:1px solid var(--color-border);
  background:#fff;color:var(--color-text-secondary);font-family:var(--num);font-size:10px;font-weight:600;display:grid;place-items:center;transition:transform .12s,box-shadow .12s;width:100%;box-sizing:border-box;overflow:hidden}
.cell:hover{transform:translateY(-1px);box-shadow:var(--shadow-raised)}
.cell.ok{background:var(--color-success-soft);border-color:#8FE3AC;color:var(--color-success-text)}
.cell.no{background:var(--color-danger-soft);border-color:#F6ADAD;color:var(--color-danger-text)}
.cell.cur{background:rgba(192,59,43,.16);border:2px solid var(--color-primary);color:var(--color-text-primary);font-weight:800}
.cell.flag::after{content:"";position:absolute;top:3px;right:3px;width:5px;height:5px;border-radius:50%;background:#B45309}
.legend{display:flex;flex-wrap:wrap;gap:8px 12px;margin-top:14px;padding-top:12px;border-top:1px solid var(--color-border)}
.legend span{display:inline-flex;align-items:center;gap:5px;font-size:11px;color:var(--color-text-secondary)}
.legend i{width:10px;height:10px;border-radius:3px;border:1px solid var(--color-border);display:inline-block}
.sheet-top{display:flex;align-items:baseline;gap:6px;padding:0 16px 10px}
.sheet-top .big{font-family:var(--num);font-size:20px;font-weight:800;line-height:1;letter-spacing:-.5px}
.sheet-top .tot{font-size:12px;color:var(--color-text-secondary)}
.sheet-top .rate{margin-left:auto;font-size:11px;color:var(--color-text-secondary)}
.sheet-top .rate b{font-family:var(--num);color:var(--color-success-text);font-weight:700}

/* 左栏快捷导航 */
.qnav{display:flex;flex-direction:column;gap:6px}
.qnav a{display:flex;align-items:center;gap:8px;height:32px;padding:0 10px;border-radius:var(--radius-btn);
  font-size:13px;color:var(--color-text-secondary);font-weight:500}
.qnav a:hover{background:var(--color-surface-muted);color:var(--color-text-primary)}
.qnav a svg{width:15px;height:15px;stroke:currentColor;stroke-width:1.6;fill:none;stroke-linecap:round;stroke-linejoin:round}
.qnav a .c{margin-left:auto;font-family:var(--num);font-size:11px}

/* ============================ 6. 中栏：题目（Notion 式排版） ============================ */
.q-card{background:var(--color-surface);border:1px solid var(--color-border);border-radius:var(--radius-card);
  box-shadow:var(--shadow-raised);padding:20px 22px 18px}
.q-head{display:flex;align-items:center;gap:10px;padding-bottom:12px;border-bottom:1px solid var(--color-border)}
.q-no{display:inline-flex;align-items:center;justify-content:center;min-width:30px;height:30px;padding:0 8px;
  border-radius:var(--radius-btn);background:var(--color-text-primary);color:#fff;
  font-family:var(--num);font-size:14px;font-weight:700}
.tag{display:inline-flex;align-items:center;height:22px;padding:0 8px;border-radius:6px;font-size:11px;font-weight:600}
.tag-gray{background:var(--color-surface-muted);color:var(--color-text-secondary)}
.tag-teal{background:rgba(192,59,43,.14);color:var(--color-primary-strong)}
.tag-green{background:var(--color-success-soft);color:var(--color-success-text)}
.tag-red{background:var(--color-danger-soft);color:var(--color-danger-text)}
.q-head .diff{font-size:11px;color:#B45309;letter-spacing:1px}
.q-head .meta{font-size:12px;color:var(--color-text-secondary)}
.q-head .sp{margin-left:auto;display:flex;gap:4px}
.ico-btn{width:30px;height:30px;border-radius:7px;display:grid;place-items:center;color:var(--color-text-secondary)}
.ico-btn:hover{background:var(--color-surface-muted);color:var(--color-text-primary)}
.ico-btn.on{background:rgba(192,59,43,.14);color:var(--color-primary-strong)}
.ico-btn svg{width:16px;height:16px;stroke:currentColor;stroke-width:1.6;fill:none;stroke-linecap:round;stroke-linejoin:round}

.stem{font-size:14.5px;line-height:1.7;margin-top:16px;letter-spacing:.12px;color:#111827}
.stem em{font-style:normal;background:linear-gradient(transparent 62%,rgba(192,59,43,.32) 0);padding:0 1px}
.stem .q{color:var(--color-text-secondary)}
.stem-note{display:flex;gap:8px;margin-top:14px;padding:12px 14px;border-radius:var(--radius-btn);
  background:#FBFCFE;border:1px solid var(--color-border);font-size:13px;color:var(--color-text-secondary);line-height:1.7}
.stem-note b{color:var(--color-text-primary);font-weight:600}

.opts{margin-top:18px;display:flex;flex-direction:column;gap:10px}
.opt{display:flex;align-items:flex-start;gap:12px;padding:12px 14px;border-radius:var(--radius-btn);
  border:1px solid var(--color-border);background:#fff;font-size:14px;line-height:1.7;cursor:pointer;
  transition:border-color .15s,background .15s,box-shadow .15s}
.opt:hover{border-color:#CBD5E1;background:#FCFDFE}
.opt .k{flex:0 0 26px;height:26px;border-radius:50%;border:1.5px solid var(--color-border);
  display:grid;place-items:center;font-family:var(--num);font-size:12.5px;font-weight:700;
  color:var(--color-text-secondary);margin-top:1px}
.opt .txt{flex:1;min-width:0}
.opt .mk{flex:0 0 auto;font-size:11px;font-weight:700;height:22px;padding:0 8px;border-radius:6px;
  display:inline-flex;align-items:center;margin-top:2px}
/* 正确 / 错误状态（三色功能化） */
.opt.is-right{border-color:#8FE3AC;background:#F3FCF6}
.opt.is-right .k{border-color:var(--color-success);background:var(--color-success-soft);color:var(--color-success-text)}
.opt.is-right .mk{background:var(--color-success-soft);color:var(--color-success-text)}
.opt.is-wrong{border-color:#F6ADAD;background:#FEF4F4}
.opt.is-wrong .k{border-color:var(--color-danger);background:var(--color-danger-soft);color:var(--color-danger-text)}
.opt.is-wrong .mk{background:var(--color-danger-soft);color:var(--color-danger-text)}
.opt.is-pick{border-color:var(--color-primary);background:rgba(192,59,43,.08);box-shadow:0 0 0 3px rgba(192,59,43,.16)}
.opt.is-pick .k{border-color:var(--color-primary);background:var(--color-primary);color:var(--color-text-primary)}

.verdict{display:flex;align-items:center;gap:12px;margin-top:20px;padding:14px 16px;border-radius:var(--radius-btn);
  background:#FEF4F4;border:1px solid #F6ADAD}
.verdict .ic{width:30px;height:30px;flex:0 0 30px;border-radius:50%;background:var(--color-danger);display:grid;place-items:center}
.verdict .ic svg{width:16px;height:16px;stroke:#fff;stroke-width:2.4;fill:none;stroke-linecap:round}
.verdict .t{font-size:13px;font-weight:700;color:var(--color-danger-text)}
.verdict .d{font-size:12px;color:var(--color-text-secondary);margin-top:2px}
.verdict .sp{margin-left:auto;display:flex;align-items:center;gap:14px;font-size:12px;color:var(--color-text-secondary)}
.verdict .sp b{font-family:var(--num);font-size:15px;font-weight:800;color:var(--color-text-primary)}

.q-foot{display:flex;align-items:center;gap:10px;margin-top:22px;padding-top:18px;border-top:1px solid var(--color-border)}
.q-foot .sp{margin-left:auto;display:flex;gap:10px}

/* 中栏：我的笔记 */
.note-card{margin-top:16px;background:var(--color-surface);border:1px solid var(--color-border);
  border-radius:var(--radius-card-sm);padding:18px 20px}
.note-card h3{font-size:14px;font-weight:600;display:flex;align-items:center;gap:7px}
.note-card h3 svg{width:15px;height:15px;stroke:var(--color-primary-strong);stroke-width:1.7;fill:none;stroke-linecap:round;stroke-linejoin:round}
.note-body{margin-top:10px;font-size:14px;line-height:1.8;color:#1E293B;padding:12px 14px;border-radius:var(--radius-btn);
  background:#FBFCFE;border:1px dashed var(--color-border)}
.note-body b{font-weight:600}
.note-foot{display:flex;align-items:center;gap:8px;margin-top:10px;font-size:12px;color:var(--color-text-secondary)}
.note-foot .sp{margin-left:auto}

/* ============================ 7. 右栏：解析 + 视频 ============================ */
.ans-box{display:flex;gap:10px;padding:14px 16px 0}
.ab{flex:1;border-radius:var(--radius-btn);padding:10px 12px;text-align:center}
.ab.right{background:var(--color-success-soft)}
.ab.wrong{background:var(--color-danger-soft)}
.ab .l{font-size:11px;color:var(--color-text-secondary)}
.ab .v{font-family:var(--num);font-size:20px;font-weight:800;line-height:1.15;letter-spacing:.5px;margin-top:2px}
.ab.right .v{color:var(--color-success-text)}
.ab.wrong .v{color:var(--color-danger-text)}
/* 正确答案与解析：三区域纵向布局 */
.ans-sections{display:flex;flex-direction:column;gap:3px;padding:0}
.ans-sec{border-radius:var(--radius-btn);padding:4px 6px;min-height:36px;background:#fff;border:1px solid var(--color-border)}
.ans-sec-h{font-size:11px;font-weight:600;color:var(--color-text-secondary);margin-bottom:1px;letter-spacing:.2px}
.ans-sec-v{font-size:13px;line-height:1.6;color:var(--color-text-primary);white-space:normal;word-break:break-word}
.ans-sec.your-ans{background:#fff;border-color:var(--color-border);border-left:3px solid var(--color-border)}
.ans-sec.your-ans .ans-sec-h{color:var(--color-text-secondary)}
.ans-sec.correct-ans{background:#fff;border-color:var(--color-border);border-left:3px solid var(--color-border)}
.ans-sec.correct-ans .ans-sec-h{color:var(--color-text-secondary)}
.ans-sec.correct-ans.pending{background:#fff;border-color:var(--color-border);border-left:3px solid var(--color-border)}
.ans-sec.correct-ans.pending .ans-sec-h{color:var(--color-text-secondary)}
.ans-sec.analysis-sec{background:#fff;border-color:var(--color-border)}
.ans-sec.analysis-sec .ans-sec-h{color:var(--color-primary-strong)}
.ans-sec.analysis-sec .ans-sec-v{font-size:12.5px;line-height:1.65;max-height:200px;overflow-y:auto}
.rate-row{display:flex;align-items:center;gap:8px;padding:12px 16px 0;font-size:12px;color:var(--color-text-secondary)}
.rate-row b{font-family:var(--num);color:var(--color-text-primary);font-weight:700}
.rate-bar{flex:1;height:5px;border-radius:var(--radius-pill);background:var(--color-surface-muted);overflow:hidden}
.rate-bar i{display:block;height:100%;border-radius:var(--radius-pill);background:var(--color-danger)}

.exp{font-size:13px;line-height:1.8;color:#1E293B;padding:14px 16px 0}
.exp p + p{margin-top:10px}
.exp b{font-weight:600;color:var(--color-text-primary)}
.exp .calc{font-family:var(--num);background:var(--color-surface-muted);border-radius:5px;padding:1px 6px;font-size:12.5px}
.exp .step{display:flex;gap:8px;margin-top:10px}
.exp .step .n{flex:0 0 18px;height:18px;border-radius:50%;background:rgba(192,59,43,.16);color:var(--color-primary-strong);
  font-family:var(--num);font-size:11px;font-weight:700;display:grid;place-items:center;margin-top:3px}
.warn{display:flex;gap:8px;margin:14px 16px 0;padding:11px 12px;border-radius:var(--radius-btn);
  background:#FEF4F4;border:1px solid #F6ADAD;font-size:12.5px;line-height:1.7;color:#7F1D1D}
.warn svg{width:15px;height:15px;flex:0 0 15px;stroke:var(--color-danger-text);stroke-width:2;fill:none;margin-top:3px}
.kp{display:flex;flex-wrap:wrap;gap:6px;padding:14px 16px 0}
.kp span{font-size:11px;font-weight:500;color:var(--color-text-secondary);background:var(--color-surface-muted);
  border-radius:5px;padding:3px 8px}
.src{padding:12px 16px 16px;font-size:11.5px;color:var(--color-text-secondary);line-height:1.7}
.src b{color:var(--color-text-primary);font-weight:600}

/* 视频卡片 */
.video{display:block;padding:14px 16px 16px}
.thumb{position:relative;border-radius:var(--radius-btn);overflow:hidden;background:var(--gradient-brand-soft);
  aspect-ratio:16/9;display:grid;place-items:center;transition:box-shadow .2s}
.thumb::before{content:"";position:absolute;inset:0;
  background:radial-gradient(circle at 30% 25%,rgba(255,255,255,.6) 0%,rgba(255,255,255,0) 55%)}
.thumb svg{position:relative;width:54px;height:54px;transition:transform .2s}
.video:hover .thumb{box-shadow:var(--shadow-floating)}
.video:hover .thumb svg{transform:scale(1.06)}
.dur{position:absolute;right:8px;bottom:8px;height:20px;padding:0 7px;border-radius:6px;
  background:rgba(43,40,38,.72);color:#fff;font-family:var(--num);font-size:11px;font-weight:600;
  display:inline-flex;align-items:center;letter-spacing:.3px}
.v-title{font-size:14px;font-weight:600;line-height:1.5;margin-top:10px;color:var(--color-text-primary)}
.v-meta{font-size:11.5px;color:var(--color-text-secondary);margin-top:5px}

/* 相关题目 */
.rel{padding:6px 8px 12px}
.rel a{display:flex;gap:10px;padding:9px 8px;border-radius:var(--radius-btn);font-size:12.5px;
  color:var(--color-text-primary);line-height:1.55}
.rel a:hover{background:var(--color-surface-muted)}
.rel a .i{flex:0 0 auto;font-family:var(--num);font-size:11px;font-weight:700;color:#475569;margin-top:1px}
.rel a .m{display:block;font-size:11px;color:var(--color-text-secondary);margin-top:3px}

/* ============================ 8. 按钮 ============================ */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:40px;padding:0 20px;
  border-radius:var(--radius-btn);font-size:14px;font-weight:600;transition:background .15s,box-shadow .15s}
.btn-sm{height:32px;padding:0 13px;font-size:13px}
.btn-block{width:100%}
.btn-teal{background:var(--color-primary);color:var(--color-text-primary)}
.btn-teal:hover{background:#B43222}
.btn-primary{background:var(--color-secondary-strong);color:#fff}
.btn-primary:hover{background:var(--color-secondary-deep)}
.btn-secondary{background:#fff;color:var(--color-text-primary);border:1px solid var(--color-border)}
.btn-secondary:hover{background:var(--color-surface-muted)}
.btn-ghost{color:var(--color-primary-strong)}
.btn-ghost:hover{background:rgba(192,59,43,.12)}
.btn-quiet{color:var(--color-text-secondary)}
.btn-quiet:hover{background:var(--color-surface-muted);color:var(--color-text-primary)}
.btn svg{width:15px;height:15px;stroke:currentColor;stroke-width:2;fill:none;stroke-linecap:round;stroke-linejoin:round}

/* ============================ 8.5 做题页扩展（答题卡分组 / 标记收藏 / 判定 / 交卷模态框） ============================ */
/* 答题卡：按题型分组 */
.sheet-group + .sheet-group{margin-top:14px}
.sheet-group-h{display:flex;align-items:center;gap:6px;font-size:11px;font-weight:600;color:var(--color-text-secondary);margin-bottom:8px;letter-spacing:.04em}
.sheet-group-h span{margin-left:auto;font-size:10px;font-weight:500;color:var(--color-text-secondary)}
/* 答题卡格子状态：已作答(蓝·做题中) / 待校验(灰·交卷后) / 已收藏(金点·左上) */
.cell.done{background:var(--color-secondary-soft);border-color:var(--color-secondary-light);color:var(--color-secondary-strong)}
.cell.pending{background:var(--color-surface-muted);border-color:#CBD5E1;color:var(--color-text-secondary)}
.cell.star::before{content:"";position:absolute;top:3px;left:3px;width:5px;height:5px;border-radius:50%;background:#F2B33D}
/* 当前题高亮优先级最高（覆盖 done/ok/no/pending 的边框与底色） */
.cell.cur{background:rgba(192,59,43,.16);border:2px solid var(--color-primary);color:var(--color-text-primary);font-weight:800}

/* 标记 / 收藏按钮激活态 */
.ico-btn.on-mark{background:rgba(180,83,9,.14);color:#B45309}
.ico-btn.on-mark svg{stroke:#B45309}
.ico-btn.on-star{background:rgba(242,179,61,.20);color:#B45309}
.ico-btn.on-star svg{fill:#F2B33D;stroke:#F2B33D}
.ico-btn.on-error{background:rgba(220,38,38,.15);color:#DC2626}
.ico-btn.on-error svg{fill:#DC2626;stroke:#DC2626}
.cell.error{background:rgba(220,38,38,.10);border-color:#DC2626;color:#DC2626}
.cell.error::before{content:"";position:absolute;top:3px;left:3px;width:5px;height:5px;border-radius:50%;background:#DC2626}
/* 标记此题 → 题卡橙色边框 + 右上角标 */
.q-card.is-marked{position:relative;border-color:#F59E0B;box-shadow:0 0 0 1px #F59E0B,var(--shadow-raised)}
.q-card.is-marked::after{content:"已标记";position:absolute;top:0;right:0;background:#B45309;color:#fff;font-size:10px;font-weight:700;padding:3px 9px;border-radius:0 var(--radius-card) 0 var(--radius-btn);letter-spacing:.5px}

/* 多选题选项：方形 checkbox（单选保持圆形） */
.type-multi .opt .k{border-radius:6px}

/* 选项锁定（交卷后不可点） */
.opts.locked .opt{cursor:default}
.opts.locked .opt:hover{border-color:var(--color-border);background:#fff;box-shadow:none}

/* 判定条：正确 / 待校验（错误态复用 .verdict 基底红色） */
.verdict.is-right{background:#F3FCF6;border-color:#8FE3AC}
.verdict.is-right .ic{background:var(--color-success)}
.verdict.is-right .t{color:var(--color-success-text)}
.verdict.is-pending{background:#FBFCFE;border-color:var(--color-border)}
.verdict.is-pending .ic{background:var(--color-text-secondary)}
.verdict.is-pending .t{color:var(--color-text-primary)}

/* 右栏答案对比：待校验态 */
.ab.pending{background:var(--color-surface-muted)}
.ab.pending .v{color:var(--color-text-secondary)}

/* ============================ 作答草稿 ============================ */
.draft-wrap{margin-top:14px;padding:12px 14px;background:var(--color-surface-2);border:1px solid var(--color-border);border-radius:var(--radius-card)}
.draft-label{display:block;font-size:11.5px;font-weight:600;color:var(--color-text-secondary);margin-bottom:8px;letter-spacing:.3px}
.draft-label::before{content:"✎";margin-right:6px;color:var(--color-secondary)}
.draft-input{width:100%;min-height:170px;padding:4px 6px;border:1px solid var(--color-border);border-radius:var(--radius-btn);font-size:13px;line-height:1.7;resize:vertical;font-family:inherit;color:var(--color-text-primary);background:#fff}
.draft-input:focus{outline:none;border-color:var(--color-secondary);box-shadow:0 0 0 3px rgba(192,59,43,.14)}
.draft-input::placeholder{color:#A9B2BF}
/* 交卷后草稿展示块（右栏，答案解析上方） */
.draft-view-block{margin-bottom:14px}
.draft-view{background:#FFFBEA;border:1px solid #F2D98A;border-left:3px solid #E0A800;border-radius:var(--radius-btn);padding:10px 12px;font-size:13.5px;line-height:1.75;color:#5B4A12;white-space:normal}

/* 底部导航位置指示 */
.q-foot .pos{font-family:var(--num);font-size:13px;font-weight:600;color:var(--color-text-secondary)}

/* 计时器：运行态微动效 */
.timer.live svg{stroke:var(--color-primary-strong);animation:tick-pulse 2s ease-in-out infinite}
@keyframes tick-pulse{0%,100%{opacity:1}50%{opacity:.45}}

/* 交卷结果模态框 */
.modal-mask{position:fixed;inset:0;z-index:1000;background:rgba(43,40,38,.45);backdrop-filter:blur(2px);display:grid;place-items:center;padding:20px}
.modal{position:relative;width:100%;max-width:440px;background:var(--color-surface);border-radius:var(--radius-card);box-shadow:0 20px 60px rgba(43,40,38,.25);overflow:hidden;animation:modal-in .18s ease-out}
@keyframes modal-in{from{opacity:0;transform:translateY(8px) scale(.98)}to{opacity:1;transform:none}}
.modal-head{padding:24px 24px 0;text-align:center}
.modal-head h3{font-size:19px;font-weight:700}
.modal-head p{font-size:13px;color:var(--color-text-secondary);margin-top:6px}
.modal-score{padding:16px 24px 4px;text-align:center}
.modal-score .s{font-family:var(--num);font-size:52px;font-weight:800;line-height:1;letter-spacing:-1px;background:var(--gradient-brand);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.modal-score .s-unit{font-family:var(--num);font-size:16px;font-weight:600;color:var(--color-text-secondary);margin-left:4px}
.modal-rate-row{display:flex;justify-content:center;gap:20px;padding:8px 24px 14px;font-size:12.5px;color:var(--color-text-secondary)}
.modal-rate-row b{font-family:var(--num);font-weight:700;color:var(--color-text-primary);margin-left:3px}
.modal-breakdown{padding:0 24px;display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.modal-breakdown .b{background:var(--color-surface-muted);border-radius:var(--radius-btn);padding:12px 8px;text-align:center}
.modal-breakdown .b .v{font-family:var(--num);font-size:22px;font-weight:800;line-height:1.1}
.modal-breakdown .b .l{font-size:11px;color:var(--color-text-secondary);margin-top:3px}
.modal-breakdown .b.ok .v{color:var(--color-success-text)}
.modal-breakdown .b.no .v{color:var(--color-danger-text)}
.modal-breakdown .b.pend .v{color:var(--color-text-secondary)}
.modal-tip{padding:14px 24px 4px;font-size:12px;color:var(--color-text-secondary);line-height:1.6;text-align:center}
.modal-actions{padding:16px 24px 24px;display:flex;gap:10px}
.modal-actions .btn{flex:1}
.modal-close{position:absolute;top:10px;right:12px;width:28px;height:28px;border-radius:50%;font-size:20px;line-height:1;color:var(--color-text-secondary);display:grid;place-items:center}
.modal-close:hover{background:var(--color-surface-muted);color:var(--color-text-primary)}

/* ============================ 9. 响应式 ============================ */
@media (max-width:1100px){
  .sidebar:not(.collapsed){width:64px}
  .sb-txt,.sb-brandtxt,.sb-group,.sb-badge,.sb-foot .t{display:none}
  .sb-item{justify-content:center;padding:0}
  .sb-brand,.sb-foot{justify-content:center;padding:16px 0}
  .main:not(.expanded){margin-left:64px}
  /* 窄屏保持三栏结构：右侧栏由 JS 默认折叠（.right-collapsed），分隔条常驻 */
}
@media (max-width:767px){
  .sidebar{display:none}.main{margin-left:0}
  .cols{grid-template-columns:1fr;padding:16px}
  .col-left,.col-right{grid-column:auto}
  .sticky{position:static}
  .q-card{padding:20px 18px}
}

:focus-visible{outline:2px solid var(--color-primary-strong);outline-offset:2px}
.sticky{max-height:calc(100vh - 92px);overflow-y:auto}.col-left.sticky{display:flex;flex-direction:column;overflow:visible;max-height:calc(100vh - 92px)}.col-left.sticky .card{flex:1;min-height:0;display:flex;flex-direction:column;margin-bottom:0}.col-left.sticky .card-b{flex:1;min-height:0;overflow-y:auto;padding:12px 0;display:flex;flex-direction:column;align-items:center}
.search:focus-within{border-color:var(--color-primary-strong);box-shadow:0 0 0 3px rgba(192,59,43,.22)}


/* ============================ 1. 设计令牌 ============================ */


/* ============================ 2. 基础 ============================ */
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--color-bg);color:var(--color-text-primary);font-family:var(--font-body);
  font-size:16px;line-height:1.6;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale}
h1,h2,h3,h4,p{margin:0}
ul{margin:0;padding:0;list-style:none}
a{color:var(--color-primary-strong);text-decoration:none}
button{font-family:inherit;cursor:pointer;border:0;background:none;color:inherit}
.num{font-family:var(--num);font-variant-numeric:tabular-nums;font-feature-settings:"tnum"}

/* ============================ 3. 全局左侧边栏（4 页复用） ============================ */
.sidebar{position:fixed;left:0;top:0;width:240px;height:100vh;z-index:200;background:var(--color-surface);
  border-right:1px solid var(--color-border);display:flex;flex-direction:column}
.sb-brand{display:flex;align-items:center;gap:10px;padding:18px 20px 14px}
.sb-logo{width:34px;height:34px;flex:0 0 34px;border-radius:10px;background:var(--color-secondary);
  display:grid;place-items:center;box-shadow:0 2px 6px rgba(192,59,43,.30)}
.sb-name{font-size:15px;font-weight:700;letter-spacing:.2px;line-height:1.3}
.sb-sub{font-size:11px;font-weight:500;color:var(--color-text-secondary);line-height:1.4}
.sb-nav{flex:1;overflow-y:auto;padding:2px 12px 14px}
.sb-group{font-size:11px;font-weight:600;color:var(--color-text-secondary);letter-spacing:.10em;padding:14px 10px 6px;text-transform:uppercase}
.sb-item{position:relative;display:flex;align-items:center;gap:10px;height:40px;padding:0 10px;margin-bottom:2px;
  border-radius:var(--radius-btn);color:var(--color-text-secondary);font-size:14px;font-weight:500;transition:background .15s,color .15s}
.sb-item svg{width:18px;height:18px;flex:0 0 18px;stroke:currentColor;stroke-width:1.5;fill:none;stroke-linecap:round;stroke-linejoin:round}
.sb-item:hover{background:var(--color-surface-muted);color:var(--color-text-primary)}
.sb-item.is-active{background:rgba(192,59,43,.12);color:var(--color-primary-strong);font-weight:600}
.sb-item.is-active::before{content:"";position:absolute;left:-12px;top:8px;bottom:8px;width:3px;
  border-radius:0 3px 3px 0;background:var(--color-primary)}
.sb-badge{margin-left:auto;font-size:11px;font-weight:600;padding:1px 7px;border-radius:var(--radius-pill);
  background:var(--color-danger-soft);color:var(--color-danger-text);font-family:var(--num)}
.sb-foot{border-top:1px solid var(--color-border);padding:12px 14px;display:flex;align-items:center;gap:10px}
.sb-ava{width:32px;height:32px;flex:0 0 32px;border-radius:var(--radius-pill);background:var(--gradient-brand-deep);
  color:#fff;font-size:13px;font-weight:600;display:grid;place-items:center}
.sb-foot .n{font-size:13px;font-weight:600;line-height:1.3}
.sb-foot .r{font-size:11px;color:var(--color-text-secondary);line-height:1.4}

/* 左侧菜单折叠 */
.sb-toggle{width:28px;height:28px;border-radius:6px;display:grid;place-items:center;background:transparent;color:var(--color-text-secondary);border:1px solid transparent;margin-right:2px;transition:background .15s}
.sb-toggle:hover{background:var(--color-surface-muted);color:var(--color-text-primary)}
.sb-toggle svg{width:16px;height:16px;stroke:currentColor;stroke-width:2;fill:none;stroke-linecap:round;stroke-linejoin:round}
.sidebar{transition:width .2s ease,opacity .2s ease}
.sidebar.collapsed{width:0;padding:0;border:none;overflow:hidden;opacity:0}
.sidebar.collapsed .sb-brand,.sidebar.collapsed .sb-nav,.sidebar.collapsed .sb-foot{opacity:0}
.main{transition:margin-left .2s ease}
.main.expanded{margin-left:0}
.sb-toggle-float{position:fixed;left:0;top:18px;z-index:9999;width:30px;height:44px;border-radius:0 12px 12px 0;background:#fff;border:1px solid var(--color-border);border-left:none;box-shadow:var(--shadow-raised);display:grid;place-items:center;color:var(--color-text-secondary);transition:color .15s,background .15s;cursor:pointer}
.sb-toggle-float:hover{color:var(--color-primary-strong);background:var(--color-surface-muted)}
.sb-toggle-float svg{width:16px;height:16px;stroke:currentColor;stroke-width:2;fill:none;stroke-linecap:round;stroke-linejoin:round}
/* sb-toggle-float 一直显示 */

/* ============================ 4. 主区 + 顶栏 ============================ */
.main{margin-left:240px;min-height:100vh}
.topbar{position:sticky;top:0;z-index:150;height:56px;background:rgba(255,255,255,.92);
  backdrop-filter:saturate(180%) blur(8px);border-bottom:1px solid var(--color-border)}
.tb-inner{max-width:1040px;margin:0 auto;padding:0 32px;height:56px;display:flex;align-items:center;gap:8px}
/* ========== 版本B：v2风格面包屑（从左到右颜色渐变） ========== */
.crumb{display:flex;align-items:center;gap:2px;font-size:13px;
  padding:3px;background:linear-gradient(135deg,rgba(255,255,255,.10) 0%,rgba(255,255,255,.05) 100%);
  border-radius:10px;border:1px solid rgba(255,255,255,.08)}
/* 返回按钮：白色加粗，无按钮背景 */
.crumb a{color:#fff;text-decoration:none;font-size:13px;font-weight:700;
  padding:4px 10px;border-radius:8px;border:none;background:none;
  transition:all .2s cubic-bezier(.4,0,.2,1)}
.crumb a:hover{color:rgba(255,255,255,.8);background:rgba(255,255,255,.08);transform:none}
.crumb a.active,.crumb a.cur{
  background:none;color:#fff;font-weight:700;box-shadow:none}
.crumb .sep{display:none}
.crumb span{padding:4px 10px;border-radius:8px;font-size:13px;background:none}
/* CPA·会计：白色加粗 */
.crumb .subj,.crumb .crumb-subj{color:#fff;font-weight:700}
/* 冲刺模考：白灰色，不加粗，无背景 */
.crumb .mode,.crumb .crumb-mode{color:rgba(255,255,255,.75);font-weight:400;background:none}
/* 套卷名：灰色 */
.crumb .paper,.crumb .crumb-paper{color:rgba(255,255,255,.5);font-size:12px;font-weight:400}
/* 练习组名：介于模块与章节之间 */
.crumb .group,.crumb .crumb-group{color:rgba(255,255,255,.62);font-size:13px;font-weight:400;background:none}
.crumb .cur{color:rgba(255,255,255,.75);font-weight:400;background:none}
.tb-right{margin-left:auto;display:flex;align-items:center;gap:10px}
.search{display:flex;align-items:center;gap:8px;height:34px;padding:0 12px;border-radius:var(--radius-btn);
  border:1px solid var(--color-border);background:var(--color-surface);min-width:230px}
.search svg{width:15px;height:15px;stroke:var(--color-text-secondary);stroke-width:1.7;fill:none;stroke-linecap:round}
.search input{border:0;outline:none;font-family:inherit;font-size:13px;width:100%;color:var(--color-text-primary);background:none}
.search input::placeholder{color:#475569}
.cd-mini{display:flex;align-items:baseline;gap:5px;height:34px;padding:0 12px;border-radius:var(--radius-pill);
  background:rgba(192,59,43,.12);white-space:nowrap}
.cd-mini span{font-size:12px;color:var(--color-text-secondary)}
.cd-mini b{font-family:var(--num);font-size:14px;font-weight:800;color:var(--color-primary-strong)}
.tb-ava{width:32px;height:32px;border-radius:var(--radius-pill);background:var(--gradient-brand-deep);color:#fff;
  font-size:13px;font-weight:600;display:grid;place-items:center}
.page{max-width:1040px;margin:0 auto;padding:28px 32px 64px}

/* ============================ 5. 页头 + 统计摘要（无卡片，Notion 式） ============================ */
.ph{display:flex;align-items:flex-end;gap:16px}
.ph h1{font-size:32px;font-weight:700;line-height:1.2;letter-spacing:-.4px}
.ph p{font-size:14px;color:var(--color-text-secondary);margin-top:6px}
.ph .sp{margin-left:auto;display:flex;gap:10px;align-items:center}
.summary{display:flex;align-items:center;gap:0;margin-top:22px;padding-bottom:20px;border-bottom:1px solid var(--color-border)}
.sm{padding-right:34px;margin-right:34px;border-right:1px solid var(--color-border)}
.sm:last-child{border-right:0;padding-right:0;margin-right:0}
.sm .l{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--color-text-secondary)}
.sm .l i{width:7px;height:7px;border-radius:50%;display:inline-block}
.sm .v{font-family:var(--num);font-variant-numeric:tabular-nums;font-size:28px;font-weight:800;line-height:1.15;letter-spacing:-.8px;margin-top:4px}
.sm .v small{font-family:var(--font-body);font-size:12px;font-weight:500;color:var(--color-text-secondary);margin-left:3px}

/* ============================ 6. 筛选条 ============================ */
.filters{display:flex;align-items:center;gap:10px;margin:20px 0 22px;flex-wrap:wrap}
.seg{display:inline-flex;padding:3px;border-radius:10px;background:var(--color-surface-muted);gap:2px}
.seg button{height:30px;padding:0 14px;border-radius:7px;font-size:13px;font-weight:500;color:var(--color-text-secondary)}
.seg button:hover{color:var(--color-text-primary)}
.seg button.on{background:#fff;color:var(--color-text-primary);font-weight:600;box-shadow:var(--shadow-raised)}
.dd{position:relative}
.sel{display:inline-flex;align-items:center;gap:8px;height:32px;padding:0 12px;border-radius:var(--radius-btn);
  border:1px solid var(--color-border);background:#fff;font-size:13px;font-weight:500;color:var(--color-text-primary)}
.sel:hover{background:var(--color-surface-muted)}
.sel.act{border-color:var(--color-primary);box-shadow:0 0 0 3px rgba(192,59,43,.18)}
.sel svg{width:14px;height:14px;stroke:var(--color-text-secondary);stroke-width:1.8;fill:none;stroke-linecap:round;stroke-linejoin:round}
.menu{display:none;position:absolute;left:0;top:38px;z-index:100;min-width:210px;padding:6px;
  background:#fff;border:1px solid var(--color-border);border-radius:var(--radius-card-sm);box-shadow:var(--shadow-floating)}
.menu.open{display:block}
.menu button{display:flex;align-items:center;gap:8px;width:100%;text-align:left;height:34px;padding:0 10px;
  border-radius:6px;font-size:13px;color:var(--color-text-primary)}

.menu button .c{margin-left:auto;font-family:var(--num);font-size:12px;color:var(--color-text-secondary)}

.wq-list{display:flex;flex-direction:column;gap:var(--space-md)}

.tag-red{background:var(--color-danger-soft);color:var(--color-danger-text)}
.wq-src{color:var(--color-text-secondary);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.wq-src b{color:var(--color-text-primary);font-weight:600}
.dot{width:3px;height:3px;border-radius:50%;background:#C3CBD6}
.wq-head .sp{margin-left:auto;display:flex;align-items:center;gap:10px}
.ico-btn{width:26px;height:26px;border-radius:6px;display:grid;place-items:center;color:var(--color-text-secondary)}
.ico-btn:hover{background:var(--color-surface-muted);color:var(--color-text-primary)}
.ico-btn svg{width:15px;height:15px;stroke:currentColor;stroke-width:1.6;fill:none;stroke-linecap:round;stroke-linejoin:round}

.wq-stem{font-size:16px;line-height:1.75;margin-top:14px;letter-spacing:.1px}

span.q-tbl{font-family:Consolas,"Courier New",monospace;white-space:pre;display:block;overflow-x:auto;padding:4px 0}
.wq-sub{font-size:13px;color:var(--color-text-secondary);margin-top:8px}

.wq-opts{margin-top:14px;display:flex;flex-direction:column;gap:6px}
.wq-opts li{display:flex;align-items:flex-start;gap:10px;padding:9px 12px;border-radius:var(--radius-btn);

.wq-opts li.is-wrong .k{color:var(--color-danger-text)}
.wq-opts li.is-right{background:#F3FCF6;border-color:#BCEBCC}
.wq-opts li.is-right .k{color:var(--color-success-text)}
.mk{margin-left:auto;flex:0 0 auto;font-style:normal;font-size:11px;font-weight:700;height:20px;padding:0 7px;
  border-radius:5px;display:inline-flex;align-items:center;letter-spacing:.02em}
.mk-red{background:var(--color-danger-soft);color:var(--color-danger-text)}
.mk-green{background:var(--color-success-soft);color:var(--color-success-text)}

.ans-line{display:flex;align-items:center;gap:16px;margin-top:14px;padding:12px 14px;border-radius:var(--radius-btn);

  font-size:13px;font-weight:600;color:var(--color-primary-strong);width:fit-content}

.wq-exp summary svg{width:14px;height:14px;stroke:currentColor;stroke-width:2;fill:none;stroke-linecap:round;stroke-linejoin:round;transition:transform .2s}
.wq-exp[open] summary svg{transform:rotate(180deg)}
.wq-exp .body{font-size:14px;line-height:1.8;color:#1E293B;padding:12px 0 4px;max-width:840px}
.wq-exp .body b{font-weight:600}
.wq-exp .calc{font-family:var(--num);background:var(--color-surface-muted);border-radius:6px;padding:2px 6px;font-size:13px}
  .wq-draft summary{color:#B45309}
  .wq-draft-ta{width:100%;min-height:64px;border:1px solid var(--color-border);border-radius:8px;padding:8px 10px;font-size:14px;line-height:1.7;background:#fff;resize:vertical;font-family:inherit;box-sizing:border-box}
  .wq-draft-ta:focus{outline:none;border-color:var(--color-primary-strong)}
  .wq-draft-actions{display:flex;align-items:center;gap:10px;margin-top:8px}

/* ============================ 1. 设计令牌 ============================ */


/* ============================ 2. 基础 ============================ */
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--color-bg);color:var(--color-text-primary);font-family:var(--font-body);
  font-size:16px;line-height:1.6;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale}
h1,h2,h3,h4,p{margin:0}
ul{margin:0;padding:0;list-style:none}
a{color:var(--color-primary-strong);text-decoration:none}
button{font-family:inherit;cursor:pointer;border:0;background:none;color:inherit}
.num{font-family:var(--num);font-variant-numeric:tabular-nums;font-feature-settings:"tnum"}

/* ============================ 3. 全局左侧边栏（4 页复用） ============================ */
.sidebar{position:fixed;left:0;top:0;width:240px;height:100vh;z-index:200;background:var(--color-surface);
  border-right:1px solid var(--color-border);display:flex;flex-direction:column}
.sb-brand{display:flex;align-items:center;gap:10px;padding:18px 20px 14px}
.sb-logo{width:34px;height:34px;flex:0 0 34px;border-radius:10px;background:var(--color-secondary);
  display:grid;place-items:center;box-shadow:0 2px 6px rgba(192,59,43,.30)}
.sb-name{font-size:15px;font-weight:700;letter-spacing:.2px;line-height:1.3}
.sb-sub{font-size:11px;font-weight:500;color:var(--color-text-secondary);line-height:1.4}
.sb-nav{flex:1;overflow-y:auto;padding:2px 12px 14px}
.sb-group{font-size:11px;font-weight:600;color:var(--color-text-secondary);letter-spacing:.10em;padding:14px 10px 6px;text-transform:uppercase}
.sb-item{position:relative;display:flex;align-items:center;gap:10px;height:40px;padding:0 10px;margin-bottom:2px;
  border-radius:var(--radius-btn);color:var(--color-text-secondary);font-size:14px;font-weight:500;transition:background .15s,color .15s}
.sb-item svg{width:18px;height:18px;flex:0 0 18px;stroke:currentColor;stroke-width:1.5;fill:none;stroke-linecap:round;stroke-linejoin:round}
.sb-item:hover{background:var(--color-surface-muted);color:var(--color-text-primary)}
.sb-item.is-active{background:rgba(192,59,43,.12);color:var(--color-primary-strong);font-weight:600}
.sb-item.is-active::before{content:"";position:absolute;left:-12px;top:8px;bottom:8px;width:3px;
  border-radius:0 3px 3px 0;background:var(--color-primary)}
.sb-badge{margin-left:auto;font-size:11px;font-weight:600;padding:1px 7px;border-radius:var(--radius-pill);
  background:var(--color-danger-soft);color:var(--color-danger-text);font-family:var(--num)}
.sb-foot{border-top:1px solid var(--color-border);padding:12px 14px;display:flex;align-items:center;gap:10px}
.sb-ava{width:32px;height:32px;flex:0 0 32px;border-radius:var(--radius-pill);background:var(--gradient-brand-deep);
  color:#fff;font-size:13px;font-weight:600;display:grid;place-items:center}
.sb-foot .n{font-size:13px;font-weight:600;line-height:1.3}
.sb-foot .r{font-size:11px;color:var(--color-text-secondary);line-height:1.4}

/* 左侧菜单折叠 */
.sb-toggle{width:28px;height:28px;border-radius:6px;display:grid;place-items:center;background:transparent;color:var(--color-text-secondary);border:1px solid transparent;margin-right:2px;transition:background .15s}
.sb-toggle:hover{background:var(--color-surface-muted);color:var(--color-text-primary)}
.sb-toggle svg{width:16px;height:16px;stroke:currentColor;stroke-width:2;fill:none;stroke-linecap:round;stroke-linejoin:round}
.sidebar{transition:width .2s ease,opacity .2s ease}
.sidebar.collapsed{width:0;padding:0;border:none;overflow:hidden;opacity:0}
.sidebar.collapsed .sb-brand,.sidebar.collapsed .sb-nav,.sidebar.collapsed .sb-foot{opacity:0}
.main{transition:margin-left .2s ease}
.main.expanded{margin-left:0}
.sb-toggle-float{position:fixed;left:12px;top:12px;z-index:300;width:34px;height:34px;border-radius:8px;background:#fff;border:1px solid var(--color-border);box-shadow:var(--shadow-raised);display:none;place-items:center;color:var(--color-text-secondary)}

.sb-toggle-float svg{width:18px;height:18px;stroke:currentColor;stroke-width:2;fill:none;stroke-linecap:round,stroke-linejoin:round}

/* ============================ 4. 主区 + 顶栏 ============================ */

/* ========== 版本B：v2风格面包屑（从左到右颜色渐变） ========== */
.crumb{display:flex;align-items:center;gap:2px;font-size:13px;
  padding:3px;background:linear-gradient(135deg,rgba(255,255,255,.10) 0%,rgba(255,255,255,.05) 100%);
  border-radius:10px;border:1px solid rgba(255,255,255,.08)}
/* 返回按钮：白色加粗，无按钮背景 */
.crumb a{color:#fff;text-decoration:none;font-size:13px;font-weight:700;
  padding:4px 10px;border-radius:8px;border:none;background:none;
  transition:all .2s cubic-bezier(.4,0,.2,1)}
.crumb a:hover{color:rgba(255,255,255,.8);background:rgba(255,255,255,.08);transform:none}
.crumb a.active,.crumb a.cur{

.crumb .sep{display:none}
.crumb span{padding:4px 10px;border-radius:8px;font-size:13px;background:none}
/* CPA·会计：白色加粗 */
.crumb .subj,.crumb .crumb-subj{color:#fff;font-weight:700}
/* 冲刺模考：白灰色，不加粗，无背景 */
.crumb .mode,.crumb .crumb-mode{color:rgba(255,255,255,.75);font-weight:400;background:none}
/* 套卷名：灰色 */
.crumb .paper,.crumb .crumb-paper{color:rgba(255,255,255,.5);font-size:12px;font-weight:400}
/* 练习组名：介于模块与章节之间 */

/* ============================ 1. 设计令牌 ============================ */


/* ============================ 2. 基础 ============================ */
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--color-bg); color:var(--color-text-primary);
  font-family:var(--font-body); font-size:16px; line-height:1.6;
  -webkit-font-smoothing:antialiased; -moz-osx-font-smoothing:grayscale;
}
h1,h2,h3,h4,p{margin:0}
a{color:var(--color-primary-strong);text-decoration:none}
button{font-family:inherit;cursor:pointer;border:0;background:none}
/* 焦点可见（WCAG 2.4.7） */
:where(a,button,input,summary,label,[tabindex]):focus-visible{
  outline:2px solid var(--color-secondary-strong);outline-offset:2px;border-radius:6px}
.num{font-family:var(--num);font-variant-numeric:tabular-nums;font-feature-settings:"tnum"}
.muted{color:var(--color-text-secondary)}

/* ============================ 3. 全局左侧边栏 ============================ */
.sidebar{
  position:fixed; left:0; top:0; width:240px; height:100vh; z-index:200;
  background:var(--color-surface); border-right:1px solid var(--color-border);
  display:flex; flex-direction:column;
}
.sb-brand{display:flex;align-items:center;gap:10px;padding:18px 20px 14px}
.sb-logo{width:34px;height:34px;flex:0 0 34px;border-radius:10px;background:var(--color-secondary);
  display:grid;place-items:center;box-shadow:0 2px 6px rgba(192,59,43,.30)}
.sb-name{font-size:15px;font-weight:700;letter-spacing:.2px;line-height:1.3}
.sb-sub{font-size:11px;font-weight:500;color:var(--color-text-secondary);line-height:1.4}
.sb-nav{flex:1;overflow-y:auto;padding:2px 12px 14px}
.sb-group{font-size:11px;font-weight:600;color:var(--color-text-secondary);letter-spacing:.10em;padding:14px 10px 6px;text-transform:uppercase}
.sb-item{position:relative;display:flex;align-items:center;gap:10px;height:40px;padding:0 10px;margin-bottom:2px;
  border-radius:var(--radius-btn);color:var(--color-text-secondary);font-size:14px;font-weight:500;transition:background .15s,color .15s}
.sb-item svg{width:18px;height:18px;flex:0 0 18px;stroke:currentColor;stroke-width:1.5;fill:none;stroke-linecap:round;stroke-linejoin:round}
.sb-item:hover{background:var(--color-surface-muted);color:var(--color-text-primary)}
.sb-item.is-active{background:rgba(192,59,43,.12);color:var(--color-primary-strong);font-weight:600}
.sb-item.is-active::before{content:"";position:absolute;left:-12px;top:8px;bottom:8px;width:3px;
  border-radius:0 3px 3px 0;background:var(--color-primary-accent)}
.sb-badge{margin-left:auto;font-size:11px;font-weight:600;padding:1px 7px;border-radius:var(--radius-pill);
  background:var(--color-danger-soft);color:var(--color-danger-text);font-family:var(--num)}
.sb-foot{border-top:1px solid var(--color-border);padding:12px 14px;display:flex;align-items:center;gap:10px}
.sb-ava{width:32px;height:32px;flex:0 0 32px;border-radius:var(--radius-pill);background:var(--gradient-brand-deep);
  color:#fff;font-size:13px;font-weight:600;display:grid;place-items:center}
.sb-foot .n{font-size:13px;font-weight:600;line-height:1.3}
.sb-foot .r{font-size:11px;color:var(--color-text-secondary);line-height:1.4}

/* 左侧菜单折叠 */
.sb-toggle{width:28px;height:28px;border-radius:6px;display:grid;place-items:center;background:transparent;color:var(--color-text-secondary);border:1px solid transparent;margin-right:2px;transition:background .15s}
.sb-toggle:hover{background:var(--color-surface-muted);color:var(--color-text-primary)}
.sb-toggle svg{width:16px;height:16px;stroke:currentColor;stroke-width:2;fill:none;stroke-linecap:round;stroke-linejoin:round}
.sidebar{transition:width .2s ease,opacity .2s ease}
.sidebar.collapsed{width:0;padding:0;border:none;overflow:hidden;opacity:0}
.sidebar.collapsed .sb-brand,.sidebar.collapsed .sb-nav,.sidebar.collapsed .sb-foot{opacity:0}
.main{transition:margin-left .2s ease}
.main.expanded{margin-left:0}
.sb-toggle-float{position:fixed;left:0;top:18px;z-index:9999;width:30px;height:44px;border-radius:0 12px 12px 0;background:#fff;border:1px solid var(--color-border);border-left:none;box-shadow:var(--shadow-raised);display:grid;place-items:center;color:var(--color-text-secondary);transition:color .15s,background .15s;cursor:pointer}
.sb-toggle-float:hover{color:var(--color-primary-strong);background:var(--color-surface-muted)}
.sb-toggle-float svg{width:16px;height:16px;stroke:currentColor;stroke-width:2;fill:none;stroke-linecap:round;stroke-linejoin:round}
/* sb-toggle-float 一直显示 */

/* ============================ 4. 主区骨架 ============================ */
.main{margin-left:240px;min-height:100vh}
.page{max-width:1040px;margin:0 auto;padding:28px 32px 56px}

/* 顶部青蓝导航条（深青→蓝渐变，保证白字 AA） */
.topnav{position:sticky;top:0;z-index:150;background:var(--color-surface);color:var(--color-text-primary);border-bottom:1px solid var(--color-border);overflow:hidden}
.topnav::after{content:"";position:absolute;right:-60px;top:-90px;width:280px;height:280px;border-radius:50%;
  background:radial-gradient(circle,rgba(59,130,232,.10) 0%,rgba(59,130,232,0) 70%);pointer-events:none}
.tn-inner{position:relative;max-width:1040px;margin:0 auto;padding:0 32px;height:64px;display:flex;align-items:center;gap:16px}
.tn-title{font-size:16px;font-weight:700;letter-spacing:.2px}
.tn-dot{width:4px;height:4px;border-radius:50%;background:var(--color-border)}
.tn-sub{font-size:13px;color:var(--color-text-secondary)}
.tn-right{margin-left:auto;display:flex;align-items:center;gap:12px}
.tn-countdown{cursor:pointer;transition:border-color .15s,box-shadow .15s}
.tn-countdown:hover{border-color:var(--color-primary);box-shadow:var(--shadow-raised)}
.countdown{display:flex;align-items:baseline;gap:6px;background:var(--color-surface-muted);border:1px solid var(--color-border);border-radius:var(--radius-pill);
  padding:7px 16px 7px 14px;box-shadow:none}
.cd-label{font-size:12px;font-weight:500;color:var(--color-text-secondary)}
.cd-num{font-family:var(--num);font-variant-numeric:tabular-nums;font-size:20px;font-weight:800;
  color:var(--color-primary-strong);line-height:1}
.cd-unit{font-size:12px;font-weight:600;color:var(--color-primary-strong)}
.tn-btn{width:36px;height:36px;border-radius:var(--radius-btn);display:grid;place-items:center;
  background:var(--color-surface-muted);transition:background .15s}
.tn-btn:hover{background:var(--color-border)}
.tn-btn svg{width:18px;height:18px;stroke:var(--color-text-secondary);stroke-width:1.6;fill:none;stroke-linecap:round;stroke-linejoin:round}

/* ============================ 5. 通用组件 ============================ */
.page-head{display:flex;align-items:flex-end;gap:16px;margin-bottom:var(--space-xl)}
.page-head h1{font-size:32px;font-weight:700;line-height:1.2;letter-spacing:-.4px}
.page-head p{font-size:14px;color:var(--color-text-secondary);margin-top:6px}
.page-head .spacer{margin-left:auto}

.sec{margin-bottom:var(--space-xl)}
.sec-head{display:flex;align-items:center;gap:10px;margin-bottom:var(--space-md)}
.sec-head h2{font-size:20px;font-weight:600;line-height:1.3;letter-spacing:-.2px}
.sec-head .hint{font-size:13px;color:var(--color-text-secondary)}
.sec-head .more{margin-left:auto;font-size:13px;font-weight:600;color:var(--color-primary-strong)}
.sec-head .more:hover{text-decoration:underline}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:40px;padding:0 20px;
  border-radius:var(--radius-btn);font-size:14px;font-weight:600;transition:background .15s,box-shadow .15s,transform .15s}
.btn-sm{height:32px;padding:0 14px;font-size:13px}
.btn-primary{background:var(--color-secondary-strong);color:#fff}          /* 深蓝 + 白字 AA */
.btn-primary:hover{background:var(--color-secondary-deep)}
.btn-teal{background:var(--color-primary);color:var(--color-text-primary)} /* 浅青绿 + 深字 AA */
.btn-teal:hover{background:#B43222}
.btn-secondary{background:#fff;color:var(--color-text-primary);border:1px solid var(--color-border)}
.btn-secondary:hover{background:var(--color-surface-muted)}
.btn-ghost{color:var(--color-primary-strong)}
.btn-ghost:hover{background:rgba(192,59,43,.12)}

.chip{display:inline-flex;align-items:center;gap:4px;height:22px;padding:0 8px;border-radius:6px;
  font-size:12px;font-weight:600;font-family:var(--num)}
.chip-up{background:var(--color-success-soft);color:var(--color-success-text)}
.chip-down{background:var(--color-danger-soft);color:var(--color-danger-text)}
.chip-neutral{background:var(--color-surface-muted);color:var(--color-text-secondary)}

/* ============================ 6. 学习阶段大卡（2.5D 插图） ============================ */
.stage-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:var(--space-lg)}
.stage-card{background:var(--color-surface);border:1px solid var(--color-border);border-radius:var(--radius-card);
  box-shadow:var(--shadow-raised);overflow:hidden;display:flex;flex-direction:column;
  transition:transform .18s ease,box-shadow .18s ease}
.stage-card:hover{transform:translateY(-3px);box-shadow:var(--shadow-floating)}
.sc-illus{position:relative;height:146px;background:var(--gradient-brand-soft);display:grid;place-items:center}
.sc-illus svg{width:198px;height:138px;display:block}
.sc-step{position:absolute;left:16px;top:14px;display:inline-flex;align-items:center;gap:5px;height:24px;padding:0 10px;
  border-radius:var(--radius-pill);background:rgba(255,255,255,.92);color:var(--color-primary-strong);
  font-size:12px;font-weight:700;letter-spacing:.04em;font-family:var(--num);box-shadow:0 1px 2px rgba(43,40,38,.07)}
.sc-lock{position:absolute;right:14px;top:14px;display:inline-flex;align-items:center;gap:5px;height:24px;padding:0 10px;
  border-radius:var(--radius-pill);background:rgba(255,255,255,.92);color:var(--color-text-secondary);font-size:11px;font-weight:600}
.sc-lock svg{width:12px !important;height:12px !important;stroke:currentColor;stroke-width:2;fill:none}
.sc-body{padding:20px 20px 22px;display:flex;flex-direction:column;flex:1}
.sc-title{font-size:20px;font-weight:600;line-height:1.35;letter-spacing:-.2px}
.sc-desc{font-size:13px;color:var(--color-text-secondary);line-height:1.65;margin-top:6px;min-height:44px}
.sc-meta{display:flex;align-items:baseline;justify-content:space-between;margin-top:16px;font-size:12px;color:var(--color-text-secondary)}
.sc-meta b{font-family:var(--num);font-size:15px;font-weight:700;color:var(--color-text-primary)}
.bar{height:6px;border-radius:var(--radius-pill);background:var(--color-surface-muted);overflow:hidden;margin-top:8px}
.bar i{display:block;height:100%;border-radius:var(--radius-pill);background:var(--gradient-brand)}
.sc-foot{margin-top:18px}
.sc-foot .btn{width:100%}

/* ============================ 7. 功能卡（机考 / PK） ============================ */
.feat-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:var(--space-lg)}
.feat-card{background:var(--color-surface);border:1px solid var(--color-border);border-radius:var(--radius-card);
  box-shadow:var(--shadow-raised);padding:20px;display:flex;gap:18px;transition:transform .18s,box-shadow .18s}
.feat-card:hover{transform:translateY(-2px);box-shadow:var(--shadow-floating)}
.fc-visual{position:relative;width:112px;height:112px;flex:0 0 112px;border-radius:var(--radius-card-sm);
  background:var(--gradient-brand-deep);display:grid;place-items:center;overflow:hidden}
.fc-visual::after{content:"";position:absolute;left:-30px;bottom:-40px;width:130px;height:130px;border-radius:50%;
  background:radial-gradient(circle,rgba(192,59,43,.40) 0%,rgba(192,59,43,0) 70%)}
.fc-visual svg{position:relative;width:58px;height:58px;stroke:#fff;stroke-width:1.6;fill:none;stroke-linecap:round;stroke-linejoin:round}
.fc-body{flex:1;min-width:0;display:flex;flex-direction:column}
.fc-title{font-size:18px;font-weight:600;line-height:1.35}
.fc-desc{font-size:13px;color:var(--color-text-secondary);line-height:1.6;margin-top:6px}
.fc-stats{display:flex;gap:14px;margin-top:12px;flex-wrap:wrap}
.fc-stats span{font-size:12px;color:var(--color-text-secondary)}
.fc-stats b{font-family:var(--num);font-size:13px;font-weight:700;color:var(--color-text-primary)}
.fc-act{margin-top:auto;padding-top:14px;display:flex;align-items:center;gap:8px}

/* ============================ 8. 我的记录 6 格面板 ============================ */
.rec-panel{background:var(--color-surface);border:1px solid var(--color-border);border-radius:var(--radius-card);
  box-shadow:var(--shadow-raised);overflow:hidden;display:grid;grid-template-columns:repeat(3,1fr)}
.rec{display:flex;align-items:center;gap:14px;padding:20px 22px;border-right:1px solid var(--color-border);
  border-bottom:1px solid var(--color-border);transition:background .15s}
.rec:hover{background:#FBFDFE}
.rec:nth-child(3n){border-right:0}
.rec:nth-child(n+4){border-bottom:0}
.rec-ico{width:40px;height:40px;flex:0 0 40px;border-radius:10px;background:rgba(192,59,43,.13);display:grid;place-items:center}
.rec-ico svg{width:20px;height:20px;stroke:var(--color-primary-strong);stroke-width:1.5;fill:none;stroke-linecap:round;stroke-linejoin:round}
.rec-l{font-size:13px;color:var(--color-text-secondary);line-height:1.4}
.rec-v{font-family:var(--num);font-size:20px;font-weight:700;line-height:1.3;letter-spacing:-.3px}
.rec-v small{font-family:var(--font-body);font-size:12px;font-weight:500;color:var(--color-text-secondary);margin-left:3px}
.rec-arrow{margin-left:auto;font-size:12px;font-weight:600;color:var(--color-primary-strong)}

/* ============================ 9. 底部学习评估条 ============================ */
.assess{position:relative;background:var(--color-surface);border:1px solid var(--color-border);
  border-radius:var(--radius-card);box-shadow:var(--shadow-raised);padding:24px 28px 26px;overflow:hidden}
.assess::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--gradient-brand)}
.assess::after{content:"";position:absolute;right:-70px;top:-110px;width:300px;height:300px;border-radius:50%;
  background:radial-gradient(circle,rgba(192,59,43,.10) 0%,rgba(192,59,43,0) 70%);pointer-events:none}
.as-head{position:relative;display:flex;align-items:flex-start;gap:16px;padding-bottom:20px;
  border-bottom:1px solid var(--color-border)}
.as-head h3{font-size:18px;font-weight:600;line-height:1.35}
.as-head p{font-size:12px;color:var(--color-text-secondary);margin-top:5px}
.as-head .btn{margin-left:auto}
.as-grid{position:relative;display:grid;grid-template-columns:repeat(3,1fr);margin-top:22px}
.stat{padding:0 26px;border-left:1px solid var(--color-border)}
.stat:first-child{padding-left:0;border-left:0}
.stat-l{display:flex;align-items:center;gap:6px;font-size:13px;font-weight:600;color:var(--color-text-secondary)}
.stat-l .d{width:7px;height:7px;border-radius:50%}
.stat-num{font-family:var(--num);font-variant-numeric:tabular-nums;font-size:48px;font-weight:800;
  line-height:1.05;letter-spacing:-2px;color:var(--color-text-primary);margin-top:6px}
.stat-num .u{font-size:16px;font-weight:600;letter-spacing:0;color:var(--color-text-secondary);margin-left:2px}
.stat-foot{display:flex;align-items:center;gap:8px;margin-top:10px;font-size:12px;color:var(--color-text-secondary)}
.mini-bar{height:5px;border-radius:var(--radius-pill);background:var(--color-surface-muted);overflow:hidden;margin-top:12px;max-width:200px}
.mini-bar i{display:block;height:100%;border-radius:var(--radius-pill)}
.as-tip{position:relative;display:flex;align-items:center;gap:10px;margin-top:22px;padding:14px 16px;
  border-radius:var(--radius-card-sm);background:var(--color-surface-muted)}
.as-tip svg{width:18px;height:18px;flex:0 0 18px;stroke:var(--color-primary-strong);stroke-width:1.6;fill:none;stroke-linecap:round;stroke-linejoin:round}
.as-tip p{font-size:13px;color:var(--color-text-secondary)}
.as-tip b{color:var(--color-text-primary);font-weight:600}
.as-tip .btn{margin-left:auto;flex:0 0 auto}

/* ============================ 10. 响应式（桌面优先） ============================ */
@media (max-width:1100px){
  .sidebar:not(.collapsed){width:64px}
  .sb-txt,.sb-brandtxt,.sb-group,.sb-badge,.sb-foot .t{display:none}
  .sb-item{justify-content:center;padding:0}
  .sb-brand,.sb-foot{justify-content:center;padding:16px 0}
  .main:not(.expanded){margin-left:64px}
  .stage-grid,.feat-grid{grid-template-columns:1fr}
  .rec-panel{grid-template-columns:repeat(2,1fr)}
  .rec:nth-child(3n){border-right:1px solid var(--color-border)}
  .rec:nth-child(2n){border-right:0}
  .as-grid{grid-template-columns:1fr;gap:20px}
  .stat{padding:0;border-left:0}
}
@media (max-width:767px){
  .sidebar{display:none}.main{margin-left:0}
  .stat-num{font-size:36px}
  .rec-panel{grid-template-columns:1fr}
}

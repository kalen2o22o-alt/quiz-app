.sidebar{transition:width .2s ease,opacity .2s ease}
.sidebar.collapsed{width:0;padding:0;border:none;overflow:hidden;opacity:0}
.sidebar.collapsed .sb-brand,.sidebar.collapsed .sb-nav,.sidebar.collapsed .sb-foot{opacity:0}
.main{transition:margin-left .2s ease}
.main.expanded{margin-left:0}
.sb-toggle-float{position:fixed;left:0;top:18px;z-index:9999;width:30px;height:44px;border-radius:0 12px 12px 0;background:#fff;border:1px solid var(--color-border);border-left:none;box-shadow:var(--shadow-raised);display:grid;place-items:center;color:var(--color-text-secondary);transition:color .15s,background .15s;cursor:pointer}
.sb-toggle-float:hover{color:var(--color-primary-strong);background:var(--color-surface-muted)}
.sb-toggle-float svg{width:16px;height:16px;stroke:currentColor;stroke-width:2;fill:none;stroke-linecap:round;stroke-linejoin:round}
/* sb-toggle-float 一直显示 */

/* ============================ 4. 主区 + 做题顶栏 ============================ */
.main{margin-left:240px;min-height:100vh}
.topbar{position:sticky;top:0;z-index:150;height:56px;background:rgba(255,255,255,.94);
  backdrop-filter:saturate(180%) blur(8px);border-bottom:1px solid var(--color-border)}
.tb-inner{max-width:1040px;margin:0 auto;padding:0 24px;height:56px;display:flex;align-items:center;gap:10px}
.back{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 10px 0 8px;border-radius:var(--radius-btn);
  font-size:13px;font-weight:600;color:var(--color-text-secondary)}
.back:hover{background:var(--color-surface-muted);color:var(--color-text-primary)}
.back svg{width:15px;height:15px;stroke:currentColor;stroke-width:2;fill:none;stroke-linecap:round;stroke-linejoin:round}
.tb-title{font-size:13px;color:var(--color-text-secondary)}
.tb-title b{color:var(--color-text-primary);font-weight:600}
.tb-right{margin-left:auto;display:flex;align-items:center;gap:10px}
.timer{display:flex;align-items:center;gap:7px;height:32px;padding:0 12px;border-radius:var(--radius-pill);
  background:var(--color-surface-muted)}
.timer svg{width:14px;height:14px;stroke:var(--color-text-secondary);stroke-width:1.8;fill:none;stroke-linecap:round;stroke-linejoin:round}
.timer b{font-family:var(--num);font-variant-numeric:tabular-nums;font-size:13px;font-weight:700;letter-spacing:.3px}
.prog-mini{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--color-text-secondary)}
.prog-mini .t{width:96px;height:5px;border-radius:var(--radius-pill);background:var(--color-surface-muted);overflow:hidden}
.prog-mini .t i{display:block;height:100%;background:var(--gradient-brand);border-radius:var(--radius-pill)}
.prog-mini b{font-family:var(--num);color:var(--color-text-primary);font-weight:700}

/* ============================ 5. 三栏栅格 ============================ */
.cols{width:100%;max-width:none;margin:0 auto;padding:20px 28px 48px;
  display:grid;grid-template-columns:var(--left-w,210px) minmax(0,1fr) var(--right-w,380px);gap:18px;align-items:start;transition:grid-template-columns .2s ease}
.cols.right-collapsed{grid-template-columns:var(--left-w,210px) minmax(0,1fr) 0;gap:0 0}
.col-right{position:relative;transition:opacity .2s ease,width .2s ease}
.cols.right-collapsed .col-right{opacity:0;pointer-events:none;overflow:hidden}
.right-toggle{position:absolute;right:-12px;top:12px;z-index:10;width:26px;height:26px;border-radius:6px;background:#fff;border:1px solid var(--color-border);box-shadow:var(--shadow-raised);display:grid;place-items:center;color:var(--color-text-secondary);cursor:pointer}
.right-toggle:hover{background:var(--color-surface-muted);color:var(--color-text-primary)}
.right-toggle svg{width:14px;height:14px;stroke:currentColor;stroke-width:2.2;fill:none;stroke-linecap:round;stroke-linejoin:round}
/* 右栏被隐藏时的浮动展开按钮（固定在右上角，始终可点） */
.right-toggle-float{position:fixed;right:16px;top:70px;z-index:300;width:36px;height:36px;border-radius:8px;background:#fff;border:1px solid var(--color-border);box-shadow:var(--shadow-floating);display:none;place-items:center;color:var(--color-text-secondary);cursor:pointer}
.right-toggle-float:hover{background:var(--color-surface-muted);color:var(--color-text-primary)}
.right-toggle-float svg{width:18px;height:18px;stroke:currentColor;stroke-width:2;fill:none;stroke-linecap:round;stroke-linejoin:round}
.cols.right-collapsed .right-toggle{display:none}
.cols.right-collapsed .right-toggle-float{display:grid}
.section-toggle{width:24px;height:24px;border-radius:5px;display:grid;place-items:center;background:transparent;border:1px solid transparent;color:var(--color-text-secondary);margin-left:auto;transition:background .15s,transform .2s}
.section-toggle:hover{background:var(--color-surface-muted);color:var(--color-text-primary)}
.section-toggle svg{width:13px;height:13px;stroke:currentColor;stroke-width:2.2;fill:none;stroke-linecap:round,stroke-linejoin:round}
.right-section.collapsed .section-toggle{transform:rotate(-90deg)}
.right-section.collapsed .section-body{display:none}
.right-section.collapsed .card-h{border-bottom:0;padding-bottom:14px}
.right-section .card-h{padding-bottom:8px}
.right-section + .right-section{margin-top:14px}
.card{background:var(--color-surface);border:1px solid var(--color-border);border-radius:var(--radius-card-sm);
  box-shadow:var(--shadow-raised)}
.card + .card{margin-top:16px}
.card-h{display:flex;align-items:center;gap:8px;padding:14px 16px 0}
.card-h h3{font-size:14px;font-weight:600;letter-spacing:.1px}
.card-h .sp{margin-left:auto;font-size:11px;color:var(--color-text-secondary)}
.card-b{padding:12px 16px 16px}
.sticky{position:sticky;top:76px}

/* ---- 左栏：训练信息 ---- */
.info-row{display:flex;align-items:baseline;justify-content:space-between;font-size:12px;
  color:var(--color-text-secondary);padding:6px 0}
.info-row + .info-row{border-top:1px solid var(--color-border)}
.info-row b{font-size:12px;font-weight:600;color:var(--color-text-primary);text-align:right;max-width:120px}
.mode-tag{display:inline-flex;align-items:center;gap:5px;height:22px;padding:0 9px;border-radius:var(--radius-pill);
  background:rgba(192,59,43,.14);color:var(--color-primary-strong);font-size:11px;font-weight:700}

/* ---- 左栏：答题卡 ---- */
.sheet{display:grid;grid-template-columns:repeat(5,1fr);gap:5px;max-width:460px;margin:0 auto}
.cell{position:relative;aspect-ratio:1/1;border-radius:var(--radius-btn);border:1px solid var(--color-border);
  background:#fff;color:var(--color-text-secondary);font-family:var(--num);font-size:10px;font-weight:600;display:grid;place-items:center;transition:transform .12s,box-shadow .12s;width:100%;box-sizing:border-box;overflow:hidden}
.cell:hover{transform:translateY(-1px);box-shadow:var(--shadow-raised)}
.cell.ok{background:var(--color-success-soft);border-color:#8FE3AC;color:var(--color-success-text)}
.cell.no{background:var(--color-danger-soft);border-color:#F6ADAD;color:var(--color-danger-text)}
.cell.cur{background:rgba(192,59,43,.16);border:2px solid var(--color-primary);color:var(--color-text-primary);font-weight:800}
.cell.flag::after{content:"";position:absolute;top:3px;right:3px;width:5px;height:5px;border-radius:50%;background:#B45309}
.legend{display:flex;flex-wrap:wrap;gap:8px 12px;margin-top:14px;padding-top:12px;border-top:1px solid var(--color-border)}
.legend span{display:inline-flex;align-items:center;gap:5px;font-size:11px;color:var(--color-text-secondary)}
.legend i{width:10px;height:10px;border-radius:3px;border:1px solid var(--color-border);display:inline-block}
.sheet-top{display:flex;align-items:baseline;gap:6px;padding:0 16px 10px}
.sheet-top .big{font-family:var(--num);font-size:20px;font-weight:800;line-height:1;letter-spacing:-.5px}
.sheet-top .tot{font-size:12px;color:var(--color-text-secondary)}
.sheet-top .rate{margin-left:auto;font-size:11px;color:var(--color-text-secondary)}
.sheet-top .rate b{font-family:var(--num);color:var(--color-success-text);font-weight:700}

/* 左栏快捷导航 */
.qnav{display:flex;flex-direction:column;gap:6px}
.qnav a{display:flex;align-items:center;gap:8px;height:32px;padding:0 10px;border-radius:var(--radius-btn);
  font-size:13px;color:var(--color-text-secondary);font-weight:500}
.qnav a:hover{background:var(--color-surface-muted);color:var(--color-text-primary)}
.qnav a svg{width:15px;height:15px;stroke:currentColor;stroke-width:1.6;fill:none;stroke-linecap:round;stroke-linejoin:round}
.qnav a .c{margin-left:auto;font-family:var(--num);font-size:11px}

/* ============================ 6. 中栏：题目（Notion 式排版） ============================ */
.q-card{background:var(--color-surface);border:1px solid var(--color-border);border-radius:var(--radius-card);
  box-shadow:var(--shadow-raised);padding:20px 22px 18px}
.q-head{display:flex;align-items:center;gap:10px;padding-bottom:12px;border-bottom:1px solid var(--color-border)}
.q-no{display:inline-flex;align-items:center;justify-content:center;min-width:30px;height:30px;padding:0 8px;
  border-radius:var(--radius-btn);background:var(--color-text-primary);color:#fff;
  font-family:var(--num);font-size:14px;font-weight:700}
.tag{display:inline-flex;align-items:center;height:22px;padding:0 8px;border-radius:6px;font-size:11px;font-weight:600}
.tag-gray{background:var(--color-surface-muted);color:var(--color-text-secondary)}
.tag-teal{background:rgba(192,59,43,.14);color:var(--color-primary-strong)}
.tag-green{background:var(--color-success-soft);color:var(--color-success-text)}
.tag-red{background:var(--color-danger-soft);color:var(--color-danger-text)}
.q-head .diff{font-size:11px;color:#B45309;letter-spacing:1px}
.q-head .meta{font-size:12px;color:var(--color-text-secondary)}
.q-head .sp{margin-left:auto;display:flex;gap:4px}
.ico-btn{width:30px;height:30px;border-radius:7px;display:grid;place-items:center;color:var(--color-text-secondary)}
.ico-btn:hover{background:var(--color-surface-muted);color:var(--color-text-primary)}
.ico-btn.on{background:rgba(192,59,43,.14);color:var(--color-primary-strong)}
.ico-btn svg{width:16px;height:16px;stroke:currentColor;stroke-width:1.6;fill:none;stroke-linecap:round;stroke-linejoin:round}

.stem{font-size:14.5px;line-height:1.7;margin-top:16px;letter-spacing:.12px;color:#111827}
.stem em{font-style:normal;background:linear-gradient(transparent 62%,rgba(192,59,43,.32) 0);padding:0 1px}
.stem .q{color:var(--color-text-secondary)}
.stem-note{display:flex;gap:8px;margin-top:14px;padding:12px 14px;border-radius:var(--radius-btn);
  background:#FBFCFE;border:1px solid var(--color-border);font-size:13px;color:var(--color-text-secondary);line-height:1.7}
.stem-note b{color:var(--color-text-primary);font-weight:600}

.opts{margin-top:18px;display:flex;flex-direction:column;gap:10px}
.opt{display:flex;align-items:flex-start;gap:12px;padding:12px 14px;border-radius:var(--radius-btn);
  border:1px solid var(--color-border);background:#fff;font-size:14px;line-height:1.7;cursor:pointer;
  transition:border-color .15s,background .15s,box-shadow .15s}
.opt:hover{border-color:#CBD5E1;background:#FCFDFE}
.opt .k{flex:0 0 26px;height:26px;border-radius:50%;border:1.5px solid var(--color-border);
  display:grid;place-items:center;font-family:var(--num);font-size:12.5px;font-weight:700;
  color:var(--color-text-secondary);margin-top:1px}
.opt .txt{flex:1;min-width:0}
.opt .mk{flex:0 0 auto;font-size:11px;font-weight:700;height:22px;padding:0 8px;border-radius:6px;
  display:inline-flex;align-items:center;margin-top:2px}
/* 正确 / 错误状态（三色功能化） */
.opt.is-right{border-color:#8FE3AC;background:#F3FCF6}
.opt.is-right .k{border-color:var(--color-success);background:var(--color-success-soft);color:var(--color-success-text)}
.opt.is-right .mk{background:var(--color-success-soft);color:var(--color-success-text)}
.opt.is-wrong{border-color:#F6ADAD;background:#FEF4F4}
.opt.is-wrong .k{border-color:var(--color-danger);background:var(--color-danger-soft);color:var(--color-danger-text)}
.opt.is-wrong .mk{background:var(--color-danger-soft);color:var(--color-danger-text)}
.opt.is-pick{border-color:var(--color-primary);background:rgba(192,59,43,.08);box-shadow:0 0 0 3px rgba(192,59,43,.16)}
.opt.is-pick .k{border-color:var(--color-primary);background:var(--color-primary);color:var(--color-text-primary)}

.verdict{display:flex;align-items:center;gap:12px;margin-top:20px;padding:14px 16px;border-radius:var(--radius-btn);
  background:#FEF4F4;border:1px solid #F6ADAD}
.verdict .ic{width:30px;height:30px;flex:0 0 30px;border-radius:50%;background:var(--color-danger);display:grid;place-items:center}
.verdict .ic svg{width:16px;height:16px;stroke:#fff;stroke-width:2.4;fill:none;stroke-linecap:round}
.verdict .t{font-size:13px;font-weight:700;color:var(--color-danger-text)}
.verdict .d{font-size:12px;color:var(--color-text-secondary);margin-top:2px}
.verdict .sp{margin-left:auto;display:flex;align-items:center;gap:14px;font-size:12px;color:var(--color-text-secondary)}
.verdict .sp b{font-family:var(--num);font-size:15px;font-weight:800;color:var(--color-text-primary)}

.q-foot{display:flex;align-items:center;gap:10px;margin-top:22px;padding-top:18px;border-top:1px solid var(--color-border)}
.q-foot .sp{margin-left:auto;display:flex;gap:10px}

/* 中栏：我的笔记 */
.note-card{margin-top:16px;background:var(--color-surface);border:1px solid var(--color-border);
  border-radius:var(--radius-card-sm);padding:18px 20px}
.note-card h3{font-size:14px;font-weight:600;display:flex;align-items:center;gap:7px}
.note-card h3 svg{width:15px;height:15px;stroke:var(--color-primary-strong);stroke-width:1.7;fill:none;stroke-linecap:round;stroke-linejoin:round}
.note-body{margin-top:10px;font-size:14px;line-height:1.8;color:#1E293B;padding:12px 14px;border-radius:var(--radius-btn);
  background:#FBFCFE;border:1px dashed var(--color-border)}
.note-body b{font-weight:600}
.note-foot{display:flex;align-items:center;gap:8px;margin-top:10px;font-size:12px;color:var(--color-text-secondary)}
.note-foot .sp{margin-left:auto}

/* ============================ 7. 右栏：解析 + 视频 ============================ */
.ans-box{display:flex;gap:10px;padding:14px 16px 0}
.ab{flex:1;border-radius:var(--radius-btn);padding:10px 12px;text-align:center}
.ab.right{background:var(--color-success-soft)}
.ab.wrong{background:var(--color-danger-soft)}
.ab .l{font-size:11px;color:var(--color-text-secondary)}
.ab .v{font-family:var(--num);font-size:20px;font-weight:800;line-height:1.15;letter-spacing:.5px;margin-top:2px}
.ab.right .v{color:var(--color-success-text)}
.ab.wrong .v{color:var(--color-danger-text)}
.rate-row{display:flex;align-items:center;gap:8px;padding:12px 16px 0;font-size:12px;color:var(--color-text-secondary)}
.rate-row b{font-family:var(--num);color:var(--color-text-primary);font-weight:700}
.rate-bar{flex:1;height:5px;border-radius:var(--radius-pill);background:var(--color-surface-muted);overflow:hidden}
.rate-bar i{display:block;height:100%;border-radius:var(--radius-pill);background:var(--color-danger)}

.exp{font-size:13px;line-height:1.8;color:#1E293B;padding:14px 16px 0}
.exp p + p{margin-top:10px}
.exp b{font-weight:600;color:var(--color-text-primary)}
.exp .calc{font-family:var(--num);background:var(--color-surface-muted);border-radius:5px;padding:1px 6px;font-size:12.5px}
.exp .step{display:flex;gap:8px;margin-top:10px}
.exp .step .n{flex:0 0 18px;height:18px;border-radius:50%;background:rgba(192,59,43,.16);color:var(--color-primary-strong);
  font-family:var(--num);font-size:11px;font-weight:700;display:grid;place-items:center;margin-top:3px}
.warn{display:flex;gap:8px;margin:14px 16px 0;padding:11px 12px;border-radius:var(--radius-btn);
  background:#FEF4F4;border:1px solid #F6ADAD;font-size:12.5px;line-height:1.7;color:#7F1D1D}
.warn svg{width:15px;height:15px;flex:0 0 15px;stroke:var(--color-danger-text);stroke-width:2;fill:none;margin-top:3px}
.kp{display:flex;flex-wrap:wrap;gap:6px;padding:14px 16px 0}
.kp span{font-size:11px;font-weight:500;color:var(--color-text-secondary);background:var(--color-surface-muted);
  border-radius:5px;padding:3px 8px}
.src{padding:12px 16px 16px;font-size:11.5px;color:var(--color-text-secondary);line-height:1.7}
.src b{color:var(--color-text-primary);font-weight:600}

/* 视频卡片 */
.video{display:block;padding:14px 16px 16px}
.thumb{position:relative;border-radius:var(--radius-btn);overflow:hidden;background:var(--gradient-brand-soft);
  aspect-ratio:16/9;display:grid;place-items:center;transition:box-shadow .2s}
.thumb::before{content:"";position:absolute;inset:0;
  background:radial-gradient(circle at 30% 25%,rgba(255,255,255,.6) 0%,rgba(255,255,255,0) 55%)}
.thumb svg{position:relative;width:54px;height:54px;transition:transform .2s}
.video:hover .thumb{box-shadow:var(--shadow-floating)}
.video:hover .thumb svg{transform:scale(1.06)}
.dur{position:absolute;right:8px;bottom:8px;height:20px;padding:0 7px;border-radius:6px;
  background:rgba(43,40,38,.72);color:#fff;font-family:var(--num);font-size:11px;font-weight:600;
  display:inline-flex;align-items:center;letter-spacing:.3px}
.v-title{font-size:14px;font-weight:600;line-height:1.5;margin-top:10px;color:var(--color-text-primary)}
.v-meta{font-size:11.5px;color:var(--color-text-secondary);margin-top:5px}

/* 相关题目 */
.rel{padding:6px 8px 12px}
.rel a{display:flex;gap:10px;padding:9px 8px;border-radius:var(--radius-btn);font-size:12.5px;
  color:var(--color-text-primary);line-height:1.55}
.rel a:hover{background:var(--color-surface-muted)}
.rel a .i{flex:0 0 auto;font-family:var(--num);font-size:11px;font-weight:700;color:#475569;margin-top:1px}
.rel a .m{display:block;font-size:11px;color:var(--color-text-secondary);margin-top:3px}

/* ============================ 8. 按钮 ============================ */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:40px;padding:0 20px;
  border-radius:var(--radius-btn);font-size:14px;font-weight:600;transition:background .15s,box-shadow .15s}
.btn-sm{height:32px;padding:0 13px;font-size:13px}
.btn-block{width:100%}
.btn-teal{background:var(--color-primary);color:var(--color-text-primary)}
.btn-teal:hover{background:#B43222}
.btn-primary{background:var(--color-secondary-strong);color:#fff}
.btn-primary:hover{background:var(--color-secondary-deep)}
.btn-secondary{background:#fff;color:var(--color-text-primary);border:1px solid var(--color-border)}
.btn-secondary:hover{background:var(--color-surface-muted)}
.btn-ghost{color:var(--color-primary-strong)}
.btn-ghost:hover{background:rgba(192,59,43,.12)}
.btn-quiet{color:var(--color-text-secondary)}
.btn-quiet:hover{background:var(--color-surface-muted);color:var(--color-text-primary)}
.btn svg{width:15px;height:15px;stroke:currentColor;stroke-width:2;fill:none;stroke-linecap:round;stroke-linejoin:round}

/* ============================ 8.5 做题页扩展（答题卡分组 / 标记收藏 / 判定 / 交卷模态框） ============================ */
/* 答题卡：按题型分组 */
.sheet-group + .sheet-group{margin-top:14px}
.sheet-group-h{display:flex;align-items:center;gap:6px;font-size:11px;font-weight:600;color:var(--color-text-secondary);margin-bottom:8px;letter-spacing:.04em}
.sheet-group-h span{margin-left:auto;font-size:10px;font-weight:500;color:var(--color-text-secondary)}
/* 答题卡格子状态：已作答(蓝·做题中) / 待校验(灰·交卷后) / 已收藏(金点·左上) */
.cell.done{background:var(--color-secondary-soft);border-color:var(--color-secondary-light);color:var(--color-secondary-strong)}
.cell.pending{background:var(--color-surface-muted);border-color:#CBD5E1;color:var(--color-text-secondary)}
.cell.star::before{content:"";position:absolute;top:3px;left:3px;width:5px;height:5px;border-radius:50%;background:#F2B33D}
/* 当前题高亮优先级最高（覆盖 done/ok/no/pending 的边框与底色） */
.cell.cur{background:rgba(192,59,43,.16);border:2px solid var(--color-primary);color:var(--color-text-primary);font-weight:800}

/* 标记 / 收藏按钮激活态 */
.ico-btn.on-mark{background:rgba(180,83,9,.14);color:#B45309}
.ico-btn.on-mark svg{stroke:#B45309}
.ico-btn.on-star{background:rgba(242,179,61,.20);color:#B45309}
.ico-btn.on-star svg{fill:#F2B33D;stroke:#F2B33D}
.ico-btn.on-error{background:rgba(220,38,38,.15);color:#DC2626}
.ico-btn.on-error svg{fill:#DC2626;stroke:#DC2626}
.cell.error{background:rgba(220,38,38,.10);border-color:#DC2626;color:#DC2626}
.cell.error::before{content:"";position:absolute;top:3px;left:3px;width:5px;height:5px;border-radius:50%;background:#DC2626}
/* 标记此题 → 题卡橙色边框 + 右上角标 */
.q-card.is-marked{position:relative;border-color:#F59E0B;box-shadow:0 0 0 1px #F59E0B,var(--shadow-raised)}
.q-card.is-marked::after{content:"已标记";position:absolute;top:0;right:0;background:#B45309;color:#fff;font-size:10px;font-weight:700;padding:3px 9px;border-radius:0 var(--radius-card) 0 var(--radius-btn);letter-spacing:.5px}

/* 多选题选项：方形 checkbox（单选保持圆形） */
.type-multi .opt .k{border-radius:6px}

/* 选项锁定（交卷后不可点） */
.opts.locked .opt{cursor:default}
.opts.locked .opt:hover{border-color:var(--color-border);background:#fff;box-shadow:none}

/* 判定条：正确 / 待校验（错误态复用 .verdict 基底红色） */
.verdict.is-right{background:#F3FCF6;border-color:#8FE3AC}
.verdict.is-right .ic{background:var(--color-success)}
.verdict.is-right .t{color:var(--color-success-text)}
.verdict.is-pending{background:#FBFCFE;border-color:var(--color-border)}
.verdict.is-pending .ic{background:var(--color-text-secondary)}
.verdict.is-pending .t{color:var(--color-text-primary)}

/* 右栏答案对比：待校验态 */
.ab.pending{background:var(--color-surface-muted)}
.ab.pending .v{color:var(--color-text-secondary)}

/* ============================ 作答草稿 ============================ */
.draft-wrap{margin-top:14px;padding:12px 14px;background:var(--color-surface-2);border:1px solid var(--color-border);border-radius:var(--radius-card)}
.draft-label{display:block;font-size:11.5px;font-weight:600;color:var(--color-text-secondary);margin-bottom:8px;letter-spacing:.3px}
.draft-label::before{content:"✎";margin-right:6px;color:var(--color-secondary)}
.draft-input{width:100%;min-height:60px;padding:9px 12px;border:1px solid var(--color-border);border-radius:var(--radius-btn);font-size:13px;line-height:1.7;resize:vertical;font-family:inherit;color:var(--color-text-primary);background:#fff}
.draft-input:focus{outline:none;border-color:var(--color-secondary);box-shadow:0 0 0 3px rgba(192,59,43,.14)}
.draft-input::placeholder{color:#A9B2BF}
/* 交卷后草稿展示块（右栏，答案解析上方） */
.draft-view-block{margin-bottom:14px}
.draft-view{background:#FFFBEA;border:1px solid #F2D98A;border-left:3px solid #E0A800;border-radius:var(--radius-btn);padding:10px 12px;font-size:13.5px;line-height:1.75;color:#5B4A12;white-space:normal}

/* 底部导航位置指示 */
.q-foot .pos{font-family:var(--num);font-size:13px;font-weight:600;color:var(--color-text-secondary)}

/* 计时器：运行态微动效 */
.timer.live svg{stroke:var(--color-primary-strong);animation:tick-pulse 2s ease-in-out infinite}
@keyframes tick-pulse{0%,100%{opacity:1}50%{opacity:.45}}

/* 交卷结果模态框 */
.modal-mask{position:fixed;inset:0;z-index:1000;background:rgba(43,40,38,.45);backdrop-filter:blur(2px);display:grid;place-items:center;padding:20px}
.modal{position:relative;width:100%;max-width:440px;background:var(--color-surface);border-radius:var(--radius-card);box-shadow:0 20px 60px rgba(43,40,38,.25);overflow:hidden;animation:modal-in .18s ease-out}
@keyframes modal-in{from{opacity:0;transform:translateY(8px) scale(.98)}to{opacity:1;transform:none}}
.modal-head{padding:24px 24px 0;text-align:center}
.modal-head h3{font-size:19px;font-weight:700}
.modal-head p{font-size:13px;color:var(--color-text-secondary);margin-top:6px}
.modal-score{padding:16px 24px 4px;text-align:center}
.modal-score .s{font-family:var(--num);font-size:52px;font-weight:800;line-height:1;letter-spacing:-1px;background:var(--gradient-brand);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.modal-score .s-unit{font-family:var(--num);font-size:16px;font-weight:600;color:var(--color-text-secondary);margin-left:4px}
.modal-rate-row{display:flex;justify-content:center;gap:20px;padding:8px 24px 14px;font-size:12.5px;color:var(--color-text-secondary)}
.modal-rate-row b{font-family:var(--num);font-weight:700;color:var(--color-text-primary);margin-left:3px}
.modal-breakdown{padding:0 24px;display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.modal-breakdown .b{background:var(--color-surface-muted);border-radius:var(--radius-btn);padding:12px 8px;text-align:center}
.modal-breakdown .b .v{font-family:var(--num);font-size:22px;font-weight:800;line-height:1.1}
.modal-breakdown .b .l{font-size:11px;color:var(--color-text-secondary);margin-top:3px}
.modal-breakdown .b.ok .v{color:var(--color-success-text)}
.modal-breakdown .b.no .v{color:var(--color-danger-text)}
.modal-breakdown .b.pend .v{color:var(--color-text-secondary)}
.modal-tip{padding:14px 24px 4px;font-size:12px;color:var(--color-text-secondary);line-height:1.6;text-align:center}
.modal-actions{padding:16px 24px 24px;display:flex;gap:10px}
.modal-actions .btn{flex:1}
.modal-close{position:absolute;top:10px;right:12px;width:28px;height:28px;border-radius:50%;font-size:20px;line-height:1;color:var(--color-text-secondary);display:grid;place-items:center}
.modal-close:hover{background:var(--color-surface-muted);color:var(--color-text-primary)}

/* ============================ 9. 响应式 ============================ */
@media (max-width:1100px){
  .sidebar:not(.collapsed){width:64px}
  .sb-txt,.sb-brandtxt,.sb-group,.sb-badge,.sb-foot .t{display:none}
  .sb-item{justify-content:center;padding:0}
  .sb-brand,.sb-foot{justify-content:center;padding:16px 0}
  .main:not(.expanded){margin-left:64px}
  /* 窄屏保持三栏结构：右侧栏由 JS 默认折叠（.right-collapsed），分隔条常驻 */
}
@media (max-width:767px){
  .sidebar{display:none}.main{margin-left:0}
  .cols{grid-template-columns:1fr;padding:16px}
  .col-left,.col-right{grid-column:auto}
  .sticky{position:static}
  .q-card{padding:20px 18px}
}

:focus-visible{outline:2px solid var(--color-primary-strong);outline-offset:2px}
.sticky{max-height:calc(100vh - 92px);overflow-y:auto}.col-left.sticky{display:flex;flex-direction:column;overflow:visible;max-height:calc(100vh - 92px)}.col-left.sticky .card{flex:1;min-height:0;display:flex;flex-direction:column;margin-bottom:0}.col-left.sticky .card-b{flex:1;min-height:0;overflow-y:auto;padding:12px 16px}
.search:focus-within{border-color:var(--color-primary-strong);box-shadow:0 0 0 3px rgba(192,59,43,.22)}

/* ============================ 解析复盘页专用 ============================ */
#review-flow{display:flex;flex-direction:column;gap:16px}
.hist-q{margin-top:0}
.hist-q .opts.locked .opt{cursor:default}
.hist-q .opts.locked .opt:hover{border-color:var(--color-border);background:#fff;box-shadow:none}
.hist-q .subj-box textarea{width:100%;min-height:80px;padding:10px 12px;border:1px solid var(--color-border);border-radius:var(--radius-btn);font-size:13px;line-height:1.7;resize:vertical;font-family:inherit;color:var(--color-text-primary);background:var(--color-surface-muted)}
.hist-q .q-head .meta b{color:var(--color-text-primary)}


/* ===== 学习中心（模块/科目入口） ===== */
.learn{max-width:1024px;margin:0 auto;padding:28px 24px}
.lc-hero{margin-bottom:26px}
.lc-hero h1{font-size:24px;margin:0 0 6px}
.lc-hero p{color:var(--color-text-secondary,#667);margin:0;font-size:13px}
.lc-modules{display:grid;grid-template-columns:repeat(auto-fit,minmax(262px,1fr));gap:14px}
.lc-mod{display:flex;align-items:center;gap:14px;padding:18px 16px;border:1px solid var(--color-border,#e3e8f0);border-radius:12px;background:#fff;cursor:pointer;transition:.18s;box-shadow:0 1px 3px rgba(16,24,40,.04)}
.lc-mod:hover{border-color:var(--color-primary,#E2573D);transform:translateY(-2px);box-shadow:0 6px 16px rgba(192,59,43,.12)}
.lc-mod.active{border-color:var(--color-primary,#E2573D);background:linear-gradient(135deg,rgba(192,59,43,.08),rgba(192,59,43,.06))}
.lc-mod-ico{width:52px;height:52px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:15px;color:#fff;background:linear-gradient(135deg,#E2573D,#C03B2B);flex:none}
.lc-mod-body{flex:1;min-width:0}
.lc-mod-body h3{margin:0 0 4px;font-size:16px}
.lc-mod-body p{margin:0 0 4px;font-size:12px;color:var(--color-text-secondary,#667);line-height:1.5}
.lc-mod-meta{font-size:11px;color:var(--color-primary,#E2573D);font-weight:600}
.lc-mod-arrow{color:#c2c9d6;font-size:20px}
.lc-sub-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:14px}
.lc-sub{display:flex;align-items:center;gap:12px;padding:16px 14px;border:1px solid var(--color-border,#e3e8f0);border-radius:12px;background:#fff;cursor:pointer;transition:.18s}
.lc-sub:hover{border-color:var(--color-primary,#E2573D);box-shadow:0 6px 16px rgba(192,59,43,.10)}
.lc-sub.active{border-color:var(--color-primary,#E2573D);background:rgba(192,59,43,.05)}
.lc-sub.disabled{opacity:.55;cursor:not-allowed}
.lc-sub-ico{width:42px;height:42px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-weight:700;color:var(--color-primary,#E2573D);background:rgba(192,59,43,.10);flex:none;font-size:15px}
.lc-sub-body{flex:1;min-width:0}
.lc-sub-body h4{margin:0 0 3px;font-size:14px}
.lc-sub-body p{margin:0;font-size:11px;color:var(--color-text-secondary,#667)}
.lc-sub-arrow{color:#c2c9d6;font-size:18px}
.lc-sub-wait{font-size:11px;color:#c2c9d6;white-space:nowrap}
.lc-empty{text-align:center;padding:56px 16px;border:1px dashed var(--color-border,#e3e8f0);border-radius:12px;background:#fafbfc}
.lc-empty-ico{font-size:30px;margin-bottom:10px}
.lc-empty h3{margin:0 0 8px;font-size:16px}
.lc-empty p{margin:0;color:var(--color-text-secondary,#667);font-size:13px}

/* 左侧栏分隔条（左|中边界）：定位在 col-left 右侧 */
.tn-countdown .cd-label{white-space:nowrap}

/* ===== 三栏可调 + 左右侧栏可折叠（分隔条独立成列） ===== */
.cols{grid-template-columns:var(--left-w,210px) 36px minmax(0,1fr) 12px var(--right-w,380px);gap:0}
.cols.left-collapsed{grid-template-columns:0 24px minmax(0,1fr) 12px var(--right-w,380px)}
.cols.right-collapsed{grid-template-columns:var(--left-w,210px) 24px minmax(0,1fr) 12px 0}
.cols.left-collapsed .col-left,
.cols.right-collapsed .col-right{opacity:0;pointer-events:none;overflow:hidden;min-width:0}

.cols.left-collapsed .col-left .col-toggle-mini{opacity:1 !important;pointer-events:auto !important}
.cols.right-collapsed .col-right .col-toggle{opacity:1 !important;pointer-events:auto !important}
.v-splitter{position:sticky;top:76px;height:calc(100vh - 92px);z-index:20;align-self:start;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:col-resize;border-radius:10px;transition:background .15s}
.v-splitter::after{display:none}
.v-splitter:hover{background:rgba(43,40,38,.045)}

.col-toggle{display:grid;place-items:center;cursor:pointer;flex:none;transition:background .15s,color .15s}
.col-toggle:hover{background:#EFF5FF;color:var(--color-primary-strong,#1E5BC6)}
.col-toggle svg{width:13px;height:13px;stroke:currentColor;stroke-width:2.2;fill:none;stroke-linecap:round;stroke-linejoin:round}
@media (max-width:767px){.v-splitter{display:none}}

/* ============================ 99. 设计统一精修层（追加覆盖 · 全部联动主题变量 · 不改变布局） ============================ */
/* —— 全局交互底色 —— */
::selection{background:rgba(192,59,43,.20);background:color-mix(in srgb,var(--color-primary,#C03B2B) 22%, transparent);color:var(--color-text-primary)}
*{scrollbar-width:thin;scrollbar-color:rgba(192,59,43,.4) transparent}
*::-webkit-scrollbar{width:10px;height:10px}
*::-webkit-scrollbar-thumb{background:rgba(192,59,43,.32);background:color-mix(in srgb,var(--color-primary,#C03B2B) 34%, transparent);border-radius:99px;border:2px solid transparent;background-clip:content-box}
*::-webkit-scrollbar-thumb:hover{background:rgba(192,59,43,.55);background:color-mix(in srgb,var(--color-primary,#C03B2B) 58%, transparent);background-clip:content-box;border:2px solid transparent}
*::-webkit-scrollbar-track{background:transparent}

/* —— 按钮：统一圆角 / 过渡 / 微交互（hover 微升、active 微按、focus 光环）—— */
.btn{border-radius:var(--radius-btn);font-weight:600;transition:transform .12s ease,box-shadow .16s ease,background .16s ease,color .16s ease,border-color .16s ease,filter .16s ease}
.btn:hover{transform:translateY(-1px)}
.btn:active{transform:translateY(0) scale(.98)}
.btn:focus-visible{outline:2px solid var(--color-secondary-strong);outline-offset:2px;box-shadow:0 0 0 4px rgba(192,59,43,.18)}
.btn-primary{box-shadow:0 2px 8px rgba(192,59,43,.20)}
.btn-primary:hover{box-shadow:0 5px 16px rgba(192,59,43,.30);filter:saturate(1.08)}
.btn-teal{box-shadow:0 2px 8px rgba(192,59,43,.20)}
.btn-teal:hover{box-shadow:0 5px 16px rgba(192,59,43,.30);background:var(--color-primary-deep);color:#fff}
.btn-secondary:hover{border-color:rgba(192,59,43,.45)}
.btn-ghost:hover{background:rgba(192,59,43,.14);background:color-mix(in srgb,var(--color-primary,#C03B2B) 14%, transparent)}

/* —— 卡片：统一层级，hover 微提升 —— */
.card,.q-card,.note-card,.subject-card,.lc-mod{transition:box-shadow .18s ease,transform .18s ease,border-color .18s ease}
.card:hover,.q-card:hover,.note-card:hover,.subject-card:hover{border-color:rgba(192,59,43,.30);box-shadow:var(--shadow-floating)}

/* —— 标签 / 徽标 / 难度星标 —— */
.tag{font-weight:600;letter-spacing:.02em}
.diff{color:#B45309}

/* —— 输入控件：品牌 focus 光环 —— */
input,textarea,select{transition:border-color .15s ease,box-shadow .15s ease}
input:focus,textarea:focus,select:focus{outline:none;border-color:var(--color-secondary);box-shadow:0 0 0 3px rgba(192,59,43,.16)}

/* —— 顶栏：底部品牌渐变细线 + 柔和阴影 —— */
.topbar{box-shadow:0 1px 0 rgba(43,40,38,.04),0 2px 10px rgba(43,40,38,.05)}
.topbar::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:2px;background:var(--gradient-brand);opacity:.85}

/* —— 侧边栏：激活态 / hover 全部联动主题（换科目跟着变色，修复写死青绿）—— */
.sb-item{transition:background .15s ease,color .15s ease,transform .12s ease}
.sb-item:hover{transform:translateX(2px)}
.sb-item.is-active{background:rgba(192,59,43,.12);background:color-mix(in srgb,var(--color-primary,#C03B2B) 13%, transparent)}
.sb-item.is-active::before{background:linear-gradient(180deg,var(--color-primary,#C03B2B),var(--color-secondary,#E2573D));border-radius:0 3px 3px 0}
.sb-item.is-active:hover{transform:none}

/* —— 链接 hover 微反馈 —— */
a{transition:color .12s ease}
a:hover{color:var(--color-primary-deep)}

/* —— 表格 / 答题卡 hover 联动 —— */
table{border-collapse:separate;border-spacing:0}
.grid-item,.sheet-grid .cell{transition:background .12s ease,border-color .12s ease,color .12s ease}
.grid-item:hover,.sheet-grid .cell:hover{border-color:var(--color-secondary);color:var(--color-secondary-strong)}

/* ============================ 100. 方案B · 现代学习空间（视觉层覆盖 · 模块结构与功能一律不动） ============================ */
/* —— 页面基调：柔和青绿底 —— */
body{background:#F7F7F5}
/* —— 全局卡片：16px 圆角 + 中性双层阴影（拟物纸面微凸） —— */
.card,.q-card,.note-card,.subject-card,.lc-mod{background:#fff;border-radius:16px;border:1px solid var(--color-border,#E6E8EB);box-shadow:0 1px 2px rgba(43,40,38,.05),0 2px 8px rgba(43,40,38,.06)}
/* —— 顶栏：半透明白 + 毛玻璃 + 底部品牌渐变细线 —— */
.topbar{background:rgba(255,255,255,.86);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:none;box-shadow:0 1px 0 rgba(43,40,38,.03),0 2px 12px rgba(43,40,38,.05)}
/* —— 侧栏：白底、圆角导航项、渐变激活态 —— */
.sidebar{background:#fff}
.sb-item{border-radius:12px;margin-bottom:4px}
.sb-item.is-active{background:linear-gradient(135deg,#E6FCF5,#E0F2FE);color:var(--color-primary-strong)}
.sb-item.is-active::before{background:linear-gradient(180deg,#C03B2B,#E2573D)}
/* —— 按钮：圆角加大，主按钮品牌渐变（深青→深蓝，白字全程达标） —— */
.btn{border-radius:8px;font-weight:600}
.btn-primary{background:var(--color-primary-deep,#8A2818);border-color:transparent;color:#fff;box-shadow:0 2px 6px rgba(43,40,38,.16)}
.btn-primary:hover{box-shadow:0 3px 10px rgba(43,40,38,.20);filter:brightness(1.06);transform:translateY(-1px)}
.btn-teal{border-radius:8px;box-shadow:0 2px 6px rgba(43,40,38,.12)}
.btn-teal:hover{box-shadow:0 3px 10px rgba(43,40,38,.16)}
.btn-secondary{border-radius:8px}
/* —— 选项：胶囊圆角 + hover 左移 + 选中渐变浅底 —— */
.opt{border-radius:14px;border:1.5px solid rgba(158,47,32,.14);background:#FAFDFC;transition:transform .14s ease,border-color .14s ease,background .14s ease,box-shadow .14s ease}
.opt:hover{border-color:#5DCAA5;transform:translateX(2px)}
.opt.is-pick{border-color:#C03B2B;background:linear-gradient(135deg,#FDF6F5,#FBEFE9);box-shadow:0 3px 10px rgba(192,59,43,.16)}
/* —— 标签：胶囊 —— */
.tag{border-radius:99px}
/* —— 答题卡：圆角格子 —— */
.grid-item,.sheet-grid .cell{border-radius:10px}
/* —— 进度条：品牌渐变 —— */
.bar i{background:linear-gradient(90deg,#C03B2B,#E2573D)}
/* —— 数字统一等宽 —— */
.fc-stats b,.stat b,.q-no,.pos{font-variant-numeric:tabular-nums}
/* —— 题目卡留白微调 —— */
.q-card{padding:26px 28px}
/* —— 链接 hover —— */
a:hover{color:var(--color-primary-deep)}
/* —— 滚动条与选区（品牌青） —— */
*{scrollbar-width:thin;scrollbar-color:rgba(158,47,32,.4) transparent}
*::-webkit-scrollbar{width:10px;height:10px}
*::-webkit-scrollbar-thumb{background:rgba(158,47,32,.32);border-radius:99px;border:2px solid transparent;background-clip:content-box}
*::-webkit-scrollbar-thumb:hover{background:rgba(158,47,32,.55);background-clip:content-box;border:2px solid transparent}
*::-webkit-scrollbar-track{background:transparent}
::selection{background:rgba(192,59,43,.18)}
/* —— 学习中心：模块选中态更明显 + 考试日期胶囊 —— */
.lc-mod{position:relative;overflow:hidden;transition:transform .16s ease,box-shadow .16s ease,border-color .16s ease}
.lc-mod:hover{transform:translateY(-1px);box-shadow:0 8px 26px rgba(192,59,43,.10)}
.lc-mod.active{border-color:#C03B2B;background:linear-gradient(135deg,#FDF6F5,#FBEFEC);box-shadow:0 8px 28px rgba(192,59,43,.16);transform:translateY(-2px)}
.lc-mod.active::after{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:linear-gradient(180deg,#C03B2B,#E2573D)}
.lc-mod.active .lc-mod-ico{box-shadow:0 4px 12px rgba(192,59,43,.30)}
.lc-mod-date{display:inline-flex;align-items:center;font-size:12px;color:var(--color-text-secondary);background:rgba(192,59,43,.08);border-radius:99px;padding:3px 10px;margin-top:8px}
.lc-mod.active .lc-mod-date{background:linear-gradient(135deg,#C03B2B,#E2573D);color:#fff;font-weight:500}
/* —— 学习中心配色：考试日期右上角 + 三考试浅色系 + 科目同系深浅（卡片结构不变） —— */
.lc-hero{margin-bottom:22px;display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap;position:relative}
.lc-hero-right{display:flex;align-items:center;gap:8px;flex-wrap:wrap;position:relative}
.motto-wrap{display:flex;align-items:center;gap:6px;position:relative}
.motto-txt{font-size:15px;font-weight:600;color:var(--color-text-primary)}
.motto-edit{width:26px;height:26px;border-radius:8px;border:1px solid var(--color-border);background:#fff;color:var(--color-text-secondary);cursor:pointer;display:grid;place-items:center;font-size:13px}
.motto-edit:hover{color:var(--color-primary-strong);border-color:var(--color-primary)}
.motto-pop{position:fixed;left:8px;top:80px;z-index:900;width:340px;background:#fff;border:1px solid var(--color-border);border-radius:12px;box-shadow:var(--shadow-floating);padding:14px;display:none}
.motto-pop.show{display:block}
.motto-pop h4{font-size:13px;font-weight:700;margin-bottom:10px;color:var(--color-text-primary)}
.motto-pop .in-row{display:flex;gap:8px}
.motto-pop input{flex:1;height:34px;border:1px solid var(--color-border);border-radius:8px;padding:0 10px;font-size:13px;outline:none}
.motto-pop input:focus{border-color:var(--color-primary)}
.motto-pop .ok-btn{height:34px;padding:0 14px;border:none;border-radius:8px;background:var(--color-secondary);color:#fff;font-size:13px;cursor:pointer}
.motto-pop .hist{margin-top:10px;max-height:220px;overflow:auto}
.motto-pop .hitem{display:flex;align-items:center;gap:8px;padding:7px 8px;border-radius:8px;cursor:pointer;font-size:13px}
.motto-pop .hitem:hover{background:var(--color-surface-muted)}
.motto-pop .hitem .d{font-size:11px;color:var(--color-text-secondary);font-family:var(--num);flex:none}
.motto-pop .hitem .t{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.motto-pop .hitem .del{border:none;background:none;color:var(--color-text-secondary);cursor:pointer;font-size:12px;font-family:inherit}
.motto-pop .hitem .del:hover{color:var(--color-danger)}
.motto-pop .mh-empty{font-size:12px;color:var(--color-text-secondary);padding:6px 4px}
.date-edit-btn{height:28px;padding:0 10px;border-radius:8px;border:1px solid var(--color-border);background:#fff;color:var(--color-text-secondary);font-size:12px;cursor:pointer}
.date-edit-btn:hover{color:var(--color-primary-strong);border-color:var(--color-primary)}
.date-pop{position:fixed;right:8px;top:80px;z-index:900;width:360px;background:#fff;border:1px solid var(--color-border);border-radius:12px;box-shadow:var(--shadow-floating);padding:14px;display:none}
.date-pop.show{display:block}
.date-pop h4{font-size:13px;font-weight:700;margin-bottom:10px}
.date-row{display:flex;align-items:center;gap:10px;padding:6px 2px}
.date-row .nm{flex:1;font-size:13px;font-weight:600}
.date-row input[type=date]{height:32px;border:1px solid var(--color-border);border-radius:8px;padding:0 8px;font-size:13px;font-family:var(--num);outline:none;background:#fff}
.date-row input[type=date]:focus{border-color:var(--color-primary)}
.date-pop .ops{display:flex;justify-content:flex-end;margin-top:10px;border-top:1px dashed var(--color-border);padding-top:10px}
.lc-save{height:32px;padding:0 16px;border:none;border-radius:8px;background:var(--color-secondary);color:#fff;font-size:13px;cursor:pointer}
/* 模块卡选中态：右上角「已选」标记（v2 移植） */
.lc-mod.active::after{content:'已选';position:absolute;left:auto;right:10px;top:10px;bottom:auto;width:auto;height:auto;font-size:10px;font-weight:700;color:#fff;background:var(--gradient-brand);border-radius:99px;padding:2px 9px;line-height:1.2}
.date-chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:500;color:#9E2F20;background:#fff;border:1px solid #F0C8C0;border-radius:99px;padding:6px 14px;box-shadow:0 2px 8px rgba(192,59,43,.08)}
.lc-modules{margin-bottom:30px}
.lc-subjects{margin-bottom:12px}
.lc-mod-ico{box-shadow:0 4px 10px rgba(16,24,40,.10)}
/* CPA · 蓝系 */
.lc-mod-cpa .lc-mod-ico{background:linear-gradient(135deg,#C03B2B,#9E2F20);box-shadow:0 4px 10px rgba(192,59,43,.25)}
.lc-mod-cpa.active{border-color:#C03B2B;background:linear-gradient(135deg,#FDF6F5,#FBEFEC);box-shadow:0 8px 22px rgba(192,59,43,.14)}
.lc-mod-cpa .lc-mod-arrow{color:#E8A49B}
/* 中级 · 青绿系 */
.lc-mod-mid .lc-mod-ico{background:linear-gradient(135deg,#B98A2F,#8A6D15);box-shadow:0 4px 10px rgba(185,138,47,.25)}
.lc-mod-mid.active{border-color:#B98A2F;background:linear-gradient(135deg,#FBF6EA,#F8F0DC);box-shadow:0 8px 22px rgba(185,138,47,.14)}
.lc-mod-mid .lc-mod-arrow{color:#D9BC6D}
/* 税务师 · 金系 */
.lc-mod-taxp .lc-mod-ico{background:linear-gradient(135deg,#2F8F6B,#1F6B4C);box-shadow:0 4px 10px rgba(47,143,107,.25)}
.lc-mod-taxp.active{border-color:#2F8F6B;background:linear-gradient(135deg,#EDF6F1,#E5F1EA);box-shadow:0 8px 22px rgba(47,143,107,.14)}
.lc-mod-taxp .lc-mod-arrow{color:#7FB99E}
/* 科目卡：跟随考试类型同色系，同系深浅递变（深→浅） */
.lc-theme-cpa .lc-sub-ico{color:#9E2F20;background:#F7E6E2}
.lc-theme-cpa .lc-sub.lc-depth-deep .lc-sub-ico{color:#fff;background:#9E2F20}
.lc-theme-cpa .lc-sub.lc-depth-mid .lc-sub-ico{color:#fff;background:#C03B2B}
.lc-theme-cpa .lc-sub.lc-depth-light .lc-sub-ico{color:#9E2F20;background:#F7E6E2}
.lc-theme-cpa .lc-sub.lc-depth-lightest .lc-sub-ico{color:#C03B2B;background:#FBEFE9}
.lc-theme-cpa .lc-sub.active{border-color:#C03B2B;background:#FDF6F5}
.lc-theme-mid .lc-sub-ico{color:#8A6D15;background:#F6EBD6}
.lc-theme-mid .lc-sub.lc-depth-deep .lc-sub-ico{color:#fff;background:#8A6D15}
.lc-theme-mid .lc-sub.lc-depth-mid .lc-sub-ico{color:#fff;background:#B98A2F}
.lc-theme-mid .lc-sub.lc-depth-light .lc-sub-ico{color:#8A6D15;background:#F6EBD6}
.lc-theme-mid .lc-sub.active{border-color:#B98A2F;background:#FBF6EA}
.lc-theme-taxp .lc-sub-ico{color:#1F6B4C;background:#E2F0E8}
.lc-theme-taxp .lc-sub.lc-depth-deep .lc-sub-ico{color:#fff;background:#1F6B4C}
.lc-theme-taxp .lc-sub.lc-depth-mid .lc-sub-ico{color:#fff;background:#2F8F6B}
.lc-theme-taxp .lc-sub.lc-depth-light .lc-sub-ico{color:#1F6B4C;background:#E2F0E8}
.lc-theme-taxp .lc-sub.active{border-color:#2F8F6B;background:#EDF6F1}
/* ============================ 101. 锤子系统落地（拟物质感 / 红点克制 / 按压反馈 / 九宫格） ============================ */
/* 设计令牌：锤子红 + 过渡时长 */

/* 红点克制：侧边栏错题角标 → 锤子红底白字 */
.sb-badge{background:var(--color-dot,#E4573D);color:#fff}
/* 答题卡：标记题右上角 4px 锤子红点（不扩格子） */
.cell.flag::after{width:4px;height:4px;top:3px;right:3px;background:var(--color-dot,#E4573D)}
/* 做题页题干行高 1.75（长题干降阅读压力） */
.stem{line-height:1.75}
/* 按压反馈：按下下沉、阴影消失（核心拟物体验） */
.btn,.opt,.cell,.lc-mod,.lc-sub{transition:transform var(--t-fast) ease,box-shadow var(--t-fast) ease,border-color var(--t-mid) ease,background var(--t-mid) ease}
.btn:active,.opt:active,.cell:active{transform:translateY(1px);box-shadow:none !important}
/* 模块卡：顶部 4px 品牌色细条 + 浅底小图标 + 右上角红点（白底选中靠描边，不用大面积变色） */
.lc-mod{position:relative;overflow:hidden;padding-top:20px}
.lc-mod-strip{position:absolute;left:0;right:0;top:0;height:4px}
.lc-mod-cpa .lc-mod-strip{background:linear-gradient(90deg,#C03B2B,#9E2F20)}
.lc-mod-mid .lc-mod-strip{background:linear-gradient(90deg,#B98A2F,#8A6D15)}
.lc-mod-taxp .lc-mod-strip{background:linear-gradient(90deg,#2F8F6B,#1F6B4C)}
.lc-mod-ico{width:34px;height:34px;border-radius:10px;font-size:12px;font-weight:700;box-shadow:none}
.lc-mod-cpa .lc-mod-ico{background:#F7E6E2;color:#9E2F20}
.lc-mod-mid .lc-mod-ico{background:#F6EBD6;color:#8A6D15}
.lc-mod-taxp .lc-mod-ico{background:#E2F0E8;color:#1F6B4C}
.lc-mod.active{border-color:var(--color-primary-accent,#C03B2B);background:#fff;box-shadow:0 2px 8px rgba(43,40,38,.08)}
.lc-mod.active::after{display:none}
.lc-mod-dot{position:absolute;top:12px;right:12px;width:8px;height:8px;border-radius:50%;background:var(--color-dot,#E4573D)}

/* ============================ 102. 学习中心 · 豆包版 v2 复刻（逐条同 v2 CSS） ============================ */
.lc-page{max-width:none;margin:0;padding:20px 24px 70px}   /* v2 .main 布局：全宽 */
.hero{position:relative;color:#fff;border-radius:var(--radius-card);padding:22px 28px 20px;margin-bottom:24px;
  background:linear-gradient(135deg,#3A3833 0%,#2B2B28 55%,#23211E 100%);box-shadow:var(--shadow-floating);overflow:hidden}
.hero::after{content:"";position:absolute;right:-40px;top:-40px;width:220px;height:220px;border-radius:50%;
  background:radial-gradient(circle,rgba(192,59,43,.30),transparent 70%);pointer-events:none}
.hero h2{font-size:21px;font-weight:700;letter-spacing:.5px;display:flex;align-items:center;gap:10px;position:relative;z-index:1}
.motto-txt{font-size:21px;font-weight:700}
.motto-edit{width:32px;height:32px;border-radius:9px;border:1px solid rgba(255,255,255,.32);color:#fff;background:rgba(255,255,255,.08);
  display:grid;place-items:center;flex:none;font-size:14px;cursor:pointer;font-family:inherit}
.motto-edit:hover{background:rgba(255,255,255,.18)}
.hero .cd{display:flex;align-items:center;gap:10px;margin-top:14px;font-size:13px;color:rgba(255,255,255,.85);position:relative;z-index:1;flex-wrap:wrap}
.hero .cd b{font-family:var(--num);font-size:19px;color:#F4C7B9;font-variant-numeric:tabular-nums}
.hero .cd .date{font-family:var(--num);font-size:12px;padding:2px 10px;border-radius:var(--radius-pill);
  background:rgba(255,255,255,.14);cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.hero .cd .date:hover{background:rgba(255,255,255,.22)}
.hero .cd .date-btn{width:22px;height:22px;line-height:1;border:1px solid var(--color-border);border-radius:8px;
  background:var(--color-surface);color:var(--color-text-secondary);font-size:11px;cursor:pointer;font-family:inherit;padding:0}
.hero .cd .date-btn:hover{color:var(--color-primary);border-color:var(--color-primary)}
.page-h{display:flex;align-items:flex-end;gap:10px;margin:8px 0 20px}
.page-h h1{font-size:23px;font-weight:700;letter-spacing:.3px;color:var(--color-text-primary)}
.page-h .sub{font-size:13px;color:var(--color-text-tertiary);padding-bottom:5px}
.mod-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:16px}
.mod-card{position:relative;background:var(--color-surface);border:1.5px solid var(--color-border);border-radius:var(--radius-card);
  box-shadow:var(--shadow-raised);padding:26px 18px;min-height:112px;display:flex;flex-direction:column;justify-content:center;
  cursor:pointer;overflow:hidden;transition:transform .15s ease,box-shadow .15s ease,border-color .15s ease}
.mod-card:hover{transform:translateY(-2px);box-shadow:var(--shadow-floating)}
.mod-card .topline{position:absolute;top:0;left:0;right:0;height:4px}
.mod-card h3{font-size:16px;font-weight:700;display:flex;align-items:center;gap:10px;margin-top:4px}
.mod-card .ic{width:36px;height:36px;border-radius:11px;display:grid;place-items:center;color:#fff;font-size:15px;font-weight:800;flex:none}
.mod-card .meta{margin-top:14px;display:flex;flex-wrap:wrap;gap:6px}
.mod-card .chip{font-size:11px;padding:3px 10px;border-radius:var(--radius-pill);background:var(--color-surface-2);
  border:1px solid var(--color-border);color:var(--color-text-secondary)}
.mod-card .chip b{color:var(--color-primary-strong);font-family:var(--num)}
.mod-card .chip.date-chip{cursor:pointer;transition:border-color .15s,color .15s}
.mod-card .chip.date-chip:hover{border-color:var(--color-primary);color:var(--color-primary-strong)}
.mod-card.active{border-color:var(--color-primary);box-shadow:0 8px 26px rgba(192,59,43,.16);transform:translateY(-2px)}
.mod-card.active .topline{height:6px;background:var(--color-primary)!important}
.mod-card.active::after{content:'已选';position:absolute;top:12px;right:12px;font-size:10px;font-weight:700;color:#fff;
  background:var(--color-primary);border-radius:var(--radius-pill);padding:2px 9px}
.mod-card:not(.active){opacity:.82}
.mod-card:not(.active):hover{opacity:1;transform:scale(1)}
.sub-title{display:flex;align-items:center;gap:10px;margin:26px 0 14px;font-size:15px;font-weight:700}
.sub-title .bar{width:4px;height:16px;border-radius:3px;background:var(--color-primary);flex:none}
.sub-cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.sub-card{display:flex;align-items:center;gap:14px;padding:18px 18px;background:var(--color-surface);
  border:1.5px solid var(--color-border);border-radius:var(--radius-card);box-shadow:var(--shadow-raised);
  cursor:pointer;transition:transform .15s,box-shadow .15s}
.sub-card:hover{transform:translateY(-1px);box-shadow:var(--shadow-floating)}
.sub-card .ic2{width:44px;height:44px;border-radius:13px;display:grid;place-items:center;color:#fff;font-weight:800;font-size:15px;flex:none}
.sub-card .hd{flex:1;min-width:0}
.sub-card .hd h3{font-size:15px;font-weight:700}
.sub-card .arr{color:var(--color-text-tertiary);font-size:18px}
.note{font-size:12px;color:var(--color-text-tertiary);text-align:center;margin-top:26px;line-height:1.9}

/* ============================ 103. 侧边栏 · 豆包版 v2 化（覆盖全局各主题块） ============================ */
.sidebar{width:224px}
.main{margin-left:224px}
.sb-brand{display:flex;align-items:center;gap:9px;padding:14px 12px 12px}
.sb-brand .logo{width:48px;height:48px;border-radius:14px;background:var(--color-primary);color:#fff;display:grid;place-items:center;font-size:14px;font-weight:800;letter-spacing:.2px;flex:none}
.sb-brand b{font-size:15px;letter-spacing:.3px;line-height:1.2}
.sb-brand small{display:block;font-size:10px;color:var(--color-text-tertiary);font-weight:400;line-height:1.2}
.sb-toggle{order:2;margin-left:auto;margin-right:0}
.sb-group{display:none!important}
.sb-item{height:42px;border-radius:var(--radius-btn)}
.sb-item.is-active{background:var(--color-text-primary);color:#fff;font-weight:600}
.sb-item.is-active::before{display:none}
.sb-item.is-active:hover{background:var(--color-text-primary);color:#fff}
.sb-item svg{width:18px;height:18px;stroke-width:1.7}

/* ============================ 104. 锤子系统设计语言 · 全局统一精修 ============================ */
/* ---- 文字：统一墨黑（清理青灰时代 slate 蓝灰正文） ---- */
.stem{color:var(--color-text-primary);font-size:15px;line-height:1.75;letter-spacing:.12px}
.stem-note{background:var(--color-surface-2);border-color:var(--color-border);color:var(--color-text-secondary)}
.note-body{color:var(--color-text-primary)}
.exp{color:var(--color-text-primary)}
.verdict .sp b{color:var(--color-text-primary)}
/* ---- 按钮：主操作 / 下一步 深红底白字，hover 加深（替代青绿 hover） ---- */
.btn-teal{background:var(--color-secondary-strong);color:#fff}
.btn-teal:hover{background:var(--color-secondary-deep)}
.btn-primary{background:var(--color-secondary-strong);color:#fff}
.btn-primary:hover{background:var(--color-secondary-deep)}
.btn:active{transform:translateY(1px);box-shadow:none!important}
/* ---- 题号：锤子红字（v2 风格）代替黑底块 ---- */
.q-no{background:transparent;color:var(--color-primary-deep);font-family:var(--num);font-size:15px;font-weight:800;min-width:auto;height:auto;padding:0;border-radius:0}
.q-head{gap:12px}
/* ---- 选项：≥44 高 · 28px 序号圈 · 选中白字 · hover 统一 ---- */
.opt{min-height:44px;align-items:center;padding:12px 16px;border-radius:14px}
.opt .k{width:28px;height:28px;margin-top:0}
.opt:hover{border-color:var(--color-border);background:var(--color-surface-2)}
.opt.is-pick .k{background:var(--color-primary);border-color:var(--color-primary);color:#fff}
/* ---- 答题卡：九宫格 40px 大格子（左栏 210→252，保持 5 列：左|分隔|中|分隔|右） ---- */
.cols{grid-template-columns:var(--left-w,252px) 36px minmax(0,1fr) 12px var(--right-w,380px);gap:0}
.cols.right-collapsed{grid-template-columns:var(--left-w,252px) 24px minmax(0,1fr) 0 0}
.sheet{grid-template-columns:repeat(5,1fr);gap:5px}.cell{border-radius:11px;font-size:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;line-height:1}
.cell-no{font-size:13px;font-weight:600;font-family:var(--num)}
.cell-sym{font-size:11px;font-weight:700;line-height:1}
.cell-sym.ok-sym{color:#15803D}
.cell-sym.no-sym{color:#B91C1C}
.cell-sym.pending-sym{color:#6E6C66}
/* ---- 解析：左红边拟物框（v2 explain box） ---- */
#ans-card .exp{margin:14px 16px 0;padding:12px 14px;background:var(--color-surface-2);
  border-left:3px solid var(--color-primary);border-radius:0 10px 10px 0;color:var(--color-text-secondary)}
#ans-card .exp b{color:var(--color-text-primary)}

/* ============================ 105. 学习中心微调（用户 4 点 + 修订：恢复名称 / pill 椭圆边框 / 虚线置顶） ============================ */
/* 1. 语录黑背景：高度增加、内容垂直居中 */
.hero{min-height:104px;display:flex;align-items:center;padding:30px 32px 26px;margin-bottom:22px}
.hero h2{font-size:23px}
/* 2. 学习方向卡片：恢复名称 + 信息 pill 椭圆边框，虚线在 pill 上方（整体缩小） */
.mod-card{min-height:118px;display:flex;flex-direction:column;padding:15px 16px 13px}
.mod-card h3{margin-top:6px}
.mod-card h3 .cnt{font-size:11px;font-weight:600;color:var(--color-text-tertiary)}
.mod-card .meta{margin-top:10px;display:flex;flex-wrap:wrap;gap:6px;border-top:1px dashed #C7C1B2;padding-top:10px}
.mod-card .chip{width:auto;background:#fff;height:24px;padding:0 11px;border-radius:999px;border:1px solid #D8D2C7;
  font-size:11px;color:var(--color-text-secondary);display:inline-flex;align-items:center;gap:4px}
.mod-card .chip b{font-size:13px;color:var(--color-primary-strong)}
.mod-card .chip.date-chip:hover{border-color:var(--color-primary);color:var(--color-primary-strong)}
.mod-card.active .meta{border-top-color:#D9B4A8}
.mod-card h3{font-size:15px}
.mod-card .ic{width:30px;height:30px;border-radius:9px;font-size:13px}
/* 3. 科目卡片边框更浅 + 整体缩小 */
.sub-card{border-color:#EDE9E0;padding:13px 14px;gap:11px}
.sub-card .ic2{width:36px;height:36px;border-radius:11px;font-size:13px}
.sub-card .hd h3{font-size:14px}
/* 删除「学习中心」标题后：保持 hero 与模块卡之间的间隔 */
.mod-grid{margin-top:26px}
.sub-title{margin-top:18px}

/* ============================ 106. 小小红书 + 待建设标签 ============================ */
/* —— 待建设标签（无题库科目卡） —— */
.tag-wip{display:inline-block;margin-top:5px;font-size:11px;color:var(--color-text-tertiary);
  border:1px solid var(--color-border);border-radius:999px;padding:2px 9px;
  background:var(--color-surface-muted);line-height:1.5}
/* —— 小小红书（语录笔记本） —— */
.rb-page{max-width:none;margin:0;padding:20px 24px 70px}
.rb-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:20px}
.rb-head h1{font-size:23px;font-weight:700;letter-spacing:.3px;color:var(--color-text-primary);display:flex;align-items:baseline;gap:10px}
.rb-head h1 small{font-size:13px;font-weight:500;color:var(--color-text-tertiary)}
.rb-stats{display:flex;gap:10px;flex-wrap:wrap}
.rb-stats span{font-size:12px;color:var(--color-text-secondary);background:#fff;border:1px solid var(--color-border);
  border-radius:999px;padding:5px 12px;display:inline-flex;align-items:center;gap:4px}
.rb-stats b{font-family:var(--num);color:var(--color-primary-strong);font-size:14px}
.rb-cover{position:relative;overflow:hidden;border-radius:18px;margin-bottom:24px;padding:34px 36px;
  background:linear-gradient(135deg,#3A3833 0%,#2B2B28 55%,#23211E 100%);color:#fff;box-shadow:var(--shadow-floating)}
.rb-cover::after{content:"";position:absolute;right:-40px;top:-40px;width:220px;height:220px;border-radius:50%;
  background:radial-gradient(circle,rgba(192,59,43,.30),transparent 70%);pointer-events:none}
.rb-cover-tag{display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 12px;border-radius:999px;
  background:rgba(255,255,255,.14);font-size:12px;font-weight:600;letter-spacing:.06em;position:relative;z-index:1}
.rb-cover-tag::before{content:"";width:6px;height:6px;border-radius:50%;background:#E8A49B}
.rb-cover-txt{margin:16px 0 0;position:relative;z-index:1;font-family:'LXGW WenKai','KaiTi','楷体',serif;
  font-size:26px;font-weight:700;line-height:1.5;letter-spacing:1px}
.rb-sub-title{display:flex;align-items:center;gap:10px;margin:0 0 14px;font-size:15px;font-weight:700}
.rb-sub-title .bar{width:4px;height:16px;border-radius:3px;background:var(--color-primary);flex:none}
.rb-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px}
.rb-card{position:relative;background:#fff;border:1px solid var(--color-border);border-radius:16px;
  padding:18px 18px 14px;display:flex;flex-direction:column;transition:.15s}
.rb-card:hover{transform:translateY(-2px);box-shadow:var(--shadow-floating)}
.rb-card.used{border-color:var(--color-primary);background:linear-gradient(180deg,#FDF6F3,#FFF)}
.rb-card-no{font-family:var(--num);font-size:11px;color:var(--color-text-tertiary);margin-bottom:10px}
.rb-card-txt{margin:0;font-size:15px;line-height:1.7;color:var(--color-text-primary);
  font-family:'LXGW WenKai','KaiTi','楷体',serif;flex:1}
.rb-card-foot{display:flex;align-items:center;gap:8px;margin-top:14px;padding-top:12px;border-top:1px dashed var(--color-border)}
.rb-card-date{font-family:var(--num);font-size:11px;color:var(--color-text-secondary);flex:1}
.rb-card-cur{font-size:11px;color:var(--color-primary-strong);font-weight:700}
.rb-use{height:26px;padding:0 12px;border:none;border-radius:999px;background:var(--color-secondary-strong);
  color:#fff;font-size:11px;cursor:pointer;font-family:inherit}
.rb-use:hover{background:var(--color-secondary-deep)}
.rb-del{width:26px;height:26px;border-radius:8px;border:1px solid var(--color-border);background:#fff;
  color:var(--color-text-tertiary);font-size:12px;cursor:pointer;line-height:1;font-family:inherit}
.rb-del:hover{color:var(--color-danger);border-color:var(--color-danger)}
.rb-empty{grid-column:1/-1;padding:46px 20px;text-align:center;font-size:13px;color:var(--color-text-secondary);
  background:var(--color-surface-muted);border:1px dashed var(--color-border);border-radius:16px}

/* ============================ 107. 品牌方块移除 + 科目卡无边框 ============================ */
/* 移除「题刷刷」红块后：品牌区只保留右上角折叠按钮 */
.sb-brand{justify-content:flex-end;padding:12px 14px 10px}
.sb-brand .logo{display:none}
/* 科目卡：取消硬边框，改用极淡阴影勾勒卡片，hover 时阴影加深 */
.sub-card{border:1px solid transparent;box-shadow:0 1px 3px rgba(43,40,38,.08)}
.sub-card:hover{box-shadow:var(--shadow-floating);border-color:transparent}

/* ============================ 108. 练习历史页 · 精致卡片化（对齐参考设计） ============================ */
.history-layout{max-width:1080px}
.history-summary{display:flex;gap:14px;margin:20px 0 18px}
.history-sum-item{flex:1;min-width:160px;background:var(--color-surface);border:1px solid rgba(228,226,219,.9);border-radius:var(--radius-card);padding:18px 22px;display:flex;align-items:center;justify-content:space-between;box-shadow:0 2px 8px rgba(43,40,38,.04)}
.history-sum-item span{font-size:13px;color:var(--color-text-secondary);font-weight:500}
.history-sum-item .n{font-size:30px;font-weight:800;color:var(--color-text-primary);font-family:var(--num);line-height:1}
.history-sum-item.is-active{background:linear-gradient(135deg,var(--color-primary),#A62F20);border-color:transparent;box-shadow:0 6px 18px rgba(192,59,43,.18)}
.history-sum-item.is-active span,.history-sum-item.is-active .n{color:#fff}
.history-main{display:flex;flex-wrap:wrap;align-items:center;gap:14px 18px;margin-bottom:18px}
.history-tabs{display:inline-flex;gap:4px;background:var(--color-surface-muted);padding:4px;border-radius:var(--radius-pill)}
.history-tab{border:none;background:transparent;padding:7px 16px;font-size:13px;font-weight:500;color:var(--color-text-secondary);border-radius:var(--radius-pill);cursor:pointer;transition:all .18s}
.history-tab:hover{color:var(--color-text-primary)}
.history-tab.is-active{background:var(--color-text-primary);color:#fff;font-weight:600;box-shadow:0 2px 6px rgba(43,40,38,.16)}
.history-datefilter{display:inline-flex;align-items:center;gap:6px;margin-left:auto;font-size:13px;color:var(--color-text-secondary)}
.history-datefilter button{border:1px solid var(--color-border);background:var(--color-surface);padding:6px 14px;border-radius:var(--radius-pill);font-size:13px;color:var(--color-text-secondary);cursor:pointer;transition:all .15s}
.history-datefilter button.is-active{background:var(--color-primary);border-color:var(--color-primary);color:#fff;font-weight:600}
.history-list{display:flex;flex-direction:column;gap:14px}
.hist-row-card{display:flex;align-items:center;gap:16px;background:var(--color-surface);border:1px solid rgba(228,226,219,.9);border-radius:var(--radius-card);padding:18px 20px;box-shadow:0 1px 3px rgba(43,40,38,.05);cursor:pointer;transition:transform .18s,box-shadow .18s,border-color .18s}
.hist-row-card:hover{transform:translateY(-2px);box-shadow:var(--shadow-floating);border-color:rgba(192,59,43,.25)}
.hist-icon{flex:0 0 48px;width:48px;height:48px;border-radius:14px;background:var(--color-primary-soft,#F7E6E2);color:var(--color-primary);display:grid;place-items:center}
.hist-icon svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.hist-info{flex:1;min-width:0;display:flex;flex-direction:column;gap:8px}
.hist-title{font-size:15px;font-weight:600;color:var(--color-text-primary);display:flex;align-items:center;gap:10px;min-width:0}
.hist-title .mode-chip{flex:0 0 auto;font-size:11px;font-weight:600;color:var(--color-primary);background:var(--color-primary-soft,#F7E6E2);padding:3px 10px;border-radius:var(--radius-pill)}
.hist-title .title-text{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hist-meta{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:12.5px;color:var(--color-text-secondary)}
.hist-meta b{color:var(--color-text-primary);font-weight:600}
.hist-meta span{display:inline-flex;align-items:center;gap:4px}
.hist-right{flex:0 0 auto;display:flex;flex-direction:column;align-items:center;gap:10px}
.accuracy-ring{position:relative;width:64px;height:64px;display:grid;place-items:center}
.accuracy-ring .pct{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:15px;font-weight:800;color:var(--color-text-primary);font-family:var(--num);line-height:1.1}
.accuracy-ring .pct small{font-size:9px;color:var(--color-text-tertiary);font-weight:500}
.history-empty{grid-column:1/-1;background:var(--color-surface);border:1px dashed var(--color-border);border-radius:var(--radius-card);padding:46px 20px;text-align:center}
.history-empty p{font-size:13px;color:var(--color-text-secondary);line-height:2}

/* ============================ 109. 试题卡紧凑化（字体更小、更紧凑） ============================ */
.q-card{padding:16px 18px 14px}
.q-head{padding-bottom:9px;gap:8px}
.q-no{min-width:26px;height:26px;padding:0 7px;font-size:13px}
.opts{margin-top:12px;gap:8px}
.opt{padding:8px 12px;gap:10px}
.opt .k{flex:0 0 22px;width:22px;height:22px;font-size:12px}
.opt .txt{font-size:14px;line-height:1.6}
.stem{font-size:15px;line-height:1.75;margin-top:12px;letter-spacing:.06px}
.verdict{margin-top:14px;padding:10px 14px;gap:10px}
.verdict .ic{width:26px;height:26px;flex:0 0 26px}
.verdict .sp b{font-size:13.5px}
.exp{font-size:12.5px;line-height:1.7;padding:10px 2px 0}
.exp .calc{font-size:12px}

/* ============================ 110. 左分隔条移除 + 折叠按钮低调化 ============================ */
/* 布局：左栏 | 中栏 | 右分隔条 | 右栏（左分隔条已删除，左栏固定宽度） */
.cols:has(> .v-splitter[data-side="right"]){grid-template-columns:var(--left-w,252px) minmax(0,1fr) 12px var(--right-w,380px);gap:0}
.cols:has(> .v-splitter[data-side="right"]).left-collapsed{grid-template-columns:0 minmax(0,1fr) 12px var(--right-w,380px)}
.cols:has(> .v-splitter[data-side="right"]).right-collapsed{grid-template-columns:var(--left-w,252px) minmax(0,1fr) 12px 0}
.cols.left-collapsed .col-left,
.cols.right-collapsed .col-right{opacity:0;pointer-events:none;overflow:hidden;min-width:0}
/* 左栏顶部工具条：低调小按钮 */
.col-bar{display:flex;align-items:center;justify-content:space-between;padding:2px 2px 10px;font-size:12px;color:var(--color-text-tertiary)}
.col-toggle-mini.col-toggle{position:fixed;left:0;top:50%;transform:translateY(-50%);z-index:100;width:28px;height:44px;border-radius:0 8px 8px 0;border:1px solid #ECE6DE;border-left:none;background:transparent;display:grid;place-items:center;color:#8A847D;cursor:pointer;margin:0;flex:none;transition:background .15s,color .15s;opacity:1 !important;pointer-events:auto !important}
.col-toggle-mini.col-toggle:hover{background:var(--color-surface-muted);color:var(--color-primary-strong)}
.col-toggle-mini svg{width:16px;height:16px;stroke:currentColor;stroke-width:2;fill:none;stroke-linecap:round;stroke-linejoin:round}
/* 右分隔条折叠按钮：低调（透明底、细边、hover 才明显） */
.col-toggle{position:fixed;right:0;top:50%;transform:translateY(-50%);width:28px;height:44px;border-radius:8px 0 0 8px;border:1px solid #ECE6DE;border-right:none;background:transparent;display:grid;place-items:center;color:#8A847D;cursor:pointer;margin:0;flex:none;z-index:100;transition:background .15s,color .15s;opacity:1 !important;pointer-events:auto !important}
.col-toggle:hover{background:var(--color-surface-muted);color:var(--color-primary-strong)}
.col-toggle svg{width:16px;height:16px;stroke:currentColor;stroke-width:2;fill:none;stroke-linecap:round;stroke-linejoin:round}
/* 左栏收起后的悬浮展开按钮（左侧竖向小条） */
.left-toggle-float{display:none !important}
.left-toggle-float:hover{background:var(--color-surface-muted);color:var(--color-text-primary)}
body.left-collapsed .left-toggle-float{display:none !important}

/* ============================ 111. 学习笔记 + 卡片抽查 ============================ */
/* 笔记列表 */
.note-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px;margin-top:4px}
.note-card{position:relative;display:flex;flex-direction:column;background:var(--color-surface);border:1px solid var(--color-border);border-radius:var(--radius-card);padding:18px 18px 12px;box-shadow:var(--shadow-card);transition:transform .15s,box-shadow .15s,border-color .15s}
.note-card:hover{transform:translateY(-2px);box-shadow:var(--shadow-raised);border-color:var(--color-primary-light)}
.note-card.is-mastered{box-shadow:none}
.note-card .nc-top{display:flex;align-items:flex-start;gap:10px}
.note-card .nc-badge{flex:none;font-size:11px;line-height:1;padding:5px 8px;border-radius:999px;background:var(--color-surface-muted);color:var(--color-text-tertiary)}
.note-card .nc-badge.review{background:rgba(192,59,43,.10);color:var(--color-danger-text)}
.note-card .nc-badge.done{background:rgba(37,128,96,.10);color:var(--color-success-text)}
.note-card h4{margin:2px 0 8px;font-size:15px;font-weight:700;line-height:1.45;color:var(--color-text-primary)}
.note-card .nc-body{flex:1;font-size:12.5px;line-height:1.7;color:var(--color-text-secondary);white-space:pre-line;overflow:hidden;display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical}
.note-card .nc-foot{display:flex;align-items:center;justify-content:space-between;margin-top:12px;padding-top:10px;border-top:1px dashed var(--color-border)}
.note-card .nc-time{font-size:11px;color:var(--color-text-tertiary)}
.note-card .nc-ops{display:flex;gap:2px}
.note-card .nc-ops button{width:30px;height:30px;border:none;background:transparent;border-radius:8px;display:grid;place-items:center;color:var(--color-text-tertiary);cursor:pointer;transition:background .15s,color .15s}
.note-card .nc-ops button:hover{background:var(--color-surface-muted);color:var(--color-text-primary)}
.note-card .nc-ops button.nc-del:hover{color:var(--color-danger-text);background:rgba(192,59,43,.08)}
/* 笔记卡片标签 */
.note-card .nc-tags{display:flex;flex-wrap:wrap;gap:6px;margin:2px 0 8px}
.note-card .nc-tags .nc-tag{font-size:11px;line-height:1;padding:4px 9px;border-radius:999px;background:rgba(24,95,165,.10);color:#185FA5;border:1px solid rgba(24,95,165,.18)}
.note-card .nc-tags .nc-tag::before{content:"#";opacity:.6;margin-right:2px}
/* 笔记标签搜索框 */
.note-tag-search{flex:1;min-width:120px;max-width:220px;height:34px;padding:0 12px;font-size:13px;color:var(--color-text-primary);background:var(--color-surface-muted);border:1px solid transparent;border-radius:9px;outline:none;transition:border-color .15s,background .15s}
.note-tag-search:focus{background:var(--color-surface);border-color:var(--color-primary-light)}
.note-tag-search::-webkit-search-cancel-button{-webkit-appearance:none}
.note-card .nc-ops svg{width:15px;height:15px;stroke:currentColor;stroke-width:2;fill:none;stroke-linecap:round;stroke-linejoin:round}
.note-empty{grid-column:1/-1;text-align:center;padding:70px 20px;color:var(--color-text-tertiary)}
.note-empty .ne-ico{width:64px;height:64px;margin:0 auto 14px;border-radius:20px;background:var(--color-surface-muted);display:grid;place-items:center}
.note-empty .ne-ico svg{width:30px;height:30px;stroke:var(--color-text-tertiary);stroke-width:1.6;fill:none;stroke-linecap:round;stroke-linejoin:round}
.note-empty p{font-size:13px;line-height:1.7;margin-bottom:18px}
/* 编辑弹层字段 */
.fld{margin:14px 24px 4px}
.fld label{display:block;font-size:11.5px;font-weight:600;color:var(--color-text-secondary);margin-bottom:7px}
.fld input,.fld textarea{width:100%;box-sizing:border-box;font:inherit;font-size:13.5px;line-height:1.7;color:var(--color-text-primary);background:var(--color-surface-muted);border:1px solid transparent;border-radius:10px;padding:11px 13px;outline:none;transition:border-color .15s,background .15s}
.fld input:focus,.fld textarea:focus{background:var(--color-surface);border-color:var(--color-primary-light)}
.fld textarea{resize:vertical;min-height:130px;white-space:pre-wrap;word-break:break-word}
/* 抽查覆盖层 */
.quiz-mask{position:fixed;inset:0;z-index:1100;background:rgba(43,40,38,.55);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);display:flex;align-items:center;justify-content:center;padding:30px}
.quiz-shell{width:100%;max-width:660px;display:flex;flex-direction:column;gap:18px}
.quiz-head{display:flex;align-items:center;gap:12px;color:var(--color-text-primary)}
.quiz-head .quiz-title{display:flex;align-items:center;gap:8px;font-size:16px;font-weight:700}
.quiz-head .sp{flex:1;font-size:12.5px;color:var(--color-text-tertiary)}
.quiz-head button{width:34px;height:34px;border:none;background:rgba(255,255,255,.14);border-radius:10px;display:grid;place-items:center;color:#fff;cursor:pointer;transition:background .15s}
.quiz-head button:hover{background:rgba(255,255,255,.24)}
.quiz-head button svg{width:16px;height:16px;stroke:currentColor;stroke-width:2;fill:none;stroke-linecap:round;stroke-linejoin:round}
.quiz-card{perspective:1400px;cursor:pointer;-webkit-user-select:none;user-select:none}
.quiz-inner{position:relative;width:100%;height:340px;transform-style:preserve-3d;transition:transform .45s cubic-bezier(.2,.7,.3,1)}
.quiz-card.flipped .quiz-inner{transform:rotateY(180deg)}
.quiz-face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:20px;display:flex;flex-direction:column;padding:34px 36px;box-sizing:border-box}
.quiz-front{background:linear-gradient(160deg,var(--color-primary) 0%,var(--color-primary-strong) 60%,var(--color-primary-deep) 100%);color:#fff;box-shadow:0 18px 40px rgba(43,40,38,.28)}
.quiz-back{background:var(--color-surface);border:1px solid var(--color-border);transform:rotateY(180deg);box-shadow:0 18px 40px rgba(43,40,38,.18)}
.qf-tag,.qb-tag{font-size:12px;font-weight:600;letter-spacing:.5px;opacity:.75}
.qf-title{flex:1;display:flex;align-items:center;justify-content:center;text-align:center;font-size:20px;font-weight:700;line-height:1.6;padding:20px 6px}
.qf-hint,.qb-hint{text-align:center;font-size:11.5px;opacity:.6}
.qb-tag{color:var(--color-primary-strong)}
.qb-body{flex:1;overflow:auto;margin:14px 0;font-size:14px;line-height:1.85;color:var(--color-text-primary);white-space:pre-wrap;word-break:break-word}
.qb-body .q-tbl{font-size:12.5px;max-width:100%}
.qb-hint{color:var(--color-text-tertiary)}
.quiz-ctrl{display:flex;align-items:center;gap:10px}
.quiz-ctrl .btn{min-width:92px}
.quiz-ctrl .sp{flex:1;text-align:center;font-family:var(--num);font-size:13px;color:var(--color-text-primary);background:rgba(255,255,255,.16);border-radius:999px;padding:6px 14px}
/* 电脑模式：row 包裹层透明化，保持原单行 5 按钮（手机 media 内覆盖为两行） */
.quiz-ctrl .qc-row1,.quiz-ctrl .qc-row2{display:contents}
/* ============ 移动端适配（≤767px 手机） ============ */
/* 移动端导航组件默认隐藏（仅 ≤767px 显示，避免 PC 端占位破坏布局） */
.m-nav-btn,.m-drawer,.m-drawer-mask{display:none}

@media (max-width:767px){
  /* P1-5：移动端不使用自定义书法字体（5.25MB），改用系统楷体，减少首屏带宽 */
  #motto-txt, .rb-cover-txt{font-family:'LXGW WenKai','KaiTi','STKaiti',serif !important}
  /* 基础容器收窄 */
  .page{padding:16px 14px 48px}
  .hero{padding:18px 16px;margin-bottom:16px}
  /* 强制主内容贴左（覆盖历史残留的 .main{margin-left:224px} 无媒体查询规则） */
  .main{margin-left:0 !important}

  /* —— 移动端导航（汉堡 + 抽屉） —— */
  .m-nav-btn{display:flex;position:fixed;top:9px;left:10px;z-index:300;width:38px;height:38px;align-items:center;justify-content:center;border:none;border-radius:10px;background:var(--color-surface);box-shadow:0 2px 10px rgba(43,40,38,.12);cursor:pointer}
  .m-nav-btn svg{width:20px;height:20px;stroke:var(--color-text-primary);stroke-width:2;fill:none;stroke-linecap:round;stroke-linejoin:round}
  .m-drawer-mask{display:block;position:fixed;inset:0;background:rgba(20,24,30,.45);z-index:280;opacity:0;pointer-events:none;transition:opacity .2s ease}
  .m-drawer-mask.show{opacity:1;pointer-events:auto}
  .m-drawer{position:fixed;top:0;left:0;bottom:0;width:280px;max-width:84vw;background:var(--color-surface);z-index:290;transform:translateX(-105%);transition:transform .25s ease;display:flex;flex-direction:column;box-shadow:2px 0 20px rgba(43,40,38,.18)}
  .m-drawer.open{transform:translateX(0)}
  .m-drawer .sb-brand{padding:18px 20px;border-bottom:1px solid var(--color-border);font-weight:700;color:var(--color-text-primary);flex:0 0 auto}
  .m-drawer .sb-nav{flex:1;overflow-y:auto;padding:10px 12px 24px}
  .m-drawer .sb-item{height:44px;padding:0 14px;border-radius:10px;display:flex;align-items:center;gap:10px;color:var(--color-text-secondary);font-size:14px;text-decoration:none}
  .m-drawer .sb-item svg{width:18px;height:18px;stroke:currentColor;stroke-width:1.6;fill:none;stroke-linecap:round;stroke-linejoin:round;flex:0 0 18px}
  .m-drawer .sb-item .sb-txt{flex:1}
  .m-drawer .sb-item.is-active{background:rgba(192,59,43,.12);color:var(--color-primary-strong);font-weight:600}
  .m-drawer .sb-group{padding:14px 14px 6px;font-size:11px;color:var(--color-text-secondary);font-weight:600}

  /* 顶部栏为汉堡按钮避让 */
  .tb-inner{padding:0 14px 0 56px}
  /* P1-6：窄屏表格缩小字号，配合横向滚动 */
  .q-tbl-wrap table.q-tbl{font-size:11px}
  .q-tbl-wrap table.q-tbl th,.q-tbl-wrap table.q-tbl td{padding:3px 6px}
  /* 顶部标题/面包屑窄屏省略号截断（避免长标题竖排挤压） */
  .tb-title{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .tb-title b,.tb-title span{white-space:nowrap}
  .crumb{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .back{white-space:nowrap;flex:0 0 auto;min-width:0}
  .back span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:64px;display:inline-block;vertical-align:middle}

  /* —— 试题卡：三栏 → 单栏（题目优先，覆盖 renderer 的 :has 高特异规则与折叠态） —— */
  .cols,
  .cols:has(> .v-splitter[data-side="right"]),
  .cols.right-collapsed,
  .cols.left-collapsed,
  .cols:has(> .v-splitter[data-side="right"]).right-collapsed,
  .cols:has(> .v-splitter[data-side="right"]).left-collapsed{
    grid-template-columns:1fr !important;padding:12px 14px 48px !important;gap:14px !important}
  .v-splitter{display:none !important}
  .col-left,.col-right{position:relative !important;top:auto !important;max-height:none !important;overflow:visible !important;align-self:stretch !important;width:auto !important;opacity:1 !important}
  .col-mid{order:1 !important}
  .col-left{order:2 !important}
  .col-right{order:3 !important}
  .left-toggle-float{display:none !important}
  .q-card{padding:16px 16px 14px}
  .stem{font-size:15px;line-height:1.7}
  .ans-line{font-size:13.5px}

  /* —— 章节训练 —— */
  .ch-head{padding:14px 16px;gap:12px}
  .filters{margin:14px 0 16px;gap:8px}
  .toolbar{margin:14px 0 12px;flex-wrap:wrap;gap:10px}
  .seg{max-width:100%;overflow-x:auto}

  /* —— 学习中心 —— */
  .mod-grid{gap:12px}
  .lc-sub-grid{gap:10px}
  .sub-cards{gap:12px}

  /* —— 练习历史 / 错题 / 收藏 / 笔记 —— */
  .history-summary{grid-template-columns:repeat(2,1fr);gap:10px}
  .history-tabs{overflow-x:auto;white-space:nowrap}
  .rb-grid{gap:12px}
  .wq-list{gap:12px}
  .note-list{gap:12px}
  .filters .chip{white-space:nowrap}

  /* —— 手机端答题卡页面：默认只显示题目+作答草稿，答题卡和解析悬浮弹出 —— */
  body.mode-practice .col-left{display:none !important}
  body.mode-practice #ans-section{display:none !important}
  body.mode-practice #draft-section{display:block !important}
  body.mode-practice .col-toggle-mini{display:grid !important;position:fixed !important;left:0 !important;top:50% !important;transform:translateY(-50%) !important;z-index:210 !important}
  body.mode-practice .v-splitter[data-side="right"]{display:block !important;position:fixed !important;right:0 !important;top:50% !important;transform:translateY(-50%) !important;width:28px !important;height:44px !important;background:transparent !important;border:none !important;z-index:210 !important}
  body.mode-practice .v-splitter[data-side="right"]::after{display:none !important}
  body.mode-practice .v-splitter[data-side="right"] .col-toggle{display:grid !important;position:static !important;right:auto !important;top:auto !important;transform:none !important;z-index:auto !important;width:28px !important;height:44px !important;border-radius:8px 0 0 8px !important}
  body.mode-practice.mobile-show-left .col-left{
    display:flex !important;position:fixed !important;left:0 !important;top:0 !important;bottom:0 !important;
    width:86% !important;max-width:280px !important;z-index:205 !important;

    box-shadow:2px 0 24px rgba(0,0,0,.35) !important;padding:12px !important;

  body.mode-practice.mobile-show-right #ans-section{
    display:block !important;position:fixed !important;right:0 !important;top:0 !important;bottom:0 !important;
    width:86% !important;max-width:280px !important;z-index:205 !important;
    background:var(--color-surface) !important;overflow-y:auto !important;
    box-shadow:-2px 0 24px rgba(0,0,0,.35) !important;padding:12px !important;margin:0 !important;
